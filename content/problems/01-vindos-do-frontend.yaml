- slug: carregar-tudo-junto
  title: Três pedidos, uma espera
  difficulty: medio
  kind: js
  visual: assincrono
  in:
    - backend-language/JavaScript
  study:
    - label: Promise.all (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Promise/all
    - label: Promise.allSettled (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Promise/allSettled
  setup: |
    const api = {
      bandas: () => new Promise((r) => setTimeout(() => r(['Vórtice', 'Asfalto']), 40)),
      palcos: () => new Promise((r) => setTimeout(() => r(['Norte', 'Sul']), 40)),
      horarios: () => new Promise((r) => setTimeout(() => r(['20h', '22h']), 40)),
    };
  statement: |
    A página inicial precisa de três dados, cada um com sua função no objeto `api`, que já existe: `api.bandas()`, `api.palcos()` e `api.horarios()`. Cada uma devolve uma promessa.

    Escreva `async function carregarInicio()`, que devolve `{ bandas, palcos, horarios }`. Os três pedidos são independentes, então devem rodar ao mesmo tempo, não um depois do outro.
  solution: |
    async function carregarInicio() {
      const [bandas, palcos, horarios] = await Promise.all([api.bandas(), api.palcos(), api.horarios()]);
      return { bandas, palcos, horarios };
    }
  tests:
    - name: devolve os três dados
      code: |
        expect(await carregarInicio()).toEqual({ bandas: ['Vórtice', 'Asfalto'], palcos: ['Norte', 'Sul'], horarios: ['20h', '22h'] });
    - name: pedidos em paralelo
      hidden: true
      code: |
        const inicio = Date.now();
        await carregarInicio();
        expect(Date.now() - inicio).toBeLessThan(100);
    - name: falha se um pedido falha
      hidden: true
      code: |
        api.palcos = () => Promise.reject(new Error('fora do ar'));
        await expect(carregarInicio()).rejects.toMatch('fora do ar');
  hints:
    - Três `await` seguidos esperam um pedido terminar para começar o próximo.
    - "`Promise.all` recebe uma lista de promessas e espera todas."
  explanation: |
    Cada `await` pausa a função até a promessa terminar, então três `await` seguidos somam os tempos. Criar as três promessas primeiro e esperar com `Promise.all` faz os pedidos correrem juntos, e o tempo total é o do mais lento. Se um falha, `Promise.all` rejeita na hora. `Promise.allSettled` serve quando cada resultado pode falhar sozinho.
  traps:
    - reason: Um pedido depois do outro
      code: |
        async function carregarInicio() {
          const bandas = await api.bandas();
          const palcos = await api.palcos();
          const horarios = await api.horarios();
          return { bandas, palcos, horarios };
        }
    - reason: Engole o erro
      code: |
        async function carregarInicio() {
          const [b, p, h] = await Promise.allSettled([api.bandas(), api.palcos(), api.horarios()]);
          return { bandas: b.value, palcos: p.value ?? [], horarios: h.value };
        }
- slug: tentar-de-novo
  title: A API instável
  difficulty: dificil
  kind: js
  in:
    - backend-language/JavaScript
    - more-databases/Failure Modes
  study:
    - label: Funções async (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Statements/async_function
    - label: try...catch (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Statements/try...catch
  statement: |
    A API de pagamento falha de vez em quando e funciona na tentativa seguinte. Escreva `async function comRetentativa(operacao, tentativas, espera)`:

    - chama `operacao()`, que devolve uma promessa
    - se ela rejeitar, espera `espera` milissegundos e tenta de novo, até `tentativas` vezes no total
    - devolve o primeiro resultado de sucesso
    - se todas falharem, rejeita com o erro da última tentativa
  solution: |
    async function comRetentativa(operacao, tentativas, espera) {
      let ultimoErro;
      for (let i = 0; i < tentativas; i++) {
        try {
          return await operacao();
        } catch (erro) {
          ultimoErro = erro;
          if (i < tentativas - 1) await new Promise((r) => setTimeout(r, espera));
        }
      }
      throw ultimoErro;
    }
  tests:
    - name: sucesso na segunda tentativa
      code: |
        let chamadas = 0;
        const op = () => (++chamadas < 2 ? Promise.reject(new Error('falhou')) : Promise.resolve('pago'));
        expect(await comRetentativa(op, 3, 5)).toBe('pago');
        expect(chamadas).toBe(2);
    - name: desiste depois do limite
      code: |
        let chamadas = 0;
        const op = () => Promise.reject(new Error(`falha ${++chamadas}`));
        await expect(comRetentativa(op, 3, 5)).rejects.toMatch('falha 3');
        expect(chamadas).toBe(3);
    - name: espera entre tentativas
      hidden: true
      code: |
        const horarios = [];
        const op = () => { horarios.push(Date.now()); return Promise.reject(new Error('x')); };
        await comRetentativa(op, 2, 60).catch(() => {});
        expect(horarios[1] - horarios[0]).toBeGreaterThanOrEqual(50);
    - name: sem espera depois da última
      hidden: true
      code: |
        const inicio = Date.now();
        await comRetentativa(() => Promise.reject(new Error('x')), 1, 300).catch(() => {});
        expect(Date.now() - inicio).toBeLessThan(150);
    - name: sucesso de primeira
      hidden: true
      code: |
        const op = fn(() => Promise.resolve(42));
        expect(await comRetentativa(op, 5, 5)).toBe(42);
        expect(op).toHaveBeenCalledTimes(1);
  hints:
    - "`return await` dentro do `try` faz a rejeição cair no `catch`. Sem o `await`, a promessa é devolvida antes de falhar."
    - Uma espera pode ser escrita como `await new Promise((r) => setTimeout(r, ms))`.
  explanation: |
    O laço tenta, captura a falha, espera e tenta de novo. O ponto sutil é `return await`: sem `await`, a promessa rejeitada sai da função sem passar pelo `catch`. Em produção, a espera costuma crescer a cada tentativa, num backoff exponencial, para não sobrecarregar um serviço já com problemas.
  traps:
    - reason: return sem await não captura a falha
      code: |
        async function comRetentativa(op, n, espera) {
          let erro;
          for (let i = 0; i < n; i++) {
            try { return op(); } catch (e) { erro = e; await new Promise((r) => setTimeout(r, espera)); }
          }
          throw erro;
        }
    - reason: Tenta uma vez a mais
      code: |
        async function comRetentativa(op, n, espera) {
          let erro;
          for (let i = 0; i <= n; i++) {
            try { return await op(); } catch (e) { erro = e; if (i < n) await new Promise((r) => setTimeout(r, espera)); }
          }
          throw erro;
        }
- slug: promessa-com-prazo
  title: Resposta em até 3 segundos
  difficulty: medio
  kind: js
  in:
    - backend-language/JavaScript
    - building-for-scale/Graceful Degradation
  study:
    - label: Promise.race (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Promise/race
  statement: |
    Escreva `comPrazo(promessa, ms)`, que devolve uma promessa que resolve com o resultado de `promessa`, ou rejeita com `Error('Tempo esgotado')` se ela não terminar em `ms` milissegundos. Se `promessa` rejeitar antes, rejeite com o erro dela. Não deixe o timer pendente depois que tudo terminar.
  solution: |
    function comPrazo(promessa, ms) {
      let timer;
      const prazo = new Promise((_, rejeitar) => {
        timer = setTimeout(() => rejeitar(new Error('Tempo esgotado')), ms);
      });
      return Promise.race([promessa, prazo]).finally(() => clearTimeout(timer));
    }
  tests:
    - name: dentro do prazo
      code: |
        expect(await comPrazo(new Promise((r) => setTimeout(() => r('ok'), 10)), 100)).toBe('ok');
    - name: estoura o prazo
      code: |
        await expect(comPrazo(new Promise((r) => setTimeout(r, 200)), 20)).rejects.toMatch('Tempo esgotado');
    - name: erro da promessa
      hidden: true
      code: |
        await expect(comPrazo(Promise.reject(new Error('fora do ar')), 100)).rejects.toMatch('fora do ar');
    - name: limpa o timer
      hidden: true
      code: |
        const original = globalThis.clearTimeout;
        const limpos = [];
        globalThis.clearTimeout = (id) => { limpos.push(id); return original(id); };
        try {
          await comPrazo(Promise.resolve(1), 1000);
          expect(limpos.length).toBeGreaterThan(0);
        } finally {
          globalThis.clearTimeout = original;
        }
  hints:
    - "`Promise.race` resolve ou rejeita com a primeira promessa que terminar."
    - "`finally` roda nos dois casos e é um bom lugar para `clearTimeout`."
  explanation: |
    `Promise.race` com uma promessa de timeout é o jeito clássico de dar prazo a uma operação. O `race` não cancela a operação original. Para cancelar um `fetch` de verdade, use `AbortSignal.timeout(ms)`.
  traps:
    - reason: Não limpa o timer
      code: |
        function comPrazo(p, ms) { return Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('Tempo esgotado')), ms))]); }
- slug: json-seguro
  title: Configuração corrompida
  difficulty: facil
  kind: js
  in:
    - backend-language/JavaScript
  study:
    - label: JSON.parse (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse
    - label: SyntaxError (MDN, em inglês)
      url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/SyntaxError
  statement: |
    O app guarda preferências como texto JSON. Às vezes o texto chega corrompido ou vazio.

    Escreva `lerJSON(texto, padrao)`, que devolve o valor lido ou `padrao` quando o texto não é um JSON válido. Erros que não são de leitura do JSON não devem ser escondidos.
  solution: |
    function lerJSON(texto, padrao) {
      try {
        return JSON.parse(texto);
      } catch (erro) {
        if (erro instanceof SyntaxError) return padrao;
        throw erro;
      }
    }
  tests:
    - name: JSON válido
      code: |
        expect(lerJSON('{"tema":"escuro"}', {})).toEqual({ tema: 'escuro' });
    - name: JSON corrompido
      code: |
        expect(lerJSON('{"tema":', { tema: 'claro' })).toEqual({ tema: 'claro' });
    - name: vazio e nulo
      hidden: true
      code: |
        expect(lerJSON('', 1)).toBe(1);
        expect(lerJSON('null', 1)).toBeNull();
        expect(lerJSON('false', true)).toBe(false);
    - name: não esconde outros erros
      hidden: true
      code: |
        const original = JSON.parse;
        JSON.parse = () => { throw new TypeError('quebrou'); };
        try {
          expect(() => lerJSON('{}', {})).toThrow('quebrou');
        } finally {
          JSON.parse = original;
        }
  hints:
    - "`JSON.parse` lança `SyntaxError` quando o texto é inválido."
    - Um `catch` que devolve o padrão para qualquer erro esconde defeitos de verdade. Confira o tipo do erro.
  explanation: |
    `try/catch` permite tratar a falha esperada, aqui o texto inválido, sem derrubar o app. Conferir `instanceof SyntaxError` e relançar o resto evita engolir erros inesperados. `null` e `false` são JSON válidos e não podem virar o valor padrão.
  traps:
    - reason: Trata null e false como falha
      code: |
        function lerJSON(t, p) { try { return JSON.parse(t) || p; } catch { return p; } }
    - reason: Engole qualquer erro
      code: |
        function lerJSON(t, p) { try { return JSON.parse(t); } catch { return p; } }
- slug: erro-de-validacao
  title: Erro que diz onde
  difficulty: medio
  kind: js
  in:
    - backend-language/JavaScript
    - apis/JSON APIs
  study:
    - label: Error e tipos de erro personalizados (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Error
  statement: |
    O formulário de compra precisa saber qual campo falhou, para destacá-lo na tela.

    1. Crie a classe `ErroDeValidacao`, que estende `Error`, recebe `(campo, mensagem)` e guarda `campo`. O `name` do erro deve ser `'ErroDeValidacao'`.
    2. Escreva `validarCompra(compra)`: lança `ErroDeValidacao('email', ...)` se o e-mail não tiver `@`, e `ErroDeValidacao('quantidade', ...)` se a quantidade não estiver entre 1 e 6. Se tudo estiver certo, devolve `true`.
  solution: |
    class ErroDeValidacao extends Error {
      constructor(campo, mensagem) {
        super(mensagem);
        this.name = 'ErroDeValidacao';
        this.campo = campo;
      }
    }

    function validarCompra(compra) {
      if (!String(compra.email ?? '').includes('@')) throw new ErroDeValidacao('email', 'E-mail inválido');
      if (!(compra.quantidade >= 1 && compra.quantidade <= 6)) throw new ErroDeValidacao('quantidade', 'Escolha de 1 a 6 ingressos');
      return true;
    }
  tests:
    - name: compra válida
      code: |
        expect(validarCompra({ email: 'fa@exemplo.com', quantidade: 2 })).toBe(true);
    - name: campo do erro
      code: |
        try {
          validarCompra({ email: 'sem-arroba', quantidade: 2 });
          throw new Error('devia ter lançado');
        } catch (erro) {
          expect(erro).toBeInstanceOf(ErroDeValidacao);
          expect(erro.campo).toBe('email');
        }
    - name: é um Error de verdade
      hidden: true
      code: |
        const erro = new ErroDeValidacao('quantidade', 'demais');
        expect(erro).toBeInstanceOf(Error);
        expect(erro.message).toBe('demais');
        expect(erro.name).toBe('ErroDeValidacao');
        expect(typeof erro.stack).toBe('string');
    - name: quantidade fora do limite
      hidden: true
      code: |
        for (const quantidade of [0, 7, undefined]) {
          try {
            validarCompra({ email: 'fa@exemplo.com', quantidade });
            throw new Error('devia ter lançado');
          } catch (erro) {
            expect(erro.campo).toBe('quantidade');
          }
        }
  hints:
    - Num construtor de subclasse, chame `super(mensagem)` antes de usar `this`.
  explanation: |
    Estender `Error` mantém `message`, `stack` e o funcionamento com `instanceof`, e acrescenta o que o código que trata o erro precisa, como o `campo`. Definir `name` faz o console e os logs mostrarem o tipo certo. Lançar um objeto comum perderia o stack trace.
  traps:
    - reason: Lança um objeto comum
      code: |
        class ErroDeValidacao { constructor(campo, mensagem) { this.campo = campo; this.message = mensagem; this.name = 'ErroDeValidacao'; } }
        function validarCompra(c) {
          if (!String(c.email ?? '').includes('@')) throw new ErroDeValidacao('email', 'E-mail inválido');
          if (!(c.quantidade >= 1 && c.quantidade <= 6)) throw new ErroDeValidacao('quantidade', 'x');
          return true;
        }
    - reason: undefined passa na validação
      code: |
        class ErroDeValidacao extends Error { constructor(campo, m) { super(m); this.name = 'ErroDeValidacao'; this.campo = campo; } }
        function validarCompra(c) {
          if (!String(c.email ?? '').includes('@')) throw new ErroDeValidacao('email', 'E-mail inválido');
          if (c.quantidade < 1 || c.quantidade > 6) throw new ErroDeValidacao('quantidade', 'x');
          return true;
        }
- slug: emissor-de-eventos
  title: Avisos do festival
  difficulty: dificil
  kind: js
  in:
    - backend-language/JavaScript
  study:
    - label: Classes (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Classes
    - label: EventTarget (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/API/EventTarget
  statement: |
    Escreva a classe `Emissor`:

    - `on(evento, fn)` registra um ouvinte e devolve uma função que o remove
    - `off(evento, fn)` remove o ouvinte
    - `emit(evento, ...args)` chama os ouvintes daquele evento, na ordem de registro
    - `once(evento, fn)` registra um ouvinte que roda uma vez só

    Um ouvinte que remove outro durante o `emit` não deve fazer ninguém ser pulado nessa rodada.
  solution: |
    class Emissor {
      #ouvintes = new Map();

      on(evento, fn) {
        if (!this.#ouvintes.has(evento)) this.#ouvintes.set(evento, []);
        this.#ouvintes.get(evento).push(fn);
        return () => this.off(evento, fn);
      }

      off(evento, fn) {
        const lista = this.#ouvintes.get(evento);
        if (!lista) return;
        const i = lista.indexOf(fn);
        if (i !== -1) lista.splice(i, 1);
      }

      once(evento, fn) {
        const embrulho = (...args) => {
          this.off(evento, embrulho);
          fn(...args);
        };
        return this.on(evento, embrulho);
      }

      emit(evento, ...args) {
        for (const fn of [...(this.#ouvintes.get(evento) ?? [])]) fn(...args);
      }
    }
  tests:
    - name: emite para os ouvintes
      code: |
        const e = new Emissor();
        const a = fn();
        e.on('show', a);
        e.emit('show', 'Vórtice', 22);
        expect(a).toHaveBeenCalledWith('Vórtice', 22);
    - name: off e a função de remover
      code: |
        const e = new Emissor();
        const a = fn();
        const tirar = e.on('show', a);
        tirar();
        e.emit('show');
        expect(a).not.toHaveBeenCalled();
    - name: once
      hidden: true
      code: |
        const e = new Emissor();
        const a = fn();
        e.once('abre', a);
        e.emit('abre');
        e.emit('abre');
        expect(a).toHaveBeenCalledTimes(1);
    - name: remover durante o emit
      hidden: true
      code: |
        const e = new Emissor();
        const b = fn();
        const a = () => e.off('x', a);
        e.on('x', a); e.on('x', b);
        e.emit('x');
        expect(b).toHaveBeenCalledTimes(1);
        e.emit('x');
        expect(b).toHaveBeenCalledTimes(2);
    - name: eventos independentes
      hidden: true
      code: |
        const e = new Emissor();
        const a = fn();
        e.on('a', a);
        e.emit('b');
        expect(a).not.toHaveBeenCalled();
  hints:
    - Guarde uma lista de funções por nome de evento.
    - No `emit`, percorra uma cópia da lista, para que remoções durante a rodada não mudem os índices.
  explanation: |
    Esse padrão, observador ou pub/sub, desacopla quem avisa de quem reage. O detalhe que mais causa bugs é alterar a lista enquanto ela é percorrida. Iterar sobre uma cópia resolve. Devolver a função de remoção deixa a limpeza simples, como no retorno de um `useEffect`.
  traps:
    - reason: Remover durante o emit pula ouvintes
      code: |
        class Emissor {
          l = {};
          on(e, f) { (this.l[e] ??= []).push(f); return () => this.off(e, f); }
          off(e, f) { const a = this.l[e]; if (a) { const i = a.indexOf(f); if (i >= 0) a.splice(i, 1); } }
          once(e, f) { const w = (...x) => { this.off(e, w); f(...x); }; return this.on(e, w); }
          emit(e, ...x) { const a = this.l[e] ?? []; for (let i = 0; i < a.length; i++) a[i](...x); }
        }
    - reason: once que nunca sai
      code: |
        class Emissor {
          l = {};
          on(e, f) { (this.l[e] ??= []).push(f); return () => this.off(e, f); }
          off(e, f) { const a = this.l[e]; if (a) { const i = a.indexOf(f); if (i >= 0) a.splice(i, 1); } }
          once(e, f) { const w = (...x) => { this.off(e, f); f(...x); }; return this.on(e, w); }
          emit(e, ...x) { for (const f of [...(this.l[e] ?? [])]) f(...x); }
        }
- slug: cache-lru
  title: Cache dos mais recentes
  difficulty: dificil
  kind: js
  visual: cache-aside
  in:
    - caching/Redis
  study:
    - label: Map e a ordem de inserção (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Map
  statement: |
    O app guarda as últimas páginas de bandas visitadas. Escreva a classe `CacheLRU(limite)`:

    - `get(chave)` devolve o valor, ou `undefined`, e marca a chave como usada agora
    - `set(chave, valor)` guarda. Se passar do limite, remove a chave usada há mais tempo
    - `size` informa quantos itens há
  solution: |
    class CacheLRU {
      #mapa = new Map();

      constructor(limite) {
        this.limite = limite;
      }

      get size() {
        return this.#mapa.size;
      }

      get(chave) {
        if (!this.#mapa.has(chave)) return undefined;
        const valor = this.#mapa.get(chave);
        this.#mapa.delete(chave);
        this.#mapa.set(chave, valor);
        return valor;
      }

      set(chave, valor) {
        this.#mapa.delete(chave);
        this.#mapa.set(chave, valor);
        if (this.#mapa.size > this.limite) this.#mapa.delete(this.#mapa.keys().next().value);
      }
    }
  tests:
    - name: guarda e devolve
      code: |
        const c = new CacheLRU(2);
        c.set('a', 1);
        expect(c.get('a')).toBe(1);
        expect(c.get('x')).toBeUndefined();
    - name: remove o mais antigo
      code: |
        const c = new CacheLRU(2);
        c.set('a', 1); c.set('b', 2); c.set('c', 3);
        expect(c.get('a')).toBeUndefined();
        expect(c.size).toBe(2);
    - name: get renova a chave
      hidden: true
      code: |
        const c = new CacheLRU(2);
        c.set('a', 1); c.set('b', 2);
        c.get('a');
        c.set('c', 3);
        expect(c.get('a')).toBe(1);
        expect(c.get('b')).toBeUndefined();
    - name: set de chave existente
      hidden: true
      code: |
        const c = new CacheLRU(2);
        c.set('a', 1); c.set('b', 2); c.set('a', 10); c.set('c', 3);
        expect(c.get('a')).toBe(10);
        expect(c.get('b')).toBeUndefined();
        expect(c.size).toBe(2);
  hints:
    - Um `Map` guarda as chaves na ordem de inserção. A primeira é a mais antiga.
    - Para marcar como recente, apague e insira de novo.
  explanation: |
    LRU, menos usado recentemente, descarta o que não é acessado há mais tempo. O `Map` faz o trabalho pesado: apagar e reinserir move a chave para o fim, e `keys().next()` dá a mais antiga em tempo constante.
  traps:
    - reason: get não renova
      code: |
        class CacheLRU {
          m = new Map(); constructor(l) { this.l = l; } get size() { return this.m.size; }
          get(k) { return this.m.get(k); }
          set(k, v) { this.m.delete(k); this.m.set(k, v); if (this.m.size > this.l) this.m.delete(this.m.keys().next().value); }
        }
    - reason: Atualizar não renova a posição
      code: |
        class CacheLRU {
          m = new Map(); constructor(l) { this.l = l; } get size() { return this.m.size; }
          get(k) { if (!this.m.has(k)) return undefined; const v = this.m.get(k); this.m.delete(k); this.m.set(k, v); return v; }
          set(k, v) { this.m.set(k, v); if (this.m.size > this.l) this.m.delete(this.m.keys().next().value); }
        }
- slug: lembrar-resultado
  title: Não calcule duas vezes
  difficulty: medio
  kind: js
  visual: cache-aside
  in:
    - caching/Memcached
  study:
    - label: Memoização (MDN, em inglês)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Memoization
    - label: Map (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Map
  statement: |
    Escreva `memorizar(funcao)`, que devolve uma versão de `funcao` que guarda o resultado para cada argumento. Chamadas repetidas com o mesmo argumento devolvem o resultado guardado, sem chamar `funcao` de novo. A função recebe um único argumento, que pode ser qualquer valor, inclusive `undefined` ou um objeto.
  solution: |
    function memorizar(funcao) {
      const cache = new Map();
      return (arg) => {
        if (!cache.has(arg)) cache.set(arg, funcao(arg));
        return cache.get(arg);
      };
    }
  tests:
    - name: guarda o resultado
      code: |
        const lenta = fn((n) => n * 2);
        const rapida = memorizar(lenta);
        expect(rapida(4)).toBe(8);
        expect(rapida(4)).toBe(8);
        expect(lenta).toHaveBeenCalledTimes(1);
    - name: argumentos diferentes
      hidden: true
      code: |
        const lenta = fn((n) => n + 1);
        const r = memorizar(lenta);
        r(1); r(2); r(1);
        expect(lenta).toHaveBeenCalledTimes(2);
    - name: resultados falsos também
      hidden: true
      code: |
        const lenta = fn(() => 0);
        const r = memorizar(lenta);
        r('x'); r('x');
        expect(lenta).toHaveBeenCalledTimes(1);
    - name: objetos como chave
      hidden: true
      code: |
        const lenta = fn((o) => o.n);
        const r = memorizar(lenta);
        const a = { n: 1 };
        const b = { n: 1 };
        r(a); r(a); r(b);
        expect(lenta).toHaveBeenCalledTimes(2);
  hints:
    - Um `Map` aceita qualquer valor como chave, inclusive objetos.
    - Confira se a chave existe com `has`, e não pelo valor guardado, que pode ser `0` ou `undefined`.
  explanation: |
    Memoizar troca memória por tempo: o primeiro cálculo é guardado, e os seguintes são uma consulta. `Map` compara objetos por referência, sem converter para texto. Conferir com `has` evita recalcular resultados falsos. Em produção, limite o tamanho do cache.
  traps:
    - reason: Recalcula resultados falsos
      code: |
        function memorizar(f) { const c = new Map(); return (a) => c.get(a) || (c.set(a, f(a)), c.get(a)); }
    - reason: Objeto comum converte a chave em texto
      code: |
        function memorizar(f) { const c = {}; return (a) => (a in c ? c[a] : (c[a] = f(a))); }
- slug: conserte-async-no-foreach
  title: O total sai antes de terminar
  difficulty: dificil
  kind: js
  in:
    - conserte/Lógica
  study:
    - label: for await e laços com async (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Statements/for-await...of
    - label: Array.prototype.forEach (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Array/forEach
  setup: |
    const api = {
      precoDe: (setor) => new Promise((r) => setTimeout(() => r({ pista: 300, premium: 520, camarote: 900 }[setor]), 20)),
    };
  statement: |
    `totalDoCarrinho(setores)` busca o preço de cada setor em `api.precoDe(setor)`, que devolve uma promessa, e soma. A função sempre devolve 0.

    Corrija para devolver a soma correta. Os pedidos de preço podem correr em paralelo.
  starter: |
    async function totalDoCarrinho(setores) {
      let total = 0;
      setores.forEach(async (setor) => {
        total += await api.precoDe(setor);
      });
      return total;
    }
  solution: |
    async function totalDoCarrinho(setores) {
      const precos = await Promise.all(setores.map((setor) => api.precoDe(setor)));
      return precos.reduce((soma, p) => soma + p, 0);
    }
  tests:
    - name: soma
      code: |
        expect(await totalDoCarrinho(['pista', 'camarote'])).toBe(1200);
    - name: vazio
      hidden: true
      code: |
        expect(await totalDoCarrinho([])).toBe(0);
    - name: em paralelo
      hidden: true
      code: |
        const inicio = Date.now();
        expect(await totalDoCarrinho(['pista', 'premium', 'camarote', 'pista'])).toBe(2020);
        expect(Date.now() - inicio).toBeLessThan(60);
  hints:
    - "`forEach` não espera as funções async: ele dispara todas e segue em frente."
    - "`Promise.all` com `map` espera todas as promessas, em paralelo."
  explanation: |
    `forEach` ignora as promessas devolvidas pelo callback, então o `return` acontece antes de qualquer `await` terminar. Use `for...of` com `await`, para fazer um de cada vez, ou `Promise.all` com `map`, para fazer em paralelo.
  traps:
    - reason: Um pedido de cada vez
      code: |
        async function totalDoCarrinho(s) { let t = 0; for (const x of s) t += await api.precoDe(x); return t; }
- slug: conserte-total-do-pedido
  title: O total que quebra
  difficulty: medio
  kind: js
  in:
    - conserte/Lógica
  study:
    - label: Laços e iteração (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Loops_and_iteration
  statement: |
    Clientes relatam dois problemas no checkout:

    - finalizar a compra mostra `Cannot read properties of undefined`
    - quando a compra tem mais de um setor, a taxa de serviço sai maior que 10%

    A regra é: some `preco * quantidade` de cada item e aplique uma única taxa de serviço de 10% sobre o total. Arredonde para 2 casas. Um pedido vazio custa 0.
  starter: |
    function totalDoPedido(itens) {
      let total = 0;
      for (let i = 0; i <= itens.length; i++) {
        total += itens[i].preco * itens[i].quantidade;
        total += total * 0.1;
      }
      return Math.round(total * 100) / 100;
    }
  solution: |
    function totalDoPedido(itens) {
      let total = 0;
      for (let i = 0; i < itens.length; i++) {
        total += itens[i].preco * itens[i].quantidade;
      }
      total += total * 0.1;
      return Math.round(total * 100) / 100;
    }
  tests:
    - name: um item
      code: |
        expect(totalDoPedido([{ preco: 300, quantidade: 2 }])).toBe(660);
    - name: dois setores
      code: |
        expect(totalDoPedido([{ preco: 300, quantidade: 1 }, { preco: 900, quantidade: 1 }])).toBe(1320);
    - name: pedido vazio
      hidden: true
      code: |
        expect(totalDoPedido([])).toBe(0);
    - name: centavos
      hidden: true
      code: |
        expect(totalDoPedido([{ preco: 33.33, quantidade: 3 }])).toBe(109.99);
  hints:
    - O índice do último item é `itens.length - 1`. Olhe a condição do laço.
    - A taxa está sendo aplicada a cada volta do laço, sobre um total que já tem taxa.
  explanation: |
    Dois defeitos clássicos: o `<=` faz o laço ler uma posição depois do fim, e a taxa dentro do laço vira juros compostos a cada item. Com um item só, o segundo defeito não aparece. Por isso o teste com dois setores é o que o expõe.
  traps:
    - reason: Corrige só o laço
      code: |
        function totalDoPedido(itens) {
          let total = 0;
          for (let i = 0; i < itens.length; i++) { total += itens[i].preco * itens[i].quantidade; total += total * 0.1; }
          return Math.round(total * 100) / 100;
        }
- slug: conserte-mesmo-dia
  title: O show de hoje não aparece
  difficulty: medio
  kind: js
  in:
    - conserte/Lógica
  study:
    - label: Date (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Date
    - label: Igualdade em JavaScript (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness
  statement: |
    A seção "Hoje no festival" usa `mesmoDia(a, b)` para filtrar os shows, mas nunca mostra nada. As duas datas são objetos `Date`, e "mesmo dia" é o mesmo ano, mês e dia no horário local, qualquer que seja a hora.

    Encontre o defeito e corrija.
  starter: |
    function mesmoDia(a, b) {
      const diaA = new Date(a.getFullYear(), a.getMonth(), a.getDate());
      const diaB = new Date(b.getFullYear(), b.getMonth(), b.getDate());
      return diaA === diaB;
    }
  solution: |
    function mesmoDia(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
  tests:
    - name: mesmo dia, horas diferentes
      code: |
        expect(mesmoDia(new Date(2026, 2, 14, 9, 0), new Date(2026, 2, 14, 23, 30))).toBe(true);
    - name: dias diferentes
      code: |
        expect(mesmoDia(new Date(2026, 2, 14), new Date(2026, 2, 15))).toBe(false);
    - name: mesmo dia em outro mês ou ano
      hidden: true
      code: |
        expect(mesmoDia(new Date(2026, 2, 14), new Date(2026, 3, 14))).toBe(false);
        expect(mesmoDia(new Date(2025, 2, 14), new Date(2026, 2, 14))).toBe(false);
  hints:
    - "`===` entre dois objetos compara se são o mesmo objeto, não se têm o mesmo valor."
  explanation: |
    Dois objetos `Date` com o mesmo instante são objetos diferentes, então `===` dá sempre `false`. Compare os valores, seja com `getTime()`, seja com os componentes da data. Para comparar só o dia, os componentes evitam surpresas com fuso e horário de verão.
  traps:
    - reason: Compara o instante, com a hora
      code: |
        function mesmoDia(a, b) { return a.getTime() === b.getTime(); }
    - reason: Esquece o ano
      code: |
        function mesmoDia(a, b) { return a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
- slug: implemente-desfazer
  title: Desfazer no carrinho
  difficulty: dificil
  kind: js
  in:
    - implemente/Funcionalidades
  study:
    - label: Classes (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Classes
  starter: |
    class Carrinho {
      itens = {};

      adicionar(setor, quantidade = 1) {
        this.itens[setor] = (this.itens[setor] ?? 0) + quantidade;
      }

      remover(setor) {
        delete this.itens[setor];
      }

      quantidade(setor) {
        return this.itens[setor] ?? 0;
      }
    }
  statement: |
    O carrinho já funciona. Acrescente `desfazer()`, que desfaz a última operação de `adicionar` ou `remover`, uma por chamada, quantas vezes houver no histórico. Com o histórico vazio, `desfazer()` não faz nada e devolve `false`. Quando desfaz algo, devolve `true`.

    Remover um setor e desfazer deve trazer de volta a quantidade que ele tinha.
  solution: |
    class Carrinho {
      itens = {};
      #historico = [];

      adicionar(setor, quantidade = 1) {
        this.#historico.push({ setor, antes: this.itens[setor] });
        this.itens[setor] = (this.itens[setor] ?? 0) + quantidade;
      }

      remover(setor) {
        this.#historico.push({ setor, antes: this.itens[setor] });
        delete this.itens[setor];
      }

      desfazer() {
        const ultimo = this.#historico.pop();
        if (!ultimo) return false;
        if (ultimo.antes === undefined) delete this.itens[ultimo.setor];
        else this.itens[ultimo.setor] = ultimo.antes;
        return true;
      }

      quantidade(setor) {
        return this.itens[setor] ?? 0;
      }
    }
  tests:
    - name: desfaz uma adição
      code: |
        const c = new Carrinho();
        c.adicionar('pista', 2);
        c.adicionar('pista', 1);
        expect(c.desfazer()).toBe(true);
        expect(c.quantidade('pista')).toBe(2);
    - name: desfaz uma remoção
      hidden: true
      code: |
        const c = new Carrinho();
        c.adicionar('camarote', 3);
        c.remover('camarote');
        c.desfazer();
        expect(c.quantidade('camarote')).toBe(3);
    - name: várias vezes até o começo
      hidden: true
      code: |
        const c = new Carrinho();
        c.adicionar('pista');
        c.adicionar('premium', 2);
        c.desfazer();
        c.desfazer();
        expect(c.itens).toEqual({});
        expect(c.desfazer()).toBe(false);
  hints:
    - Guarde, a cada operação, o setor e a quantidade que ele tinha antes.
    - Desfazer é restaurar esse valor anterior, ou apagar o setor se ele não existia.
  explanation: |
    Guardar o estado anterior de cada operação é uma forma simples de desfazer, parente do padrão Command. Restaurar o valor anterior funciona para adicionar e para remover, sem código especial para cada uma.
  traps:
    - reason: Desfazer só subtrai
      code: |
        class Carrinho {
          itens = {}; h = [];
          adicionar(s, q = 1) { this.h.push([s, q]); this.itens[s] = (this.itens[s] ?? 0) + q; }
          remover(s) { delete this.itens[s]; }
          desfazer() { const u = this.h.pop(); if (!u) return false; this.itens[u[0]] -= u[1]; if (!this.itens[u[0]]) delete this.itens[u[0]]; return true; }
          quantidade(s) { return this.itens[s] ?? 0; }
        }
- slug: implemente-cupom-no-carrinho
  title: Cupom no carrinho
  difficulty: medio
  kind: js
  in:
    - implemente/Funcionalidades
  study:
    - label: Classes (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Classes
    - label: Object.hasOwn (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Object/hasOwn
  starter: |
    class Carrinho {
      itens = [];

      adicionar(setor, preco, quantidade = 1) {
        this.itens.push({ setor, preco, quantidade });
      }

      subtotal() {
        return this.itens.reduce((t, i) => t + i.preco * i.quantidade, 0);
      }

      total() {
        return this.subtotal();
      }
    }
  statement: |
    O carrinho já existe. Acrescente cupons sem quebrar o que funciona:

    - `aplicarCupom(codigo)`: aceita `RUIDO10`, 10% de desconto, e `MEIA50`, 50% de desconto, sem diferenciar maiúsculas e minúsculas. Um código desconhecido lança `Error` e mantém o cupom anterior
    - só um cupom vale por vez: aplicar outro substitui o anterior
    - `removerCupom()` volta ao preço cheio
    - `total()` aplica o desconto e arredonda para 2 casas. `subtotal()` continua sem desconto
  solution: |
    const CUPONS = { RUIDO10: 0.1, MEIA50: 0.5 };

    class Carrinho {
      itens = [];
      desconto = 0;

      adicionar(setor, preco, quantidade = 1) {
        this.itens.push({ setor, preco, quantidade });
      }

      subtotal() {
        return this.itens.reduce((t, i) => t + i.preco * i.quantidade, 0);
      }

      aplicarCupom(codigo) {
        const desconto = CUPONS[String(codigo).toUpperCase()];
        if (desconto === undefined || !Object.hasOwn(CUPONS, String(codigo).toUpperCase())) throw new Error('Cupom inválido');
        this.desconto = desconto;
      }

      removerCupom() {
        this.desconto = 0;
      }

      total() {
        return Math.round(this.subtotal() * (1 - this.desconto) * 100) / 100;
      }
    }
  tests:
    - name: o carrinho continua funcionando
      code: |
        const c = new Carrinho();
        c.adicionar('pista', 300, 2);
        expect(c.total()).toBe(600);
    - name: aplica o cupom
      code: |
        const c = new Carrinho();
        c.adicionar('pista', 300, 2);
        c.aplicarCupom('RUIDO10');
        expect(c.total()).toBe(540);
        expect(c.subtotal()).toBe(600);
    - name: substitui e remove
      hidden: true
      code: |
        const c = new Carrinho();
        c.adicionar('camarote', 900);
        c.aplicarCupom('ruido10');
        c.aplicarCupom('MEIA50');
        expect(c.total()).toBe(450);
        c.removerCupom();
        expect(c.total()).toBe(900);
    - name: cupom inválido
      hidden: true
      code: |
        const c = new Carrinho();
        c.adicionar('pista', 300);
        c.aplicarCupom('RUIDO10');
        expect(() => c.aplicarCupom('GRATIS')).toThrow();
        expect(() => c.aplicarCupom('constructor')).toThrow();
        expect(c.total()).toBe(270);
    - name: arredonda
      hidden: true
      code: |
        const c = new Carrinho();
        c.adicionar('pista', 33.33);
        c.aplicarCupom('RUIDO10');
        expect(c.total()).toBe(30);
  hints:
    - Guarde o desconto atual como um número entre 0 e 1. Sem cupom, ele vale 0.
    - Valide o código antes de alterar o desconto, para um erro não apagar o cupom anterior.
  explanation: |
    A funcionalidade nova entra como um estado a mais, o desconto, e o `total` passa a usá-lo, sem mudar o `subtotal`, que outras partes podem usar. Validar antes de alterar preserva o estado anterior num erro. `Object.hasOwn` evita que nomes herdados, como `constructor`, passem por cupom válido.
  traps:
    - reason: Desconto acumula
      code: |
        class Carrinho {
          itens = []; fator = 1;
          adicionar(s, p, q = 1) { this.itens.push({ s, p, q }); }
          subtotal() { return this.itens.reduce((t, i) => t + i.p * i.q, 0); }
          aplicarCupom(c) { const d = { RUIDO10: 0.9, MEIA50: 0.5 }[c.toUpperCase()]; if (!d) throw new Error('x'); this.fator *= d; }
          removerCupom() { this.fator = 1; }
          total() { return Math.round(this.subtotal() * this.fator * 100) / 100; }
        }
    - reason: Erro apaga o cupom anterior
      code: |
        class Carrinho {
          itens = []; d = 0;
          adicionar(s, p, q = 1) { this.itens.push({ s, p, q }); }
          subtotal() { return this.itens.reduce((t, i) => t + i.p * i.q, 0); }
          aplicarCupom(c) { this.d = 0; const v = { RUIDO10: 0.1, MEIA50: 0.5 }[c.toUpperCase()]; if (v === undefined) throw new Error('x'); this.d = v; }
          removerCupom() { this.d = 0; }
          total() { return Math.round(this.subtotal() * (1 - this.d) * 100) / 100; }
        }
- slug: desfazer-commit-publicado
  title: O commit que quebrou a produção
  difficulty: medio
  kind: quiz
  visual: git
  in:
    - version-control/Git
  study:
    - label: git revert (documentação oficial)
      url: https://git-scm.com/docs/git-revert
    - label: Reescrevendo o histórico (Pro Git)
      url: https://git-scm.com/book/pt-br/v2/Ferramentas-do-Git-Reescrevendo-o-Hist%C3%B3rico
  statement: |
    Você fez push de um commit na `main` que quebrou a página de ingressos. Outras três pessoas já baixaram a `main` e fizeram commits por cima.

    Qual é o jeito seguro de desfazer a mudança?
  options:
    - text: "`git revert <commit>`, que cria um novo commit desfazendo o anterior, e depois push"
      why: Certo. O histórico publicado continua o mesmo, e quem já baixou a main recebe o novo commit normalmente.
    - text: "`git reset --hard HEAD~1` seguido de `git push --force`"
      why: Isso reescreve o histórico publicado. Quem já tinha o commit fica com um histórico divergente e pode trazê-lo de volta sem perceber.
    - text: Apagar o repositório remoto e criar de novo a partir da sua máquina
      why: Isso perde o trabalho que os outros publicaram, as issues, as revisões e as configurações do repositório.
    - text: "`git checkout <commit>~1` e continuar trabalhando a partir dali"
      why: Isso só muda o que está no seu diretório, sem alterar nenhum branch. A main continua quebrada.
  answer: 0
  explanation: |
    Num histórico compartilhado, prefira adicionar commits a reescrever os que existem. `git revert` aplica o inverso de um commit como um commit novo. `reset` e `push --force` só são seguros em branches que só você usa.
