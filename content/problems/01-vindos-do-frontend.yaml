      url: https://vite.dev/guide/env-and-mode
  statement: |
    O site do festival é uma SPA hospedada como arquivos estáticos. Você quer chamar a API de um modelo, seja da Anthropic, da OpenAI ou do Google Gemini, a partir do chat de ajuda.

    Onde deve ficar a chave da API?
  options:
    - text: Num backend ou função serverless que recebe a pergunta do site, chama a API com a chave e devolve só a resposta
      why: Certo. A chave nunca chega ao navegador, e o backend ainda pode limitar uso por pessoa e filtrar pedidos.
    - text: Numa variável de ambiente do Vite, como `VITE_API_KEY`
      why: Variáveis com prefixo `VITE_` são embutidas no JavaScript do build e qualquer pessoa pode lê-las.
    - text: No código, mas ofuscada
      why: Ofuscação só atrasa. A chave precisa estar legível em algum momento para ser enviada, e o DevTools mostra a requisição.
    - text: No localStorage, digitada uma vez pela equipe
      why: O localStorage fica no navegador de quem acessa. A chave não chegaria aos visitantes, ou ficaria exposta a eles.
  answer: 0
  explanation: |
    Tudo o que vai para o navegador pode ser lido por quem acessa a página. Chaves de APIs pagas ficam no servidor, que funciona como intermediário. Esse intermediário também é o lugar de limitar taxa, registrar uso e impedir que o seu endpoint vire um proxy gratuito para terceiros.
- slug: custo-da-chamada
  title: Quanto custa cada resposta
  difficulty: facil
  kind: js
  in:
    - ai-integration/Anthropic
    - ai-integration/OpenAI
  study:
    - label: Preços da API (Anthropic)
      url: https://docs.claude.com/en/docs/about-claude/pricing
  statement: |
    APIs de modelos cobram por milhão de tokens, com preços diferentes para entrada e saída. Escreva `custo(uso, preco)`:

    - `uso` é `{ entrada, saida }`, em tokens
    - `preco` é `{ entrada, saida }`, em dólares por milhão de tokens
    - devolva o custo em dólares, arredondado para 6 casas decimais
  solution: |
    function custo(uso, preco) {
      const total = (uso.entrada * preco.entrada + uso.saida * preco.saida) / 1_000_000;
      return Math.round(total * 1e6) / 1e6;
    }
  tests:
    - name: entrada e saída
      code: |
        expect(custo({ entrada: 2000, saida: 500 }, { entrada: 3, saida: 15 })).toBe(0.0135);
    - name: zero
      hidden: true
      code: |
        expect(custo({ entrada: 0, saida: 0 }, { entrada: 3, saida: 15 })).toBe(0);
    - name: preços diferentes
      hidden: true
      code: |
        expect(custo({ entrada: 1_000_000, saida: 1 }, { entrada: 1, saida: 5 })).toBe(1.000005);
  hints:
    - Multiplique os tokens pelo preço e divida por um milhão.
  explanation: |
    Saber o custo por chamada ajuda a escolher o modelo, o tamanho do contexto e o limite de saída. Tokens de saída costumam custar várias vezes mais que os de entrada, então respostas longas pesam mais na conta.
  traps:
    - reason: Mesmo preço para entrada e saída
      code: |
        function custo(u, p) { return Math.round(((u.entrada + u.saida) * p.entrada) / 1e6 * 1e6) / 1e6; }
- slug: satisfaz-versao
  title: Implemente o circunflexo
  difficulty: dificil
  kind: js
  in:
    - backend-language/JavaScript
  study:
    - label: Versionamento semântico
      url: https://semver.org/lang/pt-BR/
    - label: Calculadora de versões semânticas (npm)
      url: https://semver.npmjs.com/
  statement: |
    Escreva `satisfaz(versao, faixa)`, que diz se uma versão `MAIOR.MENOR.CORREÇÃO` atende a uma faixa. Aceite três formatos de faixa:

    - exata: `1.2.3` aceita só `1.2.3`
    - til: `~1.2.3` aceita `>=1.2.3` e `<1.3.0`
    - circunflexo: `^1.2.3` aceita `>=1.2.3` e menor que a próxima versão do primeiro número diferente de zero. `^1.2.3` vai até `<2.0.0`, `^0.2.3` até `<0.3.0`, e `^0.0.3` até `<0.0.4`

    Compare os números como números: `1.10.0` é maior que `1.9.0`.
  solution: |
    function satisfaz(versao, faixa) {
      const partes = (v) => v.split('.').map(Number);
      const comparar = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
      const v = partes(versao);
      const operador = faixa[0] === '^' || faixa[0] === '~' ? faixa[0] : '';
      const base = partes(operador ? faixa.slice(1) : faixa);
      if (!operador) return comparar(v, base) === 0;
      let limite;
      if (operador === '~') limite = [base[0], base[1] + 1, 0];
      else if (base[0] > 0) limite = [base[0] + 1, 0, 0];
      else if (base[1] > 0) limite = [0, base[1] + 1, 0];
      else limite = [0, 0, base[2] + 1];
      return comparar(v, base) >= 0 && comparar(v, limite) < 0;
    }
  tests:
    - name: exata
      code: |
        expect(satisfaz('1.2.3', '1.2.3')).toBe(true);
        expect(satisfaz('1.2.4', '1.2.3')).toBe(false);
    - name: circunflexo
      code: |
        expect(satisfaz('1.9.0', '^1.2.3')).toBe(true);
        expect(satisfaz('2.0.0', '^1.2.3')).toBe(false);
        expect(satisfaz('1.2.2', '^1.2.3')).toBe(false);
    - name: til
      code: |
        expect(satisfaz('1.2.9', '~1.2.3')).toBe(true);
        expect(satisfaz('1.3.0', '~1.2.3')).toBe(false);
    - name: números com dois dígitos
      hidden: true
      code: |
        expect(satisfaz('1.10.0', '^1.9.0')).toBe(true);
        expect(satisfaz('1.9.0', '^1.10.0')).toBe(false);
    - name: circunflexo abaixo de 1.0.0
      hidden: true
      code: |
        expect(satisfaz('0.2.9', '^0.2.3')).toBe(true);
        expect(satisfaz('0.3.0', '^0.2.3')).toBe(false);
        expect(satisfaz('0.0.3', '^0.0.3')).toBe(true);
        expect(satisfaz('0.0.4', '^0.0.3')).toBe(false);
  hints:
    - Transforme as versões em listas de três números e compare posição por posição.
    - Para o circunflexo, calcule o limite superior a partir do primeiro número diferente de zero.
  explanation: |
    Comparar versões como texto falha em `1.10.0` contra `1.9.0`. Converter para números e comparar em ordem resolve. Abaixo de 1.0.0, o versionamento semântico trata a versão menor como possível quebra, e por isso o circunflexo fica mais restrito.
  traps:
    - reason: Compara como texto
      code: |
        function satisfaz(v, f) {
          if (f[0] === '^') return v >= f.slice(1) && v.split('.')[0] === f.slice(1).split('.')[0];
          if (f[0] === '~') { const b = f.slice(1).split('.'); const x = v.split('.'); return v >= f.slice(1) && x[0] === b[0] && x[1] === b[1]; }
          return v === f;
        }
    - reason: Circunflexo sempre até a próxima versão maior
      code: |
        function satisfaz(versao, faixa) {
          const p = (v) => v.split('.').map(Number);
          const c = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
          const v = p(versao);
          const op = '^~'.includes(faixa[0]) ? faixa[0] : '';
          const b = p(op ? faixa.slice(1) : faixa);
          if (!op) return c(v, b) === 0;
          const lim = op === '~' ? [b[0], b[1] + 1, 0] : [b[0] + 1, 0, 0];
          return c(v, b) >= 0 && c(v, lim) < 0;
        }
- slug: funcao-na-borda
  title: Redirecionar pelo país
  difficulty: medio
  kind: quiz
  in:
    - architectural-patterns/Serverless
  study:
    - label: Cloudflare Workers
      url: https://developers.cloudflare.com/workers/
  statement: |
    O site deve mandar quem acessa de Portugal para a versão `/pt-pt` e o resto do mundo para `/pt-br`, com o menor atraso possível.

    Por que uma função na borda, como um Cloudflare Worker, combina com isso?
  options:
    - text: Ela roda em servidores perto de cada visitante, antes do pedido chegar à origem, e pode responder com um redirecionamento na hora
      why: Certo. Lógicas pequenas e rápidas, como redirecionamentos e cabeçalhos, ganham com a proximidade.
    - text: Ela roda no navegador da pessoa
      why: Funções na borda rodam nos servidores da rede, não no navegador.
    - text: Ela substitui o banco de dados
      why: Funções na borda são código, não armazenamento. Elas têm limites de tempo e recursos.
    - text: Ela só funciona com sites estáticos
      why: Ela pode ficar na frente de qualquer origem, estática ou dinâmica.
  answer: 0
  explanation: |
    Plataformas de borda executam código nos pontos de presença da CDN, a poucos milissegundos de cada usuário. Servem para redirecionamentos, autenticação leve, testes A/B e personalização simples. Para trabalho pesado ou que depende de um banco central, a latência até o banco pode anular o ganho.
- slug: servidor-ou-estatico
  title: O site com API própria
  difficulty: facil
  kind: quiz
  in:
    - introducao/What is hosting?
    - architectural-patterns/Serverless
  study:
    - label: Sobre o Railway
      url: https://docs.railway.com/overview/about-railway
    - label: Web services (Render)
      url: https://render.com/docs/web-services
  statement: |
    Além do frontend, o festival tem uma API em Node.js com Express, que fica rodando o tempo todo e se conecta a um banco PostgreSQL.

    Onde ela pode ser hospedada?
  options:
    - text: Numa plataforma que roda processos e contêineres de longa duração com banco gerenciado, como Railway ou Render
      why: Certo. Essas plataformas mantêm o servidor ligado, oferecem bancos e fazem deploy a partir do repositório.
    - text: No GitHub Pages, junto com o frontend
      why: O GitHub Pages serve só arquivos estáticos. Ele não executa Node.js.
    - text: No localStorage dos visitantes
      why: O localStorage é armazenamento do navegador de cada pessoa, não um servidor.
    - text: Em qualquer CDN, porque CDNs executam qualquer código
      why: CDNs distribuem arquivos. Algumas executam funções na borda, mas com limites que não servem a um servidor sempre ligado.
  answer: 0
  explanation: |
    Há dois modelos de hospedagem. O estático e serverless, como GitHub Pages, Netlify e Vercel, serve arquivos e executa funções curtas sob demanda. Plataformas de aplicação, como Railway e Render, rodam processos e contêineres contínuos. A escolha depende de a aplicação precisar de um processo sempre ativo, de conexões persistentes ou de tarefas em segundo plano.
