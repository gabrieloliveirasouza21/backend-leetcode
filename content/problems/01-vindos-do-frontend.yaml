  title: Duas tarefas ao mesmo tempo
  difficulty: facil
  kind: quiz
  visual: git
  in:
    - version-control/Git
  study:
    - label: O básico de branches e merge (Pro Git)
      url: https://git-scm.com/book/pt-br/v2/Ramifica%c3%a7%c3%a3o-Branching-no-Git-Ramifica%c3%a7%c3%a3o-Branching-e-Mesclagem-Merging-B%c3%a1sicas
    - label: git stash (documentação oficial)
      url: https://git-scm.com/docs/git-stash
  statement: |
    Você está no meio do novo filtro do line-up quando chega um bug urgente na página de ingressos. O filtro ainda não funciona.

    Qual fluxo mantém as duas coisas separadas?
  options:
    - text: Guardar o filtro num commit ou com `git stash`, criar um branch para o bug a partir da main e, depois do merge, voltar ao branch do filtro
      why: Certo. Cada mudança vive no seu branch e pode ser revisada, testada e publicada sem a outra.
    - text: Corrigir o bug no mesmo branch do filtro e publicar os dois juntos
      why: O filtro incompleto iria para produção junto com a correção, ou a correção teria de esperar o filtro ficar pronto.
    - text: Copiar a pasta do projeto e corrigir o bug na cópia
      why: Isso cria duas cópias sem ligação no Git. Juntar as mudanças depois vira um trabalho manual e sujeito a erro.
    - text: Apagar o filtro, corrigir o bug e reescrever o filtro depois
      why: Perder trabalho não é necessário. O Git existe justamente para guardar estados intermediários.
  answer: 0
  explanation: |
    Branches são baratos no Git. Um por tarefa permite trocar de contexto sem misturar mudanças, e cada branch vira um pull request revisável. `git stash` guarda alterações ainda não commitadas para recuperar depois.
- slug: conflito-de-merge
  title: Conflito no line-up
  difficulty: medio
  kind: quiz
  visual: git
  in:
    - version-control/Git
  study:
    - label: Conflitos de merge (Pro Git)
      url: https://git-scm.com/book/pt-br/v2/Ramifica%c3%a7%c3%a3o-Branching-no-Git-Ramifica%c3%a7%c3%a3o-Branching-e-Mesclagem-Merging-B%c3%a1sicas
  statement: |
    Ao fazer merge, o Git para com conflito em `lineup.json`:

    ```
    <<<<<<< HEAD
    "headliner": "Vórtice",
    =======
    "headliner": "Maré Negra",
    >>>>>>> feature/novo-headliner
    ```

    O que isso significa e o que fazer?
  options:
    - text: Os dois branches mudaram a mesma linha de forma diferente. Decida o conteúdo certo, apague os marcadores, rode os testes e faça o commit do merge
      why: Certo. O Git não sabe qual versão é a correta, e quem resolve é você, normalmente conversando com quem fez a outra mudança.
    - text: O arquivo está corrompido e precisa ser restaurado de um backup
      why: Os marcadores são texto que o Git escreveu de propósito para mostrar as duas versões.
    - text: O Git escolheu a versão de HEAD, e basta fazer o commit
      why: Ele não escolheu nada. Se você fizer o commit com os marcadores, o JSON fica inválido.
    - text: É preciso cancelar o merge e copiar o arquivo do outro branch por cima
      why: Isso descarta a mudança do seu branch sem avaliar qual valor é o certo.
  answer: 0
  explanation: |
    Conflito acontece quando os dois lados alteram o mesmo trecho. Entre `<<<<<<<` e `=======` está a sua versão, e entre `=======` e `>>>>>>>` está a que chega. Resolver é editar o arquivo até o estado final desejado, sem marcadores, e então fazer `git add` e o commit.
- slug: rebase-ou-merge
  title: Atualizar o branch da tarefa
  difficulty: medio
  kind: quiz
  visual: git
  in:
    - version-control/Git
  study:
    - label: Rebase (Pro Git)
      url: https://git-scm.com/book/pt-br/v2/Ramifica%c3%a7%c3%a3o-Branching-no-Git-Rebase-Rebasing
  statement: |
    Seu branch `filtro` saiu da `main` há uma semana, e a `main` recebeu vários commits. Só você trabalha no `filtro`, que ainda não foi publicado. Você quer o histórico linear, como se tivesse começado o trabalho hoje.

    Qual comando faz isso?
  options:
    - text: "`git rebase main`, estando no `filtro`, que reaplica seus commits em cima da main atual"
      why: Certo. O rebase recria seus commits com novos pais, o que deixa a história linear. É seguro porque o branch não foi compartilhado.
    - text: "`git merge main`, que é igual ao rebase"
      why: O merge também traz as mudanças, mas cria um commit de merge e mantém a bifurcação no histórico.
    - text: "`git reset --hard main`"
      why: Isso descarta todos os seus commits do filtro.
    - text: "`git push --force` na main"
      why: Isso reescreve a main de todo mundo e não atualiza seu branch.
  answer: 0
  explanation: |
    Merge e rebase integram mudanças de formas diferentes. O merge preserva a história como aconteceu, com um commit que junta os dois lados. O rebase reescreve seus commits como se tivessem sido feitos depois. A regra de ouro: não faça rebase de commits que outras pessoas já baixaram.
- slug: ignorar-arquivos
  title: O node_modules no repositório
  difficulty: facil
  kind: quiz
  in:
    - version-control/Git
    - web-security/Server Security
  study:
    - label: gitignore (documentação oficial)
      url: https://git-scm.com/docs/gitignore
  statement: |
    O primeiro commit do projeto incluiu a pasta `node_modules`, com 40 mil arquivos, e o arquivo `.env`, com a senha do banco. Você criou um `.gitignore` com essas duas entradas, mas o Git continua rastreando os arquivos.

    O que falta?
  options:
    - text: O `.gitignore` só vale para arquivos não rastreados. Tire-os do índice com `git rm -r --cached`, faça commit e troque a senha, que já está no histórico
      why: Certo. Ignorar não apaga o que já foi commitado, e uma senha que entrou no histórico deve ser considerada vazada.
    - text: Basta esperar o próximo commit, e o Git aplica o .gitignore
      why: O Git continua rastreando arquivos que já fazem parte do repositório, mesmo listados no .gitignore.
    - text: Renomear o .gitignore para .gitignore.txt
      why: O nome precisa ser exatamente .gitignore.
    - text: Apagar o repositório no GitHub resolve a senha
      why: Quem clonou ou baixou antes ainda tem o histórico. A senha precisa ser trocada.
  answer: 0
  explanation: |
    O `.gitignore` impede que arquivos novos entrem no Git, mas não remove os que já estão rastreados. `git rm --cached` tira do índice sem apagar do disco. Segredos commitados ficam no histórico, então troque a credencial e, se precisar limpar o histórico, use ferramentas como `git filter-repo`.
- slug: achar-o-commit-com-bug
  title: Qual commit quebrou?
  difficulty: medio
  kind: quiz
  visual: git
  in:
    - version-control/Git
  study:
    - label: git bisect (documentação oficial)
      url: https://git-scm.com/docs/git-bisect
  statement: |
    A busca do line-up funcionava na versão de um mês atrás e hoje está quebrada. Há 200 commits no meio.

    Qual é o jeito mais rápido de achar o commit culpado?
  options:
    - text: "`git bisect`, marcando um commit bom e um ruim, e testando o commit do meio a cada passo"
      why: Certo. A busca binária acha o culpado entre 200 commits em cerca de 8 testes.
    - text: Ler os 200 commits um por um
      why: Funciona, mas leva muito mais tempo do que dividir o intervalo ao meio.
    - text: "`git revert` de todos os commits do mês"
      why: Isso desfaz o trabalho de todo mundo, sem saber qual commit causou o problema.
    - text: "`git log --oneline` mostra o commit com bug"
      why: O log lista os commits, mas não diz qual deles introduziu o defeito.
  answer: 0
  explanation: |
    `git bisect` faz busca binária no histórico: a cada passo, o Git escolhe o commit do meio e você diz se ele está bom ou ruim. Com um script de teste, `git bisect run` automatiza tudo.
- slug: commit-pequeno
  title: Um commit, uma mudança
  difficulty: facil
  kind: quiz
  in:
    - version-control/Git
  study:
    - label: Gravando alterações (Pro Git)
      url: https://git-scm.com/book/pt-br/v2/Fundamentos-do-Git-Gravando-Altera%c3%a7%c3%b5es-no-Reposit%c3%b3rio
    - label: git add --patch (documentação oficial)
      url: https://git-scm.com/docs/git-add
  statement: |
    No mesmo arquivo, você corrigiu um bug no cálculo de preço e também renomeou variáveis por estilo. Quer que a correção vá num commit separado, para poder ser revertida sozinha.

    Como fazer?
  options:
    - text: "`git add -p`, escolhendo só os trechos da correção, e commitar. Depois, commitar o resto"
      why: Certo. O modo interativo deixa escolher pedaços de um arquivo para o próximo commit.
    - text: Fazer um commit só, com uma mensagem explicando as duas coisas
      why: Funciona, mas a correção não pode mais ser revertida ou levada para outro branch sozinha.
    - text: Copiar o arquivo, desfazer tudo e refazer as mudanças em duas etapas
      why: É trabalhoso e arriscado. O Git já permite separar os trechos.
    - text: Commitar e depois apagar o histórico
      why: Isso perde informação e não separa as mudanças.
  answer: 0
  explanation: |
    Commits pequenos e coesos tornam o histórico útil: fica fácil revisar, reverter e achar bugs com bisect. A área de preparação, o staging, existe para montar cada commit com exatamente o que ele deve conter.
- slug: pull-request-revisao
  title: O pull request
  difficulty: facil
  kind: quiz
  in:
    - repo-hosting/GitHub
    - repo-hosting/GitLab
  study:
    - label: Branches protegidos (GitHub)
      url: https://docs.github.com/pt/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches
    - label: Branches protegidos (GitLab)
      url: https://docs.gitlab.com/user/project/repository/branches/protected/
  statement: |
    O time quer que nenhuma mudança chegue à `main` sem que outra pessoa leia o código e sem que os testes passem.

    Como configurar isso no GitHub ou no GitLab?
  options:
    - text: Proteger o branch main, exigindo pull request ou merge request com aprovação e com os testes da CI passando
      why: Certo. A plataforma passa a bloquear push direto na main e só libera o merge quando as regras são cumpridas.
    - text: Pedir no README que ninguém faça push direto na main
      why: Uma regra escrita não impede ninguém de errar. A proteção de branch impõe a regra.
    - text: Dar acesso de escrita só ao líder técnico e pedir que todos mandem os arquivos por e-mail
      why: Isso cria um gargalo e perde o histórico de discussão e revisão que um pull request guarda.
    - text: Rodar os testes na máquina de cada pessoa antes do push
      why: Ajuda, mas depende de cada um lembrar. A CI roda os testes do mesmo jeito para todo mundo.
  answer: 0
  explanation: |
    Pull request, no GitHub, e merge request, no GitLab, são a mesma ideia: propor a junção de um branch, discutir linha a linha e mostrar o resultado da CI. A proteção de branch transforma isso em regra.
- slug: pipeline-no-merge-request
  title: Testes em cada mudança
  difficulty: medio
  kind: quiz
  in:
    - repo-hosting/GitLab
    - ci-cd
  study:
    - label: Começando com GitLab CI
      url: https://docs.gitlab.com/ci/quick_start/
    - label: Início rápido do GitHub Actions
      url: https://docs.github.com/pt/actions/get-started/quickstart
  statement: |
    O projeto do site tem `npm test`. O time quer que os testes rodem sozinhos a cada push num merge request do GitLab, e que o resultado apareça na própria página do merge request.

    O que resolve?
  options:
    - text: Um arquivo `.gitlab-ci.yml` com um job que instala as dependências e roda `npm test`
      why: Certo. O GitLab CI lê esse arquivo do repositório e roda os jobs nos runners a cada push. No GitHub, o equivalente fica em `.github/workflows`.
    - text: Um hook `pre-commit` local
      why: Hooks locais rodam só na máquina de quem os instalou, e o resultado não aparece no merge request.
    - text: Um script `postinstall` no package.json
      why: postinstall roda depois de instalar dependências, em qualquer máquina. Ele não reage a pushes nem reporta ao merge request.
    - text: Uma issue lembrando de rodar os testes
      why: Issues organizam o trabalho, mas não executam nada.
  answer: 0
  explanation: |
    Integração contínua roda as mesmas verificações em um ambiente limpo a cada mudança. No GitLab, o pipeline é descrito em `.gitlab-ci.yml`. No GitHub Actions, em arquivos YAML dentro de `.github/workflows`. Em ambos, o resultado aparece na revisão.
- slug: fork-ou-branch
  title: Contribuir com um projeto aberto
  difficulty: facil
  kind: quiz
  in:
    - repo-hosting/GitHub
  study:
    - label: Sobre forks (GitHub)
      url: https://docs.github.com/pt/pull-requests/collaborating-with-pull-requests/working-with-forks/about-forks
  statement: |
    Você quer corrigir um erro na documentação de uma biblioteca de código aberto no GitHub. Você não tem permissão de escrita no repositório.

    Como propor a mudança?
  options:
    - text: Fazer um fork, criar um branch nele, commitar a correção e abrir um pull request para o repositório original
      why: Certo. O fork é uma cópia sua, onde você pode escrever, e o pull request propõe a mudança aos mantenedores.
    - text: Fazer push direto na main do projeto
      why: Sem permissão de escrita, o push é recusado.
    - text: Mandar o arquivo corrigido por e-mail aos mantenedores
      why: Pode funcionar em alguns projetos, mas perde a revisão, os testes da CI e o histórico que o pull request oferece.
    - text: Abrir uma issue com o texto corrigido e esperar alguém aplicar
      why: Issues são boas para discutir, mas a forma de entregar a mudança é o pull request.
  answer: 0
  explanation: |
    Num repositório em que você não pode escrever, o fork é o seu espaço para trabalhar. O pull request compara um branch do fork com o original e passa pela revisão e pela CI do projeto. Em times com acesso de escrita, branches no próprio repositório cumprem o mesmo papel.
- slug: segredo-na-ci
  title: A chave da API no workflow
  difficulty: medio
  kind: quiz
  in:
    - ci-cd
    - repo-hosting/GitHub
  study:
    - label: Usando segredos no GitHub Actions
      url: https://docs.github.com/pt/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets
  statement: |
    O workflow de deploy precisa de uma chave de API para avisar o Slack. Alguém escreveu a chave direto no arquivo `.github/workflows/deploy.yml`.

    Qual é o jeito certo?
  options:
    - text: Cadastrar a chave como segredo do repositório e usar `${{ secrets.SLACK_TOKEN }}` no workflow, trocando a chave que já vazou
      why: Certo. Segredos ficam cifrados, não aparecem nos logs e não entram no código. A chave que esteve no arquivo já deve ser considerada exposta.
    - text: Deixar no arquivo, porque o repositório é privado
      why: Quem tem acesso ao repositório, ou a qualquer cópia dele, vê a chave. Repositórios privados também vazam.
    - text: Codificar a chave em base64 no arquivo
      why: Base64 não é criptografia. Qualquer pessoa decodifica em segundos.
    - text: Imprimir a chave no log para conferir
      why: Logs são visíveis para quem acessa o repositório. Segredos nunca devem ser impressos.
  answer: 0
  explanation: |
    Plataformas de CI guardam segredos fora do código e os injetam como variáveis de ambiente durante a execução. Um segredo que já foi para o repositório deve ser revogado e trocado, porque continua no histórico.
- slug: lockfile-no-repositorio
  title: Funciona na minha máquina
  difficulty: facil
  kind: quiz
  in:
    - ci-cd
  study:
    - label: package-lock.json (npm)
      url: https://docs.npmjs.com/cli/v10/configuring-npm/package-lock-json
    - label: npm ci (npm)
      url: https://docs.npmjs.com/cli/v10/commands/npm-ci
  statement: |
    O build passa no seu computador e quebra na CI. Vocês descobrem que a CI instalou uma versão mais nova de uma dependência indireta. O `package-lock.json` está no `.gitignore`.

    O que corrige o problema?
  options:
    - text: Versionar o lockfile e usar `npm ci` na CI, que instala exatamente o que está nele
      why: Certo. O lockfile registra a versão de cada pacote da árvore, e `npm ci` falha se ele não bater com o package.json, em vez de atualizar em silêncio.
    - text: Apagar node_modules antes de cada build
      why: Sem lockfile, uma instalação limpa resolve as faixas de novo e pode pegar outra versão.
    - text: Trocar todos os `^` do package.json por versões exatas
      why: Isso fixa só as dependências diretas. As dependências delas continuam com faixas.
    - text: Rodar `npm install` duas vezes
      why: Repetir a instalação não muda a forma como as faixas são resolvidas.
  answer: 0
  explanation: |
    O package.json diz quais faixas são aceitas, e o lockfile diz o que foi instalado de fato, incluindo as dependências indiretas. Cada gerenciador tem o seu: `package-lock.json` no npm, `yarn.lock` no Yarn, `pnpm-lock.yaml` no pnpm e `bun.lock` no Bun. Versione o lockfile e use a instalação congelada na CI.
- slug: testar-desconto
  title: Testes que pegam o bug
  difficulty: medio
  kind: tests
  in:
    - testing/Unit Testing
  study:
    - label: Guia do Vitest
      url: https://vitest.dev/guide/
    - label: Matchers do Jest
      url: https://jestjs.io/docs/using-matchers
  implementation: |
    function precoComCupom(preco, cupom) {
      if (cupom === 'RUIDO10') return Math.round(preco * 0.9 * 100) / 100;
      if (cupom === 'VIP' && preco >= 500) return preco - 100;
      return preco;
    }
  mutants:
    - reason: o cupom VIP exige preço acima de 500, e não a partir de 500
      code: |
        function precoComCupom(preco, cupom) {
          if (cupom === 'RUIDO10') return Math.round(preco * 0.9 * 100) / 100;
          if (cupom === 'VIP' && preco > 500) return preco - 100;
          return preco;
        }
    - reason: o RUIDO10 não arredonda os centavos
      code: |
        function precoComCupom(preco, cupom) {
          if (cupom === 'RUIDO10') return preco * 0.9;
          if (cupom === 'VIP' && preco >= 500) return preco - 100;
          return preco;
        }
    - reason: cupons desconhecidos zeram o preço
      code: |
        function precoComCupom(preco, cupom) {
          if (cupom === 'RUIDO10') return Math.round(preco * 0.9 * 100) / 100;
          if (cupom === 'VIP' && preco >= 500) return preco - 100;
          return cupom ? 0 : preco;
        }
    - reason: o VIP vale para qualquer preço
      code: |
        function precoComCupom(preco, cupom) {
          if (cupom === 'RUIDO10') return Math.round(preco * 0.9 * 100) / 100;
          if (cupom === 'VIP') return preco - 100;
          return preco;
        }
  statement: |
    A função `precoComCupom(preco, cupom)` está pronta. Escreva os testes dela, no estilo do Vitest e do Jest, com `test` e `expect`.

    Regras:

    - `RUIDO10` dá 10% de desconto, arredondado para 2 casas
    - `VIP` tira R$ 100 de ingressos a partir de R$ 500
    - outros cupons, ou nenhum cupom, mantêm o preço

    O corretor roda seus testes na versão certa, onde todos devem passar, e em versões com defeito, onde algum teste deve falhar.
  min_tests: 3
  solution: |
    test('RUIDO10 dá 10% de desconto', () => {
      expect(precoComCupom(300, 'RUIDO10')).toBe(270);
    });

    test('RUIDO10 arredonda os centavos', () => {
      expect(precoComCupom(99.99, 'RUIDO10')).toBe(89.99);
    });

    test('VIP vale a partir de 500', () => {
      expect(precoComCupom(500, 'VIP')).toBe(400);
      expect(precoComCupom(900, 'VIP')).toBe(800);
    });

    test('VIP não vale abaixo de 500', () => {
      expect(precoComCupom(499, 'VIP')).toBe(499);
    });

    test('cupom desconhecido ou ausente mantém o preço', () => {
      expect(precoComCupom(300, 'NADA')).toBe(300);
      expect(precoComCupom(300)).toBe(300);
    });
  hints:
    - Teste os limites. Um teste com 900 no VIP não diferencia `>=` de `>`.
    - Escolha valores em que o arredondamento faz diferença, como 99.99.
  explanation: |
    Bons testes miram onde o código costuma errar: limites como 500, arredondamento e o caminho que não faz nada. Essa técnica de criar versões com defeito para ver se os testes reclamam se chama teste de mutação. Ela mede se os testes protegem o código ou só passam por ele.
  traps:
    - reason: Testes só do caminho feliz
      code: |
        test('RUIDO10', () => { expect(precoComCupom(300, 'RUIDO10')).toBe(270); });
        test('VIP', () => { expect(precoComCupom(900, 'VIP')).toBe(800); });
        test('sem cupom', () => { expect(precoComCupom(300)).toBe(300); });
    - reason: Testes sem expect
      code: |
        test('RUIDO10', () => { precoComCupom(300, 'RUIDO10'); });
        test('VIP', () => { precoComCupom(500, 'VIP'); });
        test('outro', () => { precoComCupom(300, 'X'); });
- slug: testar-com-espia
  title: O aviso foi enviado?
  difficulty: medio
  kind: tests
  in:
    - testing/Unit Testing
  study:
    - label: Mocks no Vitest
      url: https://vitest.dev/guide/mocking.html
    - label: Funções mock no Jest
      url: https://jestjs.io/docs/mock-functions
  implementation: |
    function avisarMudanca(show, novoHorario, enviar) {
      if (show.horario === novoHorario) return 0;
      for (const fa of show.inscritos) {
        enviar(fa, `${show.banda} agora toca às ${novoHorario}`);
      }
      return show.inscritos.length;
    }
  mutants:
    - reason: envia mesmo quando o horário não mudou
      code: |
        function avisarMudanca(show, novoHorario, enviar) {
          for (const fa of show.inscritos) enviar(fa, `${show.banda} agora toca às ${novoHorario}`);
          return show.horario === novoHorario ? 0 : show.inscritos.length;
        }
    - reason: avisa só o primeiro inscrito
      code: |
        function avisarMudanca(show, novoHorario, enviar) {
          if (show.horario === novoHorario) return 0;
          if (show.inscritos.length) enviar(show.inscritos[0], `${show.banda} agora toca às ${novoHorario}`);
          return show.inscritos.length;
        }
    - reason: a mensagem usa o horário antigo
      code: |
        function avisarMudanca(show, novoHorario, enviar) {
          if (show.horario === novoHorario) return 0;
          for (const fa of show.inscritos) enviar(fa, `${show.banda} agora toca às ${show.horario}`);
          return show.inscritos.length;
        }
  statement: |
    `avisarMudanca(show, novoHorario, enviar)` manda uma mensagem a cada fã inscrito quando o horário de um show muda. `enviar(fa, texto)` é a função que dispara a notificação.

    Escreva testes que usem uma função espiã no lugar de `enviar`. Aqui ela se chama `fn()`, como `vi.fn()` no Vitest e `jest.fn()` no Jest. Confira quem recebeu, quantas vezes e com que texto, e o que acontece quando o horário não muda.
  min_tests: 2
  solution: |
    const show = { banda: 'Vórtice', horario: '22h', inscritos: ['ana', 'bia'] };

    test('avisa cada inscrito com o novo horário', () => {
      const enviar = fn();
      expect(avisarMudanca(show, '23h', enviar)).toBe(2);
      expect(enviar).toHaveBeenCalledTimes(2);
      expect(enviar).toHaveBeenCalledWith('ana', 'Vórtice agora toca às 23h');
      expect(enviar).toHaveBeenCalledWith('bia', 'Vórtice agora toca às 23h');
    });

    test('não envia nada se o horário é o mesmo', () => {
      const enviar = fn();
      expect(avisarMudanca(show, '22h', enviar)).toBe(0);
      expect(enviar).not.toHaveBeenCalled();
    });
  hints:
    - "`fn()` grava cada chamada. `toHaveBeenCalledWith` confere os argumentos, e `toHaveBeenCalledTimes` a quantidade."
    - Teste também o caso em que nada deve acontecer.
  explanation: |
    Funções espiãs substituem dependências com efeito colateral, como enviar e-mail ou cobrar cartão, e gravam como foram chamadas. Injetar `enviar` como parâmetro é o que torna a função testável. Testar o caminho que não deve fazer nada pega defeitos que testes do caminho feliz deixam passar.
  traps:
    - reason: Confere só o retorno
      code: |
        test('conta os inscritos', () => {
          expect(avisarMudanca({ banda: 'V', horario: '22h', inscritos: ['a', 'b'] }, '23h', () => {})).toBe(2);
        });
        test('mesmo horário', () => {
          expect(avisarMudanca({ banda: 'V', horario: '22h', inscritos: ['a'] }, '22h', () => {})).toBe(0);
        });
- slug: testar-assincrono
  title: Testar uma promessa
  difficulty: dificil
  kind: tests
  in:
    - testing/Integration Testing
  study:
    - label: Testando código assíncrono (Jest)
      url: https://jestjs.io/docs/asynchronous
    - label: resolves e rejects no Vitest
      url: https://vitest.dev/api/expect.html#resolves
  implementation: |
    async function reservar(api, setor, quantidade) {
      if (quantidade < 1 || quantidade > 6) throw new Error('Quantidade inválida');
      const { disponiveis } = await api.estoque(setor);
      if (disponiveis < quantidade) throw new Error('Esgotado');
      return api.reservar(setor, quantidade);
    }
  mutants:
    - reason: permite reservar mais do que o estoque
      code: |
        async function reservar(api, setor, quantidade) {
          if (quantidade < 1 || quantidade > 6) throw new Error('Quantidade inválida');
          await api.estoque(setor);
          return api.reservar(setor, quantidade);
        }
    - reason: reserva antes de conferir o estoque
      code: |
        async function reservar(api, setor, quantidade) {
          if (quantidade < 1 || quantidade > 6) throw new Error('Quantidade inválida');
          const r = api.reservar(setor, quantidade);
          const { disponiveis } = await api.estoque(setor);
          if (disponiveis < quantidade) throw new Error('Esgotado');
          return r;
        }
    - reason: aceita quantidade zero
      code: |
        async function reservar(api, setor, quantidade) {
          if (quantidade > 6) throw new Error('Quantidade inválida');
          const { disponiveis } = await api.estoque(setor);
          if (disponiveis < quantidade) throw new Error('Esgotado');
          return api.reservar(setor, quantidade);
        }
    - reason: o estoque exato é tratado como esgotado
      code: |
        async function reservar(api, setor, quantidade) {
          if (quantidade < 1 || quantidade > 6) throw new Error('Quantidade inválida');
          const { disponiveis } = await api.estoque(setor);
          if (disponiveis <= quantidade) throw new Error('Esgotado');
          return api.reservar(setor, quantidade);
        }
  statement: |
    `reservar(api, setor, quantidade)` é assíncrona. Ela valida a quantidade, de 1 a 6, consulta `api.estoque(setor)`, que resolve com `{ disponiveis }`, e só então chama `api.reservar(setor, quantidade)`.

    Escreva testes com uma `api` falsa, feita com `fn()`. Cubra a reserva com sucesso, o estoque insuficiente, o estoque exato e a quantidade inválida. Use `await` e `expect(...).rejects`.
  min_tests: 3
  solution: |
    function apiCom(disponiveis) {
      return {
        estoque: fn().mockResolvedValue({ disponiveis }),
        reservar: fn().mockResolvedValue({ codigo: 'R1' }),
      };
    }

    test('reserva quando há estoque', async () => {
      const api = apiCom(10);
      await expect(reservar(api, 'pista', 2)).resolves.toEqual({ codigo: 'R1' });
      expect(api.reservar).toHaveBeenCalledWith('pista', 2);
    });

    test('reserva o estoque exato', async () => {
      const api = apiCom(2);
      await expect(reservar(api, 'pista', 2)).resolves.toEqual({ codigo: 'R1' });
    });

    test('recusa sem estoque e não reserva', async () => {
      const api = apiCom(1);
      await expect(reservar(api, 'pista', 2)).rejects.toMatch('Esgotado');
      expect(api.reservar).not.toHaveBeenCalled();
    });

    test('recusa quantidade fora de 1 a 6', async () => {
      const api = apiCom(10);
      await expect(reservar(api, 'pista', 0)).rejects.toMatch('Quantidade inválida');
      await expect(reservar(api, 'pista', 7)).rejects.toMatch('Quantidade inválida');
    });
  hints:
    - "`fn().mockResolvedValue(valor)` cria uma espiã que devolve uma promessa resolvida."
    - Sem `await` antes de `expect(...).rejects`, o teste termina antes de a promessa falhar e passa sempre.
    - Para pegar uma reserva feita cedo demais, confira que `api.reservar` não foi chamada quando falta estoque.
  explanation: |
    Em testes assíncronos, o erro mais comum é esquecer o `await`: o teste termina antes da asserção e passa mesmo com o código errado. Uma API falsa com respostas controladas deixa testar estoque exato e estoque insuficiente sem depender de rede. Conferir que `reservar` não foi chamada pega a ordem errada das operações.
  traps:
    - reason: Sem await, os testes passam sempre
      code: |
        const api = (d) => ({ estoque: fn().mockResolvedValue({ disponiveis: d }), reservar: fn().mockResolvedValue('ok') });
        test('sucesso', () => { expect(reservar(api(10), 'pista', 2)).resolves.toBe('ok'); });
        test('esgotado', () => { expect(reservar(api(1), 'pista', 2)).rejects.toMatch('Esgotado'); });
        test('inválida', () => { expect(reservar(api(10), 'pista', 0)).rejects.toMatch('Quantidade'); });
    - reason: Esquece o estoque exato e a ordem
      code: |
        const api = (d) => ({ estoque: fn().mockResolvedValue({ disponiveis: d }), reservar: fn().mockResolvedValue('ok') });
        test('sucesso', async () => { await expect(reservar(api(10), 'pista', 2)).resolves.toBe('ok'); });
        test('esgotado', async () => { await expect(reservar(api(1), 'pista', 2)).rejects.toMatch('Esgotado'); });
        test('inválida', async () => { await expect(reservar(api(10), 'pista', 0)).rejects.toMatch('Quantidade'); });
- slug: testar-o-slug
  title: Testes para o criador de slug
  difficulty: facil
  kind: tests
  in:
    - testing/Unit Testing
  study:
    - label: Guia do Vitest
      url: https://vitest.dev/guide/
    - label: Matchers do Jest
      url: https://jestjs.io/docs/using-matchers
  implementation: |
    function criarSlug(nome) {
      return nome
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
    }
  mutants:
    - reason: não remove os acentos
      code: |
        function criarSlug(n) { return n.toLowerCase().replace(/[^a-zà-ú0-9]+/g, '-').replace(/^-|-$/g, ''); }
    - reason: deixa hífen nas pontas
      code: |
        function criarSlug(n) { return n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-'); }
    - reason: um hífen por caractere especial
      code: |
        function criarSlug(n) { return n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/^-+|-+$/g, ''); }
    - reason: mantém maiúsculas
      code: |
        function criarSlug(n) { return n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  statement: |
    `criarSlug(nome)` transforma o nome de uma banda num endereço: minúsculas, sem acentos, com um único hífen no lugar de cada sequência de símbolos e espaços, e sem hífens nas pontas. `Maré Negra!` vira `mare-negra`.

    Escreva testes que peguem cada um desses comportamentos.
  min_tests: 3
  solution: |
    test('tira acentos e usa minúsculas', () => {
      expect(criarSlug('Maré Negra')).toBe('mare-negra');
    });

    test('junta símbolos e espaços num hífen só', () => {
      expect(criarSlug('Os Insones & Cia')).toBe('os-insones-cia');
    });

    test('não deixa hífen nas pontas', () => {
      expect(criarSlug('  Vórtice!  ')).toBe('vortice');
    });
  hints:
    - Para cada regra, pense num nome em que só ela faz diferença.
    - Um nome com `&` entre espaços pega a regra do hífen único.
  explanation: |
    Cada teste mira uma regra, com uma entrada em que errar aquela regra muda o resultado. Testes com nomes simples, como `vortice`, passariam até com várias versões quebradas.
  traps:
    - reason: Só um caso simples
      code: |
        test('slug', () => { expect(criarSlug('vortice')).toBe('vortice'); });
        test('outro', () => { expect(criarSlug('asfalto')).toBe('asfalto'); });
        test('mais um', () => { expect(criarSlug('ferrugem')).toBe('ferrugem'); });
- slug: testar-a-fila
  title: Testes para a fila de espera
  difficulty: medio
  kind: tests
  in:
    - testing/Unit Testing
  study:
    - label: Organizando testes com describe (Jest)
      url: https://jestjs.io/docs/setup-teardown
    - label: toThrow (Jest)
      url: https://jestjs.io/docs/expect#tothrowerror
  implementation: |
    class FilaDeEspera {
      #pessoas = [];
      constructor(limite) {
        this.limite = limite;
      }
      entrar(nome) {
        if (this.#pessoas.includes(nome)) throw new Error('Já está na fila');
        if (this.#pessoas.length >= this.limite) throw new Error('Fila cheia');
        this.#pessoas.push(nome);
        return this.#pessoas.length;
      }
      chamar() {
        return this.#pessoas.shift() ?? null;
      }
      get tamanho() {
        return this.#pessoas.length;
      }
    }
  mutants:
    - reason: chama o último em vez do primeiro
      code: |
        class FilaDeEspera { #p = []; constructor(l) { this.limite = l; } entrar(n) { if (this.#p.includes(n)) throw new Error('Já está na fila'); if (this.#p.length >= this.limite) throw new Error('Fila cheia'); this.#p.push(n); return this.#p.length; } chamar() { return this.#p.pop() ?? null; } get tamanho() { return this.#p.length; } }
    - reason: aceita uma pessoa a mais que o limite
      code: |
        class FilaDeEspera { #p = []; constructor(l) { this.limite = l; } entrar(n) { if (this.#p.includes(n)) throw new Error('Já está na fila'); if (this.#p.length > this.limite) throw new Error('Fila cheia'); this.#p.push(n); return this.#p.length; } chamar() { return this.#p.shift() ?? null; } get tamanho() { return this.#p.length; } }
    - reason: aceita a mesma pessoa duas vezes
      code: |
        class FilaDeEspera { #p = []; constructor(l) { this.limite = l; } entrar(n) { if (this.#p.length >= this.limite) throw new Error('Fila cheia'); this.#p.push(n); return this.#p.length; } chamar() { return this.#p.shift() ?? null; } get tamanho() { return this.#p.length; } }
    - reason: fila vazia devolve undefined
      code: |
        class FilaDeEspera { #p = []; constructor(l) { this.limite = l; } entrar(n) { if (this.#p.includes(n)) throw new Error('Já está na fila'); if (this.#p.length >= this.limite) throw new Error('Fila cheia'); this.#p.push(n); return this.#p.length; } chamar() { return this.#p.shift(); } get tamanho() { return this.#p.length; } }
  statement: |
    A classe `FilaDeEspera(limite)` organiza a fila de quem quer ingresso do lote extra:

    - `entrar(nome)` põe a pessoa no fim e devolve a posição. Lança erro se ela já está na fila ou se a fila está cheia
    - `chamar()` tira e devolve o primeiro da fila, ou `null` se estiver vazia
    - `tamanho` informa quantas pessoas esperam

    Escreva testes com `describe`, `test` e `expect`.
  min_tests: 4
  solution: |
    describe('FilaDeEspera', () => {
      test('chama na ordem de chegada', () => {
        const f = new FilaDeEspera(3);
        expect(f.entrar('ana')).toBe(1);
        expect(f.entrar('bia')).toBe(2);
        expect(f.chamar()).toBe('ana');
        expect(f.tamanho).toBe(1);
      });

      test('respeita o limite exato', () => {
        const f = new FilaDeEspera(2);
        f.entrar('ana');
        f.entrar('bia');
        expect(() => f.entrar('caio')).toThrow('Fila cheia');
      });

      test('não aceita a mesma pessoa duas vezes', () => {
        const f = new FilaDeEspera(3);
        f.entrar('ana');
        expect(() => f.entrar('ana')).toThrow('Já está na fila');
      });

      test('fila vazia devolve null', () => {
        expect(new FilaDeEspera(1).chamar()).toBeNull();
      });
    });
  hints:
    - Teste o limite com exatamente `limite` pessoas e uma a mais.
    - "`toBeNull` diferencia `null` de `undefined`."
  explanation: |
    Bons testes de uma classe descrevem o comportamento visível: ordem, limites, erros e o caso vazio. `describe` agrupa os testes do mesmo assunto, e cada teste cria a própria fila, para um não depender do outro.
  traps:
    - reason: Testes sem os limites
      code: |
        describe('fila', () => {
          test('entra', () => { const f = new FilaDeEspera(5); expect(f.entrar('a')).toBe(1); });
          test('chama', () => { const f = new FilaDeEspera(5); f.entrar('a'); expect(f.chamar()).toBe('a'); });
          test('tamanho', () => { const f = new FilaDeEspera(5); f.entrar('a'); expect(f.tamanho).toBe(1); });
          test('vazia', () => { expect(new FilaDeEspera(1).tamanho).toBe(0); });
        });
- slug: piramide-de-testes
  title: Quantos testes de cada tipo
  difficulty: medio
  kind: quiz
  in:
    - testing/Functional Testing
    - testing/Integration Testing
  study:
    - label: A pirâmide de testes (Martin Fowler, em inglês)
      url: https://martinfowler.com/articles/practical-test-pyramid.html
  statement: |
    O time tem 300 testes de ponta a ponta com Playwright, que levam 40 minutos e falham por motivos aleatórios, e quase nenhum teste unitário.

    Qual distribuição costuma funcionar melhor?
  options:
    - text: Muitos testes unitários rápidos para a lógica, alguns de integração entre partes, e poucos de ponta a ponta para os fluxos mais importantes
      why: Certo. Testes de ponta a ponta são valiosos, mas lentos e frágeis. A lógica detalhada se testa melhor em unidades.
    - text: Só testes de ponta a ponta, porque testam como o usuário usa
      why: Cobrem bem os fluxos, mas cada falha é difícil de diagnosticar e a suíte fica lenta demais.
    - text: Só testes unitários, porque são rápidos
      why: Não pegam problemas de integração, como a API mudar de formato ou um botão não estar ligado ao código.
    - text: Nenhum teste, e revisar com cuidado
      why: Revisão não substitui verificação automática a cada mudança.
  answer: 0
  explanation: |
    A pirâmide de testes sugere muitos testes baratos na base e poucos caros no topo. Fluxos críticos, como comprar um ingresso, merecem um teste de ponta a ponta. Os detalhes de cálculo e validação ficam em testes unitários, que rodam em segundos.
- slug: dados-de-teste-isolados
  title: O teste que depende do anterior
  difficulty: medio
  kind: quiz
  in:
    - testing/Functional Testing
  study:
    - label: Boas práticas do Cypress
      url: https://docs.cypress.io/app/core-concepts/best-practices
    - label: Isolamento de testes (Playwright)
      url: https://playwright.dev/docs/browser-contexts
  statement: |
    O teste "cancelar compra" só passa se rodar depois do teste "fazer compra", que cria a compra. Rodando sozinho ou em outra ordem, ele falha.

    Como corrigir?
  options:
    - text: Cada teste prepara os próprios dados, por exemplo criando a compra por uma chamada de API antes de começar, e não depende de outros
      why: Certo. Testes independentes podem rodar em qualquer ordem, em paralelo e sozinhos para depuração.
    - text: Garantir que os testes rodem sempre na mesma ordem
      why: Isso esconde a dependência e impede rodar em paralelo ou depurar um teste isolado.
    - text: Juntar os dois testes num só
      why: Funciona, mas cria um teste longo que falha por vários motivos.
    - text: Esperar alguns segundos no começo do teste
      why: Tempo de espera não cria os dados que faltam.
  answer: 0
  explanation: |
    Testes que dependem de estado deixado por outros são frágeis e confusos. Prepare o estado no começo de cada teste, de preferência por API, que é mais rápida que pela interface. Cypress e Playwright isolam o navegador entre testes, mas o banco de dados é responsabilidade sua.
- slug: snapshot-fragil
  title: O snapshot que todo mundo atualiza
  difficulty: medio
  kind: quiz
  in:
    - testing/Unit Testing
  study:
    - label: Testes de snapshot (Jest)
      url: https://jestjs.io/docs/snapshot-testing
  statement: |
    O componente da página de banda tem um teste de snapshot com 400 linhas de HTML. Qualquer mudança de classe CSS quebra o teste, e a equipe já roda `jest -u` sem olhar o que mudou.

    O que está errado?
  options:
    - text: Um snapshot grande que é atualizado sem revisão não protege nada. Testes que conferem comportamentos específicos, como textos e interações, pegam regressões de verdade
      why: Certo. Snapshots servem para saídas pequenas e estáveis. Grandes demais, viram ruído.
    - text: O snapshot deveria ser maior
      why: Maior ainda quebraria mais e seria ainda menos revisado.
    - text: O certo é apagar todos os testes de componente
      why: Testes de componente são úteis. O problema é o tipo de asserção.
    - text: É preciso atualizar os snapshots com mais frequência
      why: Atualizar sem ler é exatamente o que tira o valor do teste.
  answer: 0
  explanation: |
    Um snapshot compara a saída com uma cópia gravada. Ele funciona quando a saída é pequena e a mudança é rara, como uma mensagem de erro formatada. Para componentes, prefira asserções sobre o que a pessoa vê e faz, como as da Testing Library.
- slug: onde-guardar-a-sessao
  title: Onde guardar a sessão
  difficulty: medio
  kind: quiz
  in:
    - apis/Cookie Based Auth
    - apis/Authentication
  study:
    - label: Cookies HTTP (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/Cookies
    - label: Gerenciamento de sessão (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
  statement: |
    Depois do login, o servidor precisa reconhecer o fã nas próximas requisições. O site tem muitos scripts de terceiros, como analytics e chat, e um XSS em qualquer um deles poderia rodar código na página.

    Qual opção reduz mais o estrago de um XSS?
  options:
    - text: Um cookie de sessão com `HttpOnly`, `Secure` e `SameSite`, que o JavaScript da página não consegue ler
      why: Certo. Com HttpOnly, um script injetado não lê o identificador da sessão, e SameSite reduz o risco de CSRF.
    - text: O token no localStorage, lido pelo JavaScript e enviado num cabeçalho
      why: Qualquer script na página lê o localStorage, inclusive um injetado, que pode copiar o token.
    - text: A senha do usuário no sessionStorage, para refazer o login sozinho
      why: Senhas nunca devem ser guardadas no navegador. Um XSS levaria a senha, e não só uma sessão.
    - text: O token numa variável global, para não ficar em nenhum armazenamento
      why: Um script injetado também lê variáveis globais, e a sessão some ao recarregar a página.
  answer: 0
  explanation: |
    Cookies `HttpOnly` não são acessíveis por `document.cookie`, então um XSS não consegue roubar a sessão, embora ainda possa agir na página enquanto ela está aberta. `Secure` manda o cookie só por HTTPS, e `SameSite=Lax` ou `Strict` impede o envio em boa parte das requisições vindas de outros sites. Tokens em JavaScript são práticos, mas ficam expostos a qualquer script.
- slug: csrf-e-samesite
  title: O formulário que comprou sozinho
  difficulty: medio
  kind: quiz
  in:
    - apis/Cookie Based Auth
    - web-security/OWASP Risks
  study:
    - label: CSRF no glossário do MDN, em inglês
      url: https://developer.mozilla.org/en-US/docs/Glossary/CSRF
    - label: Prevenção de CSRF (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
  statement: |
    Um site malicioso tem um formulário escondido que faz `POST https://festivalruido.com.br/comprar`. Quando uma fã logada visita esse site, a compra acontece na conta dela, porque o navegador manda o cookie de sessão junto.

    Qual defesa resolve?
  options:
    - text: Cookie de sessão com `SameSite=Lax` ou `Strict`, que não vai em POSTs vindos de outros sites, e um token anti-CSRF no formulário
      why: Certo. SameSite impede o envio do cookie nessa situação, e o token prova que o pedido saiu de uma página do próprio site.
    - text: Usar HTTPS
      why: HTTPS protege o caminho, mas o pedido forjado também vai por HTTPS, com o cookie junto.
    - text: Esconder o endereço /comprar
      why: Endereços são fáceis de descobrir, e esconder não é uma defesa.
    - text: Validar o e-mail no formulário
      why: A validação não diferencia um pedido legítimo de um forjado.
  answer: 0
  explanation: |
    CSRF, falsificação de requisição entre sites, explora o envio automático de cookies. `SameSite` limita quando o cookie vai em pedidos de outros sites, e `Lax` já é o padrão em navegadores modernos. Tokens anti-CSRF e a checagem do cabeçalho `Origin` completam a defesa.
- slug: login-com-pkce
  title: Entrar com uma conta externa
  difficulty: dificil
  kind: quiz
  in:
    - apis/OAuth
  study:
    - label: OAuth 2.0 para apps no navegador (IETF, em inglês)
      url: https://datatracker.ietf.org/doc/html/draft-ietf-oauth-browser-based-apps
    - label: Fluxo Authorization Code com PKCE (Auth0, em inglês)
      url: https://auth0.com/docs/get-started/authentication-and-authorization-flow/authorization-code-flow-with-pkce
  statement: |
    O site quer permitir "Entrar com o Google" numa SPA. Não há onde guardar um segredo de cliente no navegador.

    Qual fluxo de OAuth é o recomendado?
  options:
    - text: Authorization Code com PKCE, em que o app gera um segredo temporário a cada login e prova que é ele quem troca o código pelo token
      why: Certo. O PKCE protege o código de autorização contra interceptação sem exigir um segredo fixo no cliente.
    - text: O fluxo implícito, que devolve o token direto na URL
      why: Esse fluxo foi desaconselhado, porque o token na URL vaza em histórico, logs e cabeçalhos de referência.
    - text: Pedir a senha do Google da pessoa e guardar no site
      why: O OAuth existe justamente para o site nunca ver a senha da conta externa.
    - text: Embutir o segredo do cliente no JavaScript
      why: Tudo o que vai para o navegador é público. O segredo deixaria de ser segredo.
  answer: 0
  explanation: |
    No OAuth, o site manda a pessoa ao provedor, que devolve um código de autorização, trocado depois por tokens. O PKCE acrescenta um verificador aleatório criado a cada login, e só quem tem o verificador consegue trocar o código. Muitos times ainda preferem fazer essa troca num backend e dar ao navegador só um cookie de sessão.
- slug: token-expirado
  title: O token venceu?
  difficulty: medio
  kind: js
  in:
    - apis/JWT
  study:
    - label: Introdução ao JWT
      url: https://jwt.io/introduction
    - label: Base64 no glossário do MDN
      url: https://developer.mozilla.org/pt-BR/docs/Glossary/Base64
  statement: |
    Um JWT tem três partes separadas por ponto: cabeçalho, carga e assinatura. A carga é um JSON codificado em base64url. O campo `exp` guarda o vencimento em segundos desde 1970.

    Escreva `expirado(token, agora = Date.now())`, que devolve `true` quando o token venceu ou quando não dá para ler o `exp`. `agora` está em milissegundos.

    Isso serve só para a interface decidir quando renovar a sessão. Quem valida a assinatura é o servidor.
  solution: |
    function expirado(token, agora = Date.now()) {
      try {
        const parte = token.split('.')[1];
        const base64 = parte.replace(/-/g, '+').replace(/_/g, '/');
        const carga = JSON.parse(atob(base64.padEnd(Math.ceil(base64.length / 4) * 4, '=')));
        if (typeof carga.exp !== 'number') return true;
        return carga.exp * 1000 <= agora;
      } catch {
        return true;
      }
    }
  setup: |
    const montarToken = (carga) => {
      const b64 = (obj) => btoa(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      return `${b64({ alg: 'HS256', typ: 'JWT' })}.${b64(carga)}.assinatura`;
    };
  tests:
    - name: token válido
      code: |
        const token = montarToken({ sub: 'fa-1', exp: 2000000000 });
        expect(expirado(token, 1900000000000)).toBe(false);
    - name: token vencido
      code: |
        const token = montarToken({ sub: 'fa-1', exp: 1700000000 });
        expect(expirado(token, 1800000000000)).toBe(true);
    - name: exp em segundos
      hidden: true
      code: |
        const token = montarToken({ exp: 1800000000 });
        expect(expirado(token, 1800000000000 - 1)).toBe(false);
        expect(expirado(token, 1800000000000)).toBe(true);
    - name: base64url com - e _
      hidden: true
      code: |
        const token = montarToken({ nome: '???>>>~~~', exp: 2000000000 });
        expect(token.split('.')[1]).toMatch(/[-_]/);
        expect(expirado(token, 1900000000000)).toBe(false);
    - name: token ilegível
      hidden: true
      code: |
        expect(expirado('lixo', 0)).toBe(true);
        expect(expirado(montarToken({ sub: 'sem-exp' }), 0)).toBe(true);
  hints:
    - base64url troca `+` por `-` e `/` por `_`, e costuma omitir o `=` do fim. Desfaça isso antes do `atob`.
    - "`exp` está em segundos e `Date.now()` em milissegundos."
  explanation: |
    Decodificar a carga não valida o token. Qualquer pessoa pode montar um JWT com qualquer `exp`, e só a verificação da assinatura no servidor prova que ele é legítimo. No cliente, ler o `exp` serve para renovar antes de uma requisição falhar. Na dúvida, trate como vencido.
  traps:
    - reason: Compara segundos com milissegundos
      code: |
        function expirado(token, agora = Date.now()) {
          try { const p = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); const c = JSON.parse(atob(p.padEnd(Math.ceil(p.length / 4) * 4, '='))); return !(c.exp > agora); } catch { return true; }
        }
    - reason: Esquece o base64url
      code: |
        function expirado(token, agora = Date.now()) {
          try { const c = JSON.parse(atob(token.split('.')[1])); return typeof c.exp !== 'number' || c.exp * 1000 <= agora; } catch { return true; }
        }
- slug: renovar-token-uma-vez
  title: O token venceu no meio da navegação
  difficulty: dificil
  kind: js
  in:
    - apis/Token Authentication
  study:
    - label: Status 401 Unauthorized (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/401
    - label: Promises (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Using_promises
  statement: |
    Escreva `criarCliente(requisitar, renovar)`, que devolve `async function pedir(url)`:

    - `requisitar(url, token)` faz o pedido e resolve com `{ status, dados }`
    - `renovar()` resolve com um token novo
    - o cliente começa sem token e guarda o último token recebido
    - se a resposta for 401, renove uma vez e repita o pedido com o token novo. Se vier 401 de novo, lance `Error('Sessão expirada')`
    - se vários pedidos receberem 401 ao mesmo tempo, `renovar` deve ser chamado uma vez só, e todos esperam o mesmo token
    - devolva `dados` nas respostas de sucesso
  solution: |
    function criarCliente(requisitar, renovar) {
      let token = null;
      let renovando = null;

      async function tokenNovo() {
        renovando ??= renovar().finally(() => {
          renovando = null;
        });
        token = await renovando;
        return token;
      }

      return async function pedir(url) {
        let resposta = await requisitar(url, token);
        if (resposta.status === 401) {
          resposta = await requisitar(url, await tokenNovo());
          if (resposta.status === 401) throw new Error('Sessão expirada');
        }
        return resposta.dados;
      };
    }
  setup: |
    function servidor(validos) {
      return fn(async (url, token) => (validos.includes(token) ? { status: 200, dados: `${url} com ${token}` } : { status: 401 }));
    }
  tests:
    - name: renova e repete
      code: |
        const requisitar = servidor(['t1']);
        const renovar = fn(async () => 't1');
        const pedir = criarCliente(requisitar, renovar);
        expect(await pedir('/carrinho')).toBe('/carrinho com t1');
        expect(renovar).toHaveBeenCalledTimes(1);
    - name: guarda o token
      hidden: true
      code: |
        const requisitar = servidor(['t1']);
        const renovar = fn(async () => 't1');
        const pedir = criarCliente(requisitar, renovar);
        await pedir('/a');
        await pedir('/b');
        expect(renovar).toHaveBeenCalledTimes(1);
        expect(requisitar.mock.calls[2]).toEqual(['/b', 't1']);
    - name: uma renovação para vários pedidos
      hidden: true
      code: |
        const requisitar = servidor(['t1']);
        const renovar = fn(() => new Promise((r) => setTimeout(() => r('t1'), 30)));
        const pedir = criarCliente(requisitar, renovar);
        const r = await Promise.all([pedir('/a'), pedir('/b'), pedir('/c')]);
        expect(renovar).toHaveBeenCalledTimes(1);
        expect(r).toEqual(['/a com t1', '/b com t1', '/c com t1']);
    - name: sessão expirada
      hidden: true
      code: |
        const requisitar = servidor([]);
        const renovar = fn(async () => 'invalido');
        const pedir = criarCliente(requisitar, renovar);
        await expect(pedir('/a')).rejects.toMatch('Sessão expirada');
        expect(requisitar).toHaveBeenCalledTimes(2);
  hints:
    - Guarde a promessa da renovação em andamento. Quem chegar enquanto ela existe espera a mesma promessa.
    - Limpe a promessa quando ela terminar, para uma expiração futura poder renovar de novo.
  explanation: |
    Sem coordenação, cada pedido que recebe 401 dispara a própria renovação, e alguns servidores invalidam o token anterior a cada renovação, o que faz os pedidos se derrubarem. Compartilhar uma única promessa de renovação resolve, e tentar uma vez só evita um laço infinito quando a sessão expirou de vez.
  traps:
    - reason: Uma renovação por pedido
      code: |
        function criarCliente(req, ren) {
          let t = null;
          return async (url) => { let r = await req(url, t); if (r.status === 401) { t = await ren(); r = await req(url, t); if (r.status === 401) throw new Error('Sessão expirada'); } return r.dados; };
        }
    - reason: Tenta para sempre
      code: |
        function criarCliente(req, ren) {
          let t = null; let p = null;
          const novo = async () => { p ??= ren().finally(() => { p = null; }); t = await p; return t; };
          return async function pedir(url) { const r = await req(url, t); if (r.status === 401) { await novo(); if (req.mock && req.mock.calls.length > 6) throw new Error('Sessão expirada'); return pedir(url); } return r.dados; };
        }
- slug: erro-de-cors
  title: Bloqueado por CORS
  difficulty: medio
  kind: quiz
  visual: cors
  in:
    - web-security/CORS
  study:
    - label: CORS (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CORS
    - label: Política de mesma origem (MDN, em inglês)
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy
  statement: |
    O site em `https://ruido.com.br` chama `https://api.ruido.com.br/bandas` com `fetch`. O console mostra: "blocked by CORS policy: No 'Access-Control-Allow-Origin' header is present".

    Onde está a correção?
  options:
    - text: Na API, que precisa responder com `Access-Control-Allow-Origin` permitindo `https://ruido.com.br`, e tratar o preflight `OPTIONS` quando houver
      why: Certo. CORS é o servidor dizendo ao navegador quais origens podem ler suas respostas.
    - text: No fetch, com o modo `no-cors`
      why: Com no-cors, o pedido sai, mas a resposta fica opaca e o JavaScript não consegue ler o conteúdo.
    - text: Instalar uma extensão que desativa o CORS no navegador
      why: Isso só muda o seu navegador. Os visitantes continuariam bloqueados.
    - text: Mudar a API para HTTP sem S
      why: O protocolo não resolve, e um site HTTPS chamando HTTP ainda seria bloqueado como conteúdo misto.
  answer: 0
  explanation: |
    A política de mesma origem impede que uma página leia respostas de outra origem, definida por protocolo, domínio e porta. Um subdomínio diferente já conta como outra origem. CORS é a forma de o servidor liberar origens específicas por cabeçalhos. A proteção é do navegador, então chamadas entre servidores não passam por CORS.
- slug: conteudo-misto
  title: O cadeado sumiu
  difficulty: facil
  kind: quiz
  in:
    - web-security/HTTPS
  study:
    - label: Conteúdo misto (MDN, em inglês)
      url: https://developer.mozilla.org/en-US/docs/Web/Security/Mixed_content
  statement: |
    O site é servido em HTTPS, mas o navegador bloqueia o script do mapa do local, carregado de `http://mapas.exemplo.com/mapa.js`.

    O que está acontecendo?
  options:
    - text: Conteúdo misto. Um script por HTTP numa página HTTPS poderia ser alterado no caminho, então o navegador bloqueia. O recurso precisa vir por HTTPS
      why: Certo. HTTPS protege a página só se tudo o que ela executa também viajar cifrado.
    - text: O certificado do site venceu
      why: Com certificado vencido, o aviso aparece na página inteira. Aqui o bloqueio é de um recurso específico.
    - text: Scripts de terceiros nunca são permitidos em HTTPS
      why: São permitidos, desde que venham por HTTPS e, se houver CSP, de uma origem autorizada.
    - text: O navegador bloqueia mapas por privacidade
      why: O bloqueio é pelo protocolo do recurso, não pelo tipo de conteúdo.
  answer: 0
  explanation: |
    HTTPS cifra e autentica a conexão, o que impede ler ou alterar os dados no caminho. Se um script vier por HTTP, quem está no meio da rede pode trocá-lo e controlar a página. Por isso navegadores bloqueiam scripts mistos e atualizam ou bloqueiam imagens mistas.
- slug: hsts
  title: O primeiro acesso por HTTP
  difficulty: medio
  kind: quiz
  in:
    - web-security/HTTPS
    - web-servers/Nginx
  study:
    - label: Strict-Transport-Security (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Headers/Strict-Transport-Security
  statement: |
    O servidor redireciona `http://` para `https://`. Mesmo assim, num Wi-Fi público, um atacante intercepta o primeiro pedido, ainda em HTTP, antes do redirecionamento.

    O que faz o navegador ir direto para HTTPS nas próximas visitas?
  options:
    - text: O cabeçalho `Strict-Transport-Security`, que diz ao navegador para usar só HTTPS naquele domínio por um período
      why: Certo. É o HSTS. Com ele, o navegador nem tenta o HTTP, e com a lista de pré-carregamento vale até na primeira visita.
    - text: Um certificado mais caro
      why: O tipo de certificado não muda o primeiro pedido em HTTP.
    - text: Desligar a porta 80 do servidor
      why: Quem digitou sem https veria um erro, e o atacante no meio ainda poderia responder no lugar do servidor.
    - text: Um meta refresh na página
      why: A página em HTTP já é o que o atacante consegue alterar.
  answer: 0
  explanation: |
    O redirecionamento de HTTP para HTTPS deixa uma janela no primeiro pedido. O HSTS fecha essa janela nas visitas seguintes, e a lista de pré-carregamento dos navegadores fecha até na primeira. Aplique com cuidado: com HSTS ativo, o domínio não volta a funcionar por HTTP.
- slug: csp-bloqueou
  title: A política barrou o script
  difficulty: medio
  kind: quiz
  in:
    - web-security/CSP
  study:
    - label: Content Security Policy (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/CSP
  statement: |
    O site envia o cabeçalho `Content-Security-Policy: script-src 'self'`. Depois disso, um `onclick="comprar()"` escrito direto no HTML parou de funcionar, e um script injetado por XSS num comentário também foi bloqueado.

    O que a política está fazendo?
  options:
    - text: Permitindo só scripts de arquivos da mesma origem. Scripts inline e atributos de evento são bloqueados, inclusive os legítimos, que devem virar `addEventListener` em arquivos .js
      why: Certo. Sem `'unsafe-inline'`, a CSP não diferencia o seu inline do injetado, e é isso que corta boa parte dos XSS.
    - text: Bloqueando todo o JavaScript do site
      why: Scripts de arquivos da própria origem continuam permitidos com `'self'`.
    - text: Liberando scripts de qualquer origem, desde que sejam HTTPS
      why: "`'self'` restringe à própria origem. Outras origens precisariam ser listadas."
    - text: Bloqueando só scripts de terceiros, e o onclick parou por outro motivo
      why: O onclick parou justamente porque é inline.
  answer: 0
  explanation: |
    A Content Security Policy diz ao navegador de onde a página pode carregar scripts, estilos e outros recursos. Uma política sem `'unsafe-inline'` torna muitos XSS inofensivos, porque o código injetado é inline. Para os inline necessários, nonces ou hashes autorizam trechos específicos.
- slug: proteger-de-iframe
  title: O site dentro de outro site
  difficulty: medio
  kind: quiz
  in:
    - web-security/CSP
  study:
    - label: frame-ancestors (MDN, em inglês)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy/frame-ancestors
    - label: Clickjacking (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Clickjacking_Defense_Cheat_Sheet.html
  statement: |
    Um site falso carrega a página de compra do festival num iframe transparente, por cima de um botão "Ganhe um brinde". Quem clica no brinde, na verdade, clica em "Confirmar compra".

    Qual defesa impede isso?
  options:
    - text: "O cabeçalho `Content-Security-Policy: frame-ancestors 'self'`, que proíbe outras origens de exibirem a página em iframe"
      why: Certo. O navegador se recusa a mostrar a página dentro de sites que não estão na lista.
    - text: Desabilitar o botão direito do mouse
      why: Isso não tem relação com o ataque, que usa cliques normais.
    - text: Usar HTTPS
      why: O iframe malicioso também carrega a página por HTTPS.
    - text: Esconder o botão de confirmar
      why: A pessoa legítima também precisa do botão.
  answer: 0
  explanation: |
    Clickjacking engana o clique com camadas invisíveis. `frame-ancestors` na CSP, ou o cabeçalho antigo `X-Frame-Options`, diz quem pode exibir a página num iframe. Para páginas com ações sensíveis, a resposta costuma ser ninguém além do próprio site.
- slug: escapar-html
  title: Escapar antes de mostrar
  difficulty: medio
  kind: js
  in:
    - web-security/OWASP Risks
  study:
    - label: Prevenção de XSS (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    - label: Entidades HTML (MDN, em inglês)
      url: https://developer.mozilla.org/en-US/docs/Glossary/Entity
  statement: |
    O mural de recados monta HTML a partir do texto enviado pelos fãs. Antes de a equipe migrar para `textContent`, escreva `escaparHTML(texto)`, que troca os caracteres especiais pelas entidades HTML:

    - `&` vira `&amp;`
    - `<` vira `&lt;`
    - `>` vira `&gt;`
    - `"` vira `&quot;`
    - `'` vira `&#39;`
  solution: |
    function escaparHTML(texto) {
      return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  tests:
    - name: tags viram texto
      code: |
        expect(escaparHTML('<script>alert(1)</script>')).toBe('&lt;script&gt;alert(1)&lt;/script&gt;');
    - name: aspas
      code: |
        expect(escaparHTML(`"oi" e 'tchau'`)).toBe('&quot;oi&quot; e &#39;tchau&#39;');
    - name: e comercial primeiro
      hidden: true
      code: |
        expect(escaparHTML('Rock & <Roll>')).toBe('Rock &amp; &lt;Roll&gt;');
        expect(escaparHTML('&lt;')).toBe('&amp;lt;');
    - name: todas as ocorrências
      hidden: true
      code: |
        expect(escaparHTML('<<>>')).toBe('&lt;&lt;&gt;&gt;');
    - name: atributo com aspas
      hidden: true
      code: |
        expect(escaparHTML('" onmouseover="alert(1)')).toBe('&quot; onmouseover=&quot;alert(1)');
  hints:
    - Troque o `&` primeiro. Se trocar depois, o `&` das entidades criadas também é trocado.
    - "`replace` com texto troca só a primeira ocorrência. Use uma regex com `g`."
  explanation: |
    XSS, a injeção de script, está entre os riscos mais comuns da lista OWASP. Escapar transforma os caracteres especiais em entidades, e o navegador mostra o texto em vez de interpretá-lo. A ordem importa: o `&` vai primeiro. O melhor é evitar montar HTML com dados e usar `textContent`, que dispensa escapar.
  traps:
    - reason: Troca o & por último
      code: |
        function escaparHTML(t) { return String(t).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/&/g, '&amp;'); }
    - reason: Só a primeira ocorrência
      code: |
        function escaparHTML(t) { return String(t).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&#39;'); }
- slug: link-sem-javascript
  title: O link do perfil do fã
  difficulty: medio
  kind: js
  in:
    - web-security/OWASP Risks
  study:
    - label: Prevenção de XSS (OWASP)
      url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    - label: URL (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/API/URL
  statement: |
    Fãs podem pôr um link no perfil. Um link como `javascript:roubar()` executaria código quando alguém clicasse. Escreva `linkSeguro(texto)`, que devolve o endereço se ele for seguro, ou `'#'` se não for.

    São seguros só os endereços absolutos com protocolo `http:`, `https:` ou `mailto:`. Use a API `URL` para interpretar o texto, e não compare só o começo da string.
  must_use:
    - new URL
  solution: |
    function linkSeguro(texto) {
      try {
        const url = new URL(String(texto).trim());
        return ['http:', 'https:', 'mailto:'].includes(url.protocol) ? url.href : '#';
      } catch {
        return '#';
      }
    }
  tests:
    - name: links normais
      code: |
        expect(linkSeguro('https://exemplo.com/banda')).toBe('https://exemplo.com/banda');
        expect(linkSeguro('mailto:fa@exemplo.com')).toBe('mailto:fa@exemplo.com');
    - name: bloqueia javascript
      code: |
        expect(linkSeguro('javascript:alert(1)')).toBe('#');
    - name: truques com maiúsculas e espaços
      hidden: true
      code: |
        expect(linkSeguro('  JaVaScRiPt:alert(1)')).toBe('#');
        expect(linkSeguro('java\tscript:alert(1)')).toBe('#');
        expect(linkSeguro('data:text/html,<script>alert(1)</script>')).toBe('#');
    - name: texto que não é URL
      hidden: true
      code: |
        expect(linkSeguro('meu site')).toBe('#');
        expect(linkSeguro('')).toBe('#');
  hints:
    - "`new URL(texto).protocol` normaliza o protocolo, inclusive com maiúsculas, espaços e tabulações."
    - Use uma lista do que é permitido, e não do que é proibido.
  explanation: |
    Bloquear `javascript:` comparando o começo da string falha com maiúsculas, espaços e caracteres de controle, que o navegador ignora. Interpretar com `URL`, como o navegador faria, e permitir só protocolos conhecidos é robusto. Listas de permissão são mais seguras que listas de bloqueio.
  traps:
    - reason: Compara o começo da string
      code: |
        function linkSeguro(t) { return String(t).startsWith('javascript:') ? '#' : t; }
    - reason: Lista de bloqueio
      code: |
        function linkSeguro(t) { try { const u = new URL(String(t).trim()); return u.protocol === 'javascript:' ? '#' : u.href; } catch { return '#'; } }
- slug: pacote-malicioso
