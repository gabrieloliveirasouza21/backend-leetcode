  statement: |
    O chat de ajuda do festival espera a resposta completa do modelo antes de mostrar qualquer coisa. Respostas longas levam 8 segundos, e as pessoas acham que travou.

    Qual mudança melhora a experiência?
  options:
    - text: Pedir a resposta em streaming e mostrar o texto conforme os pedaços chegam
      why: Certo. APIs como as da Anthropic, OpenAI e Gemini enviam a resposta em partes, e a pessoa começa a ler em menos de um segundo.
    - text: Diminuir o limite de tokens para respostas mais curtas
      why: Responde mais rápido, mas corta respostas que precisam ser longas.
    - text: Mostrar um contador de 8 segundos
      why: Ajuda a comunicar a espera, mas não reduz o tempo até a primeira informação útil.
    - text: Chamar o modelo duas vezes em paralelo
      why: Isso dobra o custo sem acelerar nenhuma das respostas.
  answer: 0
  explanation: |
    Com streaming, o servidor envia eventos com pedaços do texto à medida que o modelo gera. O tempo total é o mesmo, mas o tempo até o primeiro conteúdo cai muito, que é o que a pessoa percebe. No navegador, o corpo da resposta é lido como stream.
- slug: ler-eventos-do-servidor
  title: Montar a resposta em stream
  difficulty: dificil
  kind: js
  in:
    - ai-integration/Streaming
    - real-time/Server Sent Events
  study:
    - label: Server-sent events (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/API/Server-sent_events/Using_server-sent_events
    - label: Streaming de respostas (Anthropic)
      url: https://docs.claude.com/en/docs/build-with-claude/streaming
  statement: |
    APIs de modelos mandam a resposta como eventos de texto. Cada evento é uma ou mais linhas `data: <json>` e termina com uma linha em branco. O último evento é `data: [DONE]`.

    Escreva `criarLeitor(aoTexto)`, que devolve uma função `receber(pedaco)`. Os pedaços chegam da rede em tamanhos arbitrários: um evento pode vir dividido em dois pedaços, ou dois eventos num pedaço só.

    - para cada evento completo com JSON `{ "delta": "<texto>" }`, chame `aoTexto(delta)`
    - ignore linhas que não começam com `data: `, como comentários `: ping`
    - pare de processar ao receber `[DONE]`
  solution: |
    function criarLeitor(aoTexto) {
      let buffer = '';
      let terminou = false;
      return function receber(pedaco) {
        if (terminou) return;
        buffer += pedaco;
        let fim;
        while ((fim = buffer.indexOf('\n\n')) !== -1) {
          const evento = buffer.slice(0, fim);
          buffer = buffer.slice(fim + 2);
          for (const linha of evento.split('\n')) {
            if (!linha.startsWith('data: ')) continue;
            const dados = linha.slice(6);
            if (dados === '[DONE]') {
              terminou = true;
              return;
            }
            aoTexto(JSON.parse(dados).delta);
          }
        }
      };
    }
  tests:
    - name: eventos completos
      code: |
        const textos = [];
        const receber = criarLeitor((t) => textos.push(t));
        receber('data: {"delta":"Os portões"}\n\ndata: {"delta":" abrem às 14h"}\n\n');
        expect(textos).toEqual(['Os portões', ' abrem às 14h']);
    - name: evento dividido entre pedaços
      hidden: true
      code: |
        const textos = [];
        const receber = criarLeitor((t) => textos.push(t));
        receber('data: {"del');
        expect(textos).toEqual([]);
        receber('ta":"Vórtice"}\n');
        receber('\n');
        expect(textos).toEqual(['Vórtice']);
    - name: comentários e DONE
      hidden: true
      code: |
        const textos = [];
        const receber = criarLeitor((t) => textos.push(t));
        receber(': ping\n\ndata: {"delta":"a"}\n\ndata: [DONE]\n\ndata: {"delta":"depois"}\n\n');
        receber('data: {"delta":"mais"}\n\n');
        expect(textos).toEqual(['a']);
  hints:
    - Guarde o que chegou num buffer e só processe até a última linha em branco, `\n\n`. O resto espera o próximo pedaço.
    - Um JSON cortado no meio lança erro no `JSON.parse`. Nunca processe um evento incompleto.
  explanation: |
    A rede não respeita os limites dos eventos: um pedaço pode trazer meio evento ou vários. Acumular num buffer e processar só eventos completos é a forma correta de ler server-sent events. SDKs oficiais fazem isso por você, mas entender o formato ajuda a depurar.
  traps:
    - reason: Processa cada pedaço sozinho
      code: |
        function criarLeitor(f) { return (p) => { for (const l of p.split('\n')) { if (!l.startsWith('data: ')) continue; const d = l.slice(6); if (d === '[DONE]') return; try { f(JSON.parse(d).delta); } catch {} } }; }
    - reason: Continua depois do DONE
      code: |
        function criarLeitor(f) {
          let b = '';
          return (p) => { b += p; let i; while ((i = b.indexOf('\n\n')) !== -1) { const ev = b.slice(0, i); b = b.slice(i + 2); for (const l of ev.split('\n')) { if (!l.startsWith('data: ')) continue; const d = l.slice(6); if (d !== '[DONE]') f(JSON.parse(d).delta); } } };
        }
- slug: chamar-claude
  title: Pergunte ao Claude
  difficulty: medio
  kind: js
  in:
    - ai-integration/Anthropic
  study:
    - label: API Messages (Anthropic)
      url: https://docs.claude.com/en/api/messages
    - label: Visão geral da API (Anthropic)
      url: https://docs.claude.com/en/api/overview
  statement: |
    O backend do festival vai responder dúvidas com a API Messages da Anthropic. Escreva `async function perguntar(chave, modelo, pergunta)`:

    - `POST` em `https://api.anthropic.com/v1/messages`
    - cabeçalhos `x-api-key` com a chave, `anthropic-version` com `2023-06-01` e `content-type` com `application/json`
    - corpo JSON com `model`, `max_tokens` igual a 1024 e `messages` com uma mensagem de `role` igual a `user` e `content` igual à pergunta
    - se a resposta não for de sucesso, lance um `Error` com o status
    - a resposta tem `content`, uma lista de blocos. Devolva o texto de todos os blocos de `type` igual a `text`, juntos
  solution: |
    async function perguntar(chave, modelo, pergunta) {
      const resposta = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': chave,
          'anthropic-version': '2023-06-01',
          'content-type': 'application/json',
        },
        body: JSON.stringify({
          model: modelo,
          max_tokens: 1024,
          messages: [{ role: 'user', content: pergunta }],
        }),
      });
      if (!resposta.ok) throw new Error(`Erro ${resposta.status} na API`);
      const dados = await resposta.json();
      return dados.content.filter((bloco) => bloco.type === 'text').map((bloco) => bloco.text).join('');
    }
  tests:
    - name: devolve o texto
      code: |
        globalThis.fetch = fn(async () => ({ ok: true, status: 200, json: async () => ({ content: [{ type: 'text', text: 'Os portões abrem às 14h.' }] }) }));
        expect(await perguntar('chave-teste', 'modelo-x', 'Que horas abre?')).toBe('Os portões abrem às 14h.');
    - name: pedido no formato da API
      code: |
        globalThis.fetch = fn(async () => ({ ok: true, status: 200, json: async () => ({ content: [] }) }));
        await perguntar('chave-teste', 'modelo-x', 'Oi');
        const [url, opcoes] = fetch.mock.calls[0];
        expect(url).toBe('https://api.anthropic.com/v1/messages');
        expect(opcoes.method).toBe('POST');
        expect(JSON.parse(opcoes.body)).toEqual({ model: 'modelo-x', max_tokens: 1024, messages: [{ role: 'user', content: 'Oi' }] });
    - name: cabeçalhos
      hidden: true
      code: |
        globalThis.fetch = fn(async () => ({ ok: true, status: 200, json: async () => ({ content: [] }) }));
        await perguntar('chave-teste', 'modelo-x', 'Oi');
        const headers = new Headers(fetch.mock.calls[0][1].headers);
        expect(headers.get('x-api-key')).toBe('chave-teste');
        expect(headers.get('anthropic-version')).toBe('2023-06-01');
        expect(headers.get('content-type')).toBe('application/json');
    - name: vários blocos
      hidden: true
      code: |
        globalThis.fetch = fn(async () => ({ ok: true, status: 200, json: async () => ({ content: [{ type: 'text', text: 'Parte 1. ' }, { type: 'tool_use', id: 't1', name: 'x', input: {} }, { type: 'text', text: 'Parte 2.' }] }) }));
        expect(await perguntar('k', 'm', 'p')).toBe('Parte 1. Parte 2.');
    - name: erro da API
      hidden: true
      code: |
        globalThis.fetch = fn(async () => ({ ok: false, status: 429, json: async () => ({ type: 'error' }) }));
        await expect(perguntar('k', 'm', 'p')).rejects.toMatch('429');
  hints:
    - "`body` precisa ser texto: use `JSON.stringify`."
    - A resposta pode ter blocos de tipos diferentes. Filtre pelos de texto antes de juntar.
  explanation: |
    A API Messages recebe a lista de mensagens da conversa e devolve `content` como uma lista de blocos, que podem ser de texto ou de uso de ferramenta. Filtrar por tipo deixa o código pronto para respostas com ferramentas. A chave da API fica só no servidor: no navegador, qualquer pessoa poderia copiá-la.
  traps:
    - reason: Pega só o primeiro bloco
      code: |
        async function perguntar(chave, modelo, pergunta) {
          const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'x-api-key': chave, 'anthropic-version': '2023-06-01', 'content-type': 'application/json' }, body: JSON.stringify({ model: modelo, max_tokens: 1024, messages: [{ role: 'user', content: pergunta }] }) });
          if (!r.ok) throw new Error(`Erro ${r.status}`);
          return (await r.json()).content[0]?.text ?? '';
        }
    - reason: Corpo como objeto
      code: |
        async function perguntar(chave, modelo, pergunta) {
          const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'x-api-key': chave, 'anthropic-version': '2023-06-01', 'content-type': 'application/json' }, body: { model: modelo, max_tokens: 1024, messages: [{ role: 'user', content: pergunta }] } });
          if (!r.ok) throw new Error(`Erro ${r.status}`);
          return (await r.json()).content.filter((b) => b.type === 'text').map((b) => b.text).join('');
        }
- slug: chave-fora-do-navegador
