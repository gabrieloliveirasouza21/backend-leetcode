# Exercícios que vieram da Trilha Frontend e também valem para o backend.
- slug: caminho-dos-pacotes
  title: O ingresso atravessou o oceano
  difficulty: facil
  kind: quiz
  visual: pacotes
  in:
    - introducao/How does the internet work?
  study:
    - label: Como a internet funciona (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work
    - label: TCP no glossário do MDN
      url: https://developer.mozilla.org/pt-BR/docs/Glossary/TCP
  statement: |
    Uma fã em Lisboa compra ingresso no site do festival, hospedado em São Paulo. A página chega inteira, mas os dados não viajaram por um cabo exclusivo entre as duas cidades.

    Como a resposta do servidor chega até ela?
  options:
    - text: Dividida em pacotes, que roteadores encaminham de rede em rede, às vezes por caminhos diferentes, e o TCP remonta na ordem certa
      why: Certo. A internet é uma rede de redes. Cada pacote leva o endereço de destino, e o TCP confere, reordena e pede de novo o que se perdeu.
    - text: Por uma conexão direta que o provedor reserva entre os dois computadores enquanto a página carrega
      why: Isso descreve a telefonia antiga, por comutação de circuitos. A internet compartilha os links entre todos, pacote a pacote.
    - text: Pelo DNS, que transporta o conteúdo da página até o navegador
      why: O DNS só traduz o nome do site para um endereço IP. O conteúdo vem do servidor, por outra conexão.
    - text: Por satélite, sempre, porque cabos submarinos só transportam chamadas de voz
      why: A maior parte do tráfego entre continentes passa por cabos submarinos de fibra óptica.
  answer: 0
  explanation: |
    A internet troca dados em pacotes. O IP cuida do endereçamento e do encaminhamento entre redes. O TCP, por cima dele, garante que os bytes cheguem completos e na ordem. Quando um pacote se perde, só ele é reenviado.
- slug: tcp-ou-udp
  title: A transmissão ao vivo
  difficulty: medio
  kind: quiz
  visual: pacotes
  in:
    - introducao/How does the internet work?
  study:
    - label: TCP no glossário do MDN
      url: https://developer.mozilla.org/pt-BR/docs/Glossary/TCP
    - label: UDP no glossário do MDN, em inglês
      url: https://developer.mozilla.org/en-US/docs/Glossary/UDP
  statement: |
    O festival vai transmitir os shows ao vivo pelo site. Na chamada de vídeo, um pacote atrasado não serve para nada: quando chega, aquele trecho já passou.

    Por que protocolos de tempo real costumam usar UDP, e não TCP?
  options:
    - text: O UDP não espera reenvios nem reordena. Perder um pedaço vale mais que travar o vídeo esperando por ele
      why: Certo. O TCP segura os dados seguintes até o pacote perdido chegar, o que congela a imagem.
    - text: O UDP é criptografado e o TCP não
      why: Nenhum dos dois cifra por conta própria. A criptografia vem de camadas por cima, como TLS e DTLS.
    - text: O UDP garante a entrega na ordem certa
      why: É o contrário. O UDP não garante entrega nem ordem.
    - text: O TCP não funciona com vídeo
      why: Funciona, e muitos serviços de vídeo sob demanda usam TCP, porque podem guardar alguns segundos de reserva.
  answer: 0
  explanation: |
    TCP garante entrega completa e em ordem, ao custo de esperar por reenvios. UDP só manda os pacotes. Para arquivos e páginas, TCP é o certo. Para áudio e vídeo ao vivo, perder um quadro é melhor que atrasar todos.
- slug: metodo-e-status
  title: O pedido e a resposta
  difficulty: facil
  kind: quiz
  visual: requisicao
  in:
    - introducao/What is HTTP?
    - apis/REST
  study:
    - label: Métodos de requisição HTTP (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Methods
    - label: Códigos de status HTTP (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Status
  statement: |
    O formulário de cadastro do fã clube envia nome e e-mail para `/api/fas`. O servidor grava o fã e responde.

    Qual combinação de método e status descreve melhor essa troca quando tudo dá certo?
  options:
    - text: POST, com resposta 201 Created
      why: Certo. POST envia dados para criar algo, e 201 diz que um recurso novo foi criado.
    - text: GET, com resposta 200 OK
      why: GET serve para ler. Mandar dados de cadastro na URL de um GET expõe esses dados em histórico e logs, e um GET não deve mudar o estado do servidor.
    - text: POST, com resposta 302 Found
      why: 302 é um redirecionamento. Pode até aparecer depois de um formulário, mas não diz que o cadastro foi criado.
    - text: DELETE, com resposta 204 No Content
      why: DELETE remove um recurso. Aqui o fã está sendo criado.
  answer: 0
  explanation: |
    O método diz a intenção do pedido: GET lê, POST cria, PUT e PATCH alteram, DELETE remove. O status diz o que aconteceu: 2xx sucesso, 3xx redirecionamento, 4xx erro de quem pediu, 5xx erro do servidor.
- slug: classificar-status
  title: O que o servidor quis dizer
  difficulty: facil
  kind: js
  in:
    - introducao/What is HTTP?
  study:
    - label: Códigos de status HTTP (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Status
  statement: |
    O painel de monitoramento do site mostra uma etiqueta para cada resposta HTTP.

    Escreva a função `categoria(status)`, que recebe um número e devolve:

    - `'informativo'` de 100 a 199
    - `'sucesso'` de 200 a 299
    - `'redirecionamento'` de 300 a 399
    - `'erro do cliente'` de 400 a 499
    - `'erro do servidor'` de 500 a 599
    - `'inválido'` para qualquer outro valor, inclusive não inteiros
  solution: |
    function categoria(status) {
      if (!Number.isInteger(status) || status < 100 || status > 599) return 'inválido';
      return ['informativo', 'sucesso', 'redirecionamento', 'erro do cliente', 'erro do servidor'][Math.floor(status / 100) - 1];
    }
  tests:
    - name: casos comuns
      code: |
        expect(categoria(200)).toBe('sucesso');
        expect(categoria(404)).toBe('erro do cliente');
        expect(categoria(500)).toBe('erro do servidor');
    - name: redirecionamento e informativo
      code: |
        expect(categoria(301)).toBe('redirecionamento');
        expect(categoria(101)).toBe('informativo');
    - name: limites das faixas
      hidden: true
      code: |
        expect(categoria(199)).toBe('informativo');
        expect(categoria(299)).toBe('sucesso');
        expect(categoria(399)).toBe('redirecionamento');
        expect(categoria(499)).toBe('erro do cliente');
        expect(categoria(599)).toBe('erro do servidor');
    - name: fora das faixas
      hidden: true
      code: |
        expect(categoria(99)).toBe('inválido');
        expect(categoria(600)).toBe('inválido');
        expect(categoria(0)).toBe('inválido');
    - name: valores que não são inteiros
      hidden: true
      code: |
        expect(categoria(200.5)).toBe('inválido');
        expect(categoria(NaN)).toBe('inválido');
  hints:
    - Toda faixa começa num múltiplo de 100. `Math.floor(status / 100)` dá o primeiro dígito.
    - Rejeite primeiro o que não é inteiro ou está fora de 100 a 599.
  explanation: |
    Verificar os casos inválidos primeiro deixa o resto simples. O primeiro dígito do status identifica a classe da resposta, então um array indexado por ele substitui uma cadeia de if.
  traps:
    - reason: Não trata números quebrados
      code: |
        function categoria(s) {
          if (s < 100 || s > 599) return 'inválido';
          return ['informativo', 'sucesso', 'redirecionamento', 'erro do cliente', 'erro do servidor'][Math.floor(s / 100) - 1];
        }
    - reason: Erra o limite superior
      code: |
        function categoria(s) {
          if (!Number.isInteger(s)) return 'inválido';
          if (s >= 100 && s < 199) return 'informativo';
          if (s >= 200 && s < 299) return 'sucesso';
          if (s >= 300 && s < 399) return 'redirecionamento';
          if (s >= 400 && s < 499) return 'erro do cliente';
          if (s >= 500 && s < 599) return 'erro do servidor';
          return 'inválido';
        }
- slug: http2-multiplexado
  title: Vinte arquivos na mesma conexão
  difficulty: medio
  kind: quiz
  in:
    - introducao/What is HTTP?
    - web-servers/Nginx
  study:
    - label: Evolução do HTTP (MDN, em inglês)
      url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Evolution_of_HTTP
  statement: |
    A página do line-up carrega 20 imagens pequenas. Com HTTP/1.1, o navegador abre poucas conexões por servidor e cada uma atende um pedido por vez. Com HTTP/2, o tempo de carregamento cai bastante.

    O que o HTTP/2 muda?
  options:
    - text: Vários pedidos e respostas trafegam ao mesmo tempo numa única conexão, intercalados
      why: Certo. A multiplexação acaba com a fila de pedidos por conexão e o custo de abrir várias conexões.
    - text: Ele comprime as imagens automaticamente
      why: O HTTP/2 comprime os cabeçalhos, não o conteúdo das imagens.
    - text: Ele dispensa o DNS
      why: O navegador continua precisando do IP do servidor.
    - text: Ele troca o TCP por e-mail
      why: HTTP/2 roda sobre TCP. O HTTP/3 é que troca o TCP pelo QUIC, sobre UDP.
  answer: 0
  explanation: |
    No HTTP/1.1, cada conexão atende um pedido por vez, e o navegador abre só algumas por servidor. O HTTP/2 divide pedidos e respostas em quadros e intercala todos numa conexão. Técnicas antigas, como juntar imagens num sprite, ficaram menos necessárias.
- slug: resposta-304
  title: Nada mudou
  difficulty: medio
  kind: quiz
  visual: cache-http
  in:
    - introducao/What is HTTP?
    - caching/HTTP Caching
  study:
    - label: Cache HTTP (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/Caching
    - label: 304 Not Modified (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Status/304
  statement: |
    Na segunda visita, o navegador manda `GET /programacao.json` com o cabeçalho `If-None-Match: "a1b2"`. O servidor responde `304 Not Modified`, sem corpo.

    O que acontece?
  options:
    - text: O arquivo não mudou desde a ETag `a1b2`, e o navegador usa a cópia que já tinha
      why: Certo. A revalidação gasta uma ida ao servidor, mas evita baixar o conteúdo de novo.
    - text: O arquivo foi apagado do servidor
      why: Arquivo inexistente seria 404 ou 410. O 304 diz que a cópia do navegador continua válida.
    - text: O navegador precisa pedir de novo sem o cabeçalho
      why: Não precisa. O 304 já é a resposta completa para um pedido condicional.
    - text: É um redirecionamento para outra URL
      why: Apesar de estar na faixa 3xx, o 304 não redireciona. Ele confirma o cache.
  answer: 0
  explanation: |
    A ETag é uma impressão digital do conteúdo. O navegador a manda em `If-None-Match`, e o servidor compara: se for igual, responde 304 sem corpo. É assim que recursos com `no-cache` ficam sempre atualizados sem desperdiçar banda.
- slug: partes-do-dominio
  title: Anatomia de um endereço
  difficulty: facil
  kind: quiz
  in:
    - introducao/What is Domain Name?
  study:
    - label: O que é um nome de domínio (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_domain_name
  statement: |
    O festival usa o endereço `ingressos.festivalruido.com.br`.

    Qual afirmação está correta?
  options:
    - text: "`.com.br` é o domínio de topo, `festivalruido` é o nome registrado e `ingressos` é um subdomínio que o dono cria sem novo registro"
      why: Certo. Quem registra `festivalruido.com.br` pode criar quantos subdomínios quiser no próprio DNS.
    - text: "`ingressos` é o domínio de topo, porque é a primeira parte do endereço"
      why: O nome é lido da direita para a esquerda. O topo da hierarquia é a última parte.
    - text: Cada subdomínio precisa ser comprado separadamente no registro.br
      why: Só o domínio registrado é comprado. Os subdomínios são registros no DNS do próprio dono.
    - text: O domínio é o endereço IP do servidor, escrito com letras
      why: O domínio é um nome. O DNS é que aponta esse nome para um ou mais IPs, e o IP pode mudar sem o nome mudar.
  answer: 0
  explanation: |
    Um nome de domínio é uma hierarquia lida da direita para a esquerda: domínio de topo, nome registrado e subdomínios. Ele existe para pessoas, e o DNS traduz o nome para o endereço IP que as máquinas usam.
- slug: cookie-e-dominio
  title: O cookie que não chegou
  difficulty: medio
  kind: quiz
  in:
    - introducao/What is Domain Name?
    - apis/Cookie Based Auth
  study:
    - label: Cookies HTTP (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Guides/Cookies
    - label: Set-Cookie (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Reference/Headers/Set-Cookie
  statement: |
    O login em `conta.festivalruido.com.br` cria um cookie de sessão com `Set-Cookie: sessao=abc; Secure; HttpOnly`, sem o atributo `Domain`. Em `ingressos.festivalruido.com.br`, o servidor não recebe o cookie.

    Por quê?
  options:
    - text: Sem `Domain`, o cookie vale só para o host exato que o criou. Com `Domain=festivalruido.com.br`, ele iria para os subdomínios também
      why: Certo. A omissão é a opção mais restrita, e às vezes é exatamente o que se quer.
    - text: Cookies nunca funcionam em subdomínios
      why: Funcionam, desde que o atributo Domain inclua o domínio pai.
    - text: O HttpOnly impede o envio para outros servidores
      why: HttpOnly só impede o JavaScript de ler o cookie. Não muda para onde ele vai.
    - text: O Secure bloqueia o envio por HTTPS
      why: É o contrário. Secure faz o cookie ir só por HTTPS.
  answer: 0
  explanation: |
    O navegador decide para onde mandar um cookie pelo domínio, pelo caminho e pelos atributos. Um cookie sem `Domain` fica preso ao host que o criou. Abrir para subdomínios aumenta a superfície de ataque: um subdomínio comprometido passaria a receber a sessão.
- slug: estatico-ou-servidor
  title: Onde hospedar
  difficulty: facil
  kind: quiz
  in:
    - introducao/What is hosting?
  study:
    - label: O que é um servidor web (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_web_server
  statement: |
    O site do festival tem duas partes: as páginas de line-up, iguais para todo mundo e geradas no build, e a venda de ingressos, que consulta estoque e cobra o cartão.

    Que hospedagem atende cada parte?
  options:
    - text: As páginas de line-up cabem numa hospedagem estática ou CDN. A venda precisa de um servidor ou funções que executem código e guardem segredos
      why: Certo. Arquivos prontos podem ser servidos de perto do usuário, sem processamento. Cobrar cartão exige código no servidor e chaves que não podem ir para o navegador.
    - text: As duas partes podem ficar na hospedagem estática, chamando a API de pagamento direto do navegador com a chave secreta
      why: Qualquer coisa enviada ao navegador pode ser lida por quem abre o DevTools. A chave secreta de pagamento seria exposta.
    - text: As duas partes exigem um servidor dedicado, porque hospedagem estática não serve HTML
      why: Hospedagem estática serve exatamente HTML, CSS, JS e imagens. O que ela não faz é executar código seu a cada pedido.
    - text: Hospedagem é só o registro do domínio, então a escolha não muda nada
      why: Registrar o nome e hospedar o conteúdo são serviços diferentes, às vezes vendidos juntos.
  answer: 0
  explanation: |
    Hospedar é deixar os arquivos ou o código do site num computador sempre ligado e acessível. Conteúdo estático é barato e rápido de servir. Lógica com segredo ou banco de dados precisa rodar num servidor, num contêiner ou em funções serverless.
- slug: hospedagem-e-cdn
  title: O público de Portugal
  difficulty: facil
  kind: quiz
  in:
    - introducao/What is hosting?
    - caching/HTTP Caching
  study:
    - label: CDN no glossário do MDN
      url: https://developer.mozilla.org/pt-BR/docs/Glossary/CDN
  statement: |
    O site está num servidor em São Paulo. Fãs em Portugal reclamam que as imagens demoram. O conteúdo é o mesmo para todo mundo.

    O que ajuda mais?
  options:
    - text: Servir os arquivos estáticos por uma CDN, que guarda cópias em servidores perto de cada região
      why: Certo. A distância física aumenta a latência, e a CDN encurta o caminho até o arquivo.
    - text: Comprar um domínio .pt
      why: O domínio não muda onde os arquivos estão.
    - text: Aumentar a memória do servidor de São Paulo
      why: O gargalo é a distância e a latência, não a capacidade do servidor.
    - text: Pedir aos fãs que usem outro navegador
      why: Qualquer navegador sofre com a mesma distância.
  answer: 0
  explanation: |
    Uma CDN é uma rede de servidores espalhados pelo mundo que guardam cópias de arquivos. O pedido é atendido pelo ponto mais próximo, o que reduz a latência e alivia o servidor de origem. Funciona melhor com conteúdo igual para todos e com cabeçalhos de cache bem definidos.
- slug: dns-desatualizado
  title: Mudamos de servidor, mas nem todo mundo viu
  difficulty: medio
  kind: quiz
  visual: dns
  in:
    - introducao/DNS and how it works?
  study:
    - label: DNS no glossário do MDN, em inglês
      url: https://developer.mozilla.org/en-US/docs/Glossary/DNS
    - label: Como o DNS funciona, em quadrinhos (em inglês)
      url: https://howdns.works/
  statement: |
    A equipe trocou o registro A de `festivalruido.com.br` para o IP do servidor novo. Uma hora depois, parte do público ainda chega ao servidor antigo. O TTL do registro era de 86400 segundos.

    O que explica isso?
  options:
    - text: Resolvedores e navegadores guardam a resposta antiga em cache até o TTL vencer, que aqui é de um dia
      why: Certo. O TTL diz por quanto tempo a resposta pode ser reaproveitada. Baixar o TTL dias antes de uma migração encurta essa janela.
    - text: O DNS demora para copiar o site do servidor antigo para o novo
      why: O DNS não copia arquivos. Ele só responde qual IP corresponde ao nome.
    - text: O registro A só vale para quem acessa pelo celular
      why: O registro A vale para qualquer cliente IPv4. Celular e computador consultam o mesmo DNS.
    - text: Os usuários digitaram o endereço errado
      why: O endereço é o mesmo. O que difere é a resposta guardada em cache por cada resolvedor.
  answer: 0
  explanation: |
    Para achar o IP de um nome, o resolvedor pergunta aos servidores raiz, depois aos do domínio de topo e por fim aos servidores autoritativos do domínio. Para não repetir esse caminho, cada resposta fica em cache pelo tempo do TTL.
- slug: script-que-trava
  title: A página em branco
  difficulty: medio
  kind: quiz
  in:
    - introducao/Browsers and how they work?
  study:
    - label: Como os navegadores funcionam (MDN, em inglês)
      url: https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work
    - label: O elemento script, com defer e async (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/script
  statement: |
    A página do line-up tem `<script src="analytics.js"></script>` no início do `<head>`. Quando o servidor desse script fica lento, a página inteira demora a aparecer.

    Qual é a melhor correção?
  options:
    - text: Adicionar `defer` ao script, para o navegador baixar em paralelo e executar só depois de montar o HTML
      why: Certo. Um script comum interrompe a leitura do HTML até ser baixado e executado. Com defer, o HTML continua sendo lido e o script roda na ordem, ao final.
    - text: Mover o CSS para o fim do body, para o script carregar primeiro
      why: Isso piora o resultado, porque a página aparece sem estilo e depois muda. O problema é o script que bloqueia a leitura.
    - text: Trocar a extensão do arquivo para .mjs
      why: O nome do arquivo não muda como o navegador carrega o script. O que muda é o atributo type="module", defer ou async.
    - text: Não há correção, porque o navegador sempre espera todos os scripts antes de desenhar
      why: O navegador desenha assim que tem HTML e CSS suficientes. Só scripts que bloqueiam a leitura impedem isso.
  answer: 0
  explanation: |
    O navegador lê o HTML e monta o DOM, lê o CSS e monta o CSSOM, combina os dois, calcula o layout e pinta. Um script sem defer ou async para a leitura do HTML até ser baixado e executado.
- slug: ordem-dos-logs
  title: Em que ordem aparece?
  difficulty: medio
  kind: quiz
  visual: event-loop
  in:
    - backend-language/JavaScript
  study:
    - label: O laço de eventos (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Execution_model
    - label: Microtarefas (MDN, em inglês)
      url: https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide
  statement: |
    O que este código escreve no console?

    ```
    console.log('A');
    setTimeout(() => console.log('B'), 0);
    Promise.resolve().then(() => console.log('C'));
    console.log('D');
    ```
  options:
    - text: A D C B
      why: Certo. Primeiro o código síncrono, depois todas as microtarefas, como o then, e só então a próxima tarefa, o setTimeout.
    - text: A B C D
      why: Nenhum callback roda no meio do código síncrono. Eles esperam a pilha esvaziar.
    - text: A D B C
      why: O setTimeout foi agendado antes, mas a fila de microtarefas tem prioridade sobre a de tarefas.
    - text: A C D B
      why: O then não roda na hora, mesmo com a promessa já resolvida. Ele vai para a fila de microtarefas.
  answer: 0
  explanation: |
    O JavaScript roda uma coisa de cada vez. Callbacks de promessas entram na fila de microtarefas, e callbacks de timers e eventos entram na fila de tarefas. Quando a pilha esvazia, o laço de eventos roda todas as microtarefas e só depois pega a próxima tarefa.
- slug: await-no-meio
  title: O que vem depois do await
  difficulty: dificil
  kind: quiz
  visual: event-loop
  in:
    - backend-language/JavaScript
  study:
    - label: await (MDN)
      url: https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Operators/await
  statement: |
    O que este código escreve?

    ```
    async function carregar() {
      console.log('1');
      await null;
      console.log('2');
    }
    carregar();
    console.log('3');
    ```
  options:
    - text: 1 3 2
      why: Certo. A função roda até o primeiro await. O resto vira uma microtarefa, que só roda depois do código síncrono.
    - text: 1 2 3
      why: O await pausa a função mesmo quando o valor não é uma promessa.
    - text: 3 1 2
      why: Chamar uma função async executa o corpo na hora, até o primeiro await.
    - text: 2 1 3
      why: O código antes do await roda primeiro, de forma síncrona.
  answer: 0
  explanation: |
    Uma função `async` roda de forma síncrona até o primeiro `await`. Ali ela devolve uma promessa e agenda a continuação como microtarefa, mesmo que o valor esperado não seja uma promessa. Por isso o código depois da chamada roda antes do resto da função.
