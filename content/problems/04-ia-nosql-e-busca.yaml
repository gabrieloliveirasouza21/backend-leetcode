- slug: indice-invertido
  title: A busca por palavras do catálogo
  difficulty: dificil
  kind: js
  in: [search-engines/Elasticsearch, search-engines/Solr]
  study:
    - { label: "Índice invertido (Wikipédia, em inglês)", url: "https://en.wikipedia.org/wiki/Inverted_index" }
    - { label: "String.normalize (MDN)", url: "https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/String/normalize" }
  statement: |
    Motores de busca, como Elasticsearch e Solr, guardam um índice invertido: para cada termo, a lista de documentos que o contêm. Escreva `criarBusca(docs)`, que monta o índice uma vez e devolve `buscar(consulta)`.

    - cada doc é `{ id, texto }`, com `id` numérico
    - termos são sequências de letras e dígitos, em minúsculas e sem acentos: `São Paulo` vira `sao` e `paulo`
    - `buscar` devolve os `id` dos docs que têm todos os termos da consulta, em ordem crescente
    - um termo precisa ser igual, não basta aparecer dentro de outra palavra: `rock` não acha `rockabilly`
    - consulta sem termos devolve `[]`
  solution: |
    function criarBusca(docs) {
      const termos = (texto) =>
        texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
      const indice = new Map();
      for (const doc of docs) {
        for (const termo of new Set(termos(doc.texto))) {
          if (!indice.has(termo)) indice.set(termo, new Set());
          indice.get(termo).add(doc.id);
        }
      }
      return function buscar(consulta) {
        const lista = [...new Set(termos(consulta))];
        if (!lista.length) return [];
        let resultado = null;
        for (const termo of lista) {
          const ids = indice.get(termo) ?? new Set();
          resultado = resultado === null ? [...ids] : resultado.filter((id) => ids.has(id));
        }
        return resultado.sort((a, b) => a - b);
      };
    }
  tests:
    - name: todos os termos
      code: |
        const buscar = criarBusca([
          { id: 2, texto: 'Thrash metal de São Paulo' },
          { id: 1, texto: 'Black metal do Recife' },
          { id: 3, texto: 'Thrash de Belo Horizonte' },
        ]);
        expect(buscar('thrash metal')).toEqual([2]);
        expect(buscar('METAL')).toEqual([1, 2]);
    - name: sem acentos
      code: |
        const buscar = criarBusca([{ id: 7, texto: 'Turnê em São Paulo' }]);
        expect(buscar('sao paulo')).toEqual([7]);
        expect(buscar('turne')).toEqual([7]);
    - name: palavra inteira
      hidden: true
      code: |
        const buscar = criarBusca([{ id: 1, texto: 'Noite de rockabilly' }, { id: 2, texto: 'Rock, suor e cerveja!' }]);
        expect(buscar('rock')).toEqual([2]);
    - name: consultas vazias e termos ausentes
      hidden: true
      code: |
        const buscar = criarBusca([{ id: 1, texto: 'Doom metal' }]);
        expect(buscar('  ...  ')).toEqual([]);
        expect(buscar('doom jazz')).toEqual([]);
    - name: ids em ordem
      hidden: true
      code: |
        const buscar = criarBusca([{ id: 10, texto: 'metal' }, { id: 2, texto: 'metal' }, { id: 33, texto: 'metal metal' }]);
        expect(buscar('metal')).toEqual([2, 10, 33]);
  hints:
    - "`normalize('NFD')` separa as letras dos acentos, e `replace(/[\\u0300-\\u036f]/g, '')` remove os acentos."
    - Com um conjunto de ids por termo, a busca é a interseção dos conjuntos.
  explanation: |
    O índice invertido troca trabalho na escrita por velocidade na leitura: a busca consulta listas prontas em vez de ler todos os textos. A análise do texto, com tokenização, minúsculas e remoção de acentos, precisa ser igual na indexação e na consulta, senão os termos não se encontram.
  traps:
    - reason: Procura dentro do texto, sem índice
      code: |
        function criarBusca(docs) {
          const norm = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
          return (q) => {
            const ts = norm(q).split(/[^a-z0-9]+/).filter(Boolean);
            if (!ts.length) return [];
            return docs.filter((d) => ts.every((t) => norm(d.texto).includes(t))).map((d) => d.id).sort((a, b) => a - b);
          };
        }
    - reason: Não remove os acentos
      code: |
        function criarBusca(docs) {
          const ts = (t) => t.toLowerCase().split(/[^a-z0-9à-ú]+/).filter(Boolean);
          const idx = new Map();
          for (const d of docs) for (const t of ts(d.texto)) idx.set(t, [...(idx.get(t) ?? []), d.id]);
          return (q) => {
            const l = ts(q);
            if (!l.length) return [];
            return [...new Set(idx.get(l[0]) ?? [])].filter((id) => l.every((t) => (idx.get(t) ?? []).includes(id))).sort((a, b) => a - b);
          };
        }

- slug: texto-ou-keyword
  title: O filtro por gênero que não funciona
  difficulty: medio
  kind: quiz
  in: [search-engines/Elasticsearch]
  study:
    - { label: "Tipos text e keyword (Elasticsearch, em inglês)", url: "https://www.elastic.co/docs/reference/elasticsearch/mapping-reference/keyword" }
  statement: |
    No Elasticsearch, o campo `genero` foi mapeado como `text`. A busca livre funciona, mas o filtro exato por `Thrash Metal` e a contagem de bandas por gênero dão resultados estranhos, como contar `thrash` e `metal` separados.

    O que explica?
  options:
    - text: Campos text passam por análise e viram termos separados, ótimos para busca livre. Filtros exatos, ordenação e agregações pedem keyword, que guarda o valor inteiro
      why: Certo. É comum mapear o mesmo campo dos dois jeitos, com multi-fields.
    - text: O Elasticsearch não sabe contar
      why: As agregações funcionam bem, sobre o tipo de campo certo.
    - text: Faltou um índice no banco relacional
      why: A busca e as agregações acontecem no Elasticsearch, com o mapeamento dele.
    - text: Basta escrever o filtro em maiúsculas
      why: O problema é a análise do campo, não a forma de escrever.
  answer: 0
  explanation: |
    O Elasticsearch é um motor de busca distribuído construído sobre o Lucene. O mapeamento define como cada campo é analisado e indexado. Errar o mapeamento é a causa mais comum de buscas e agregações estranhas, e mudar o tipo de um campo exige reindexar.

- slug: busca-nao-e-fonte-da-verdade
  title: O índice de busca desatualizado
  difficulty: medio
  kind: quiz
  in: [search-engines/Elasticsearch, search-engines/Solr, architectural-patterns/Microservices]
  study:
    - { label: "Solr: visão geral (em inglês)", url: "https://solr.apache.org/guide/solr/latest/getting-started/introduction.html" }
  statement: |
    O catálogo de merch fica no PostgreSQL, e a busca do site usa Solr. Um produto esgotado continua aparecendo como disponível na busca por alguns minutos.

    Qual é a arquitetura mais saudável?
  options:
    - text: O PostgreSQL continua sendo a fonte da verdade. O Solr é um índice derivado, atualizado a cada mudança por eventos ou por uma fila, e o estoque é conferido no banco na hora da compra
      why: Certo. Motores de busca são ótimos para encontrar, mas atualizam com atraso e não têm transações como o banco.
    - text: Guardar tudo só no Solr e apagar o banco
      why: Motores de busca não oferecem as garantias transacionais que vendas precisam.
    - text: Reindexar tudo a cada pedido de busca
      why: Isso torna a busca lenta e cara.
    - text: Desistir da busca e usar LIKE no banco
      why: LIKE não oferece relevância, tolerância a erros nem bom desempenho em textos grandes.
  answer: 0
  explanation: |
    Solr e Elasticsearch usam o Lucene por baixo e oferecem busca com relevância, sinônimos e facetas. Eles costumam receber cópias dos dados do banco principal. O atraso entre os dois é normal, e o sistema precisa ser desenhado para tolerá-lo.
