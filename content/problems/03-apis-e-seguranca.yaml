- slug: rota-mais-especifica
  title: Para qual serviço vai o pedido
  difficulty: medio
  kind: js
  visual: requisicao
  in: [web-servers/Nginx, web-servers/Caddy]
  study:
    - { label: "Diretiva location (Nginx, em inglês)", url: "https://nginx.org/en/docs/http/ngx_http_core_module.html#location" }
  statement: |
    O proxy reverso manda cada pedido para um serviço, conforme o prefixo do caminho. Escreva `escolherRota(rotas, caminho)`, que devolve a rota de prefixo mais longo que combina, ou `null`:

    - `/api` combina com `/api` e com `/api/shows`, mas não com `/apix`. O prefixo termina numa barra ou no fim do caminho
    - `/` combina com qualquer caminho
    - a ordem da lista não importa
  solution: |
    function escolherRota(rotas, caminho) {
      let melhor = null;
      for (const rota of rotas) {
        const base = rota.endsWith('/') ? rota : rota + '/';
        const combina = caminho === rota || caminho.startsWith(base);
        if (combina && (melhor === null || rota.length > melhor.length)) melhor = rota;
      }
      return melhor;
    }
  tests:
    - name: o mais longo vence
      code: |
        const rotas = ['/', '/api', '/api/admin'];
        expect(escolherRota(rotas, '/api/admin/usuarios')).toBe('/api/admin');
        expect(escolherRota(rotas, '/api/shows')).toBe('/api');
        expect(escolherRota(rotas, '/sobre')).toBe('/');
    - name: o caminho exato
      code: |
        expect(escolherRota(['/', '/api'], '/api')).toBe('/api');
    - name: prefixo no meio da palavra
      hidden: true
      code: |
        expect(escolherRota(['/', '/api'], '/apix')).toBe('/');
    - name: nada combina
      hidden: true
      code: |
        expect(escolherRota(['/api'], '/loja')).toBe(null);
    - name: a ordem não importa
      hidden: true
      code: |
        expect(escolherRota(['/api/admin', '/', '/api'], '/api/admin')).toBe('/api/admin');
  hints:
    - Compare com `rota + '/'` para exigir o fim de um segmento.
  explanation: |
    Proxies como Nginx e Caddy escolhem o bloco mais específico, não o primeiro que aparece. A confusão entre prefixo de texto e prefixo de caminho é uma fonte clássica de bugs de roteamento e até de falhas de segurança, como expor `/admin-backup` por uma regra de `/admin`.
  traps:
    - reason: Prefixo de texto, não de caminho
      code: |
        function escolherRota(rotas, caminho) {
          let m = null;
          for (const r of rotas) if (caminho.startsWith(r) && (m === null || r.length > m.length)) m = r;
          return m;
        }
    - reason: Fica com a primeira que combina
      code: |
        function escolherRota(rotas, caminho) {
          return rotas.find((r) => caminho === r || caminho.startsWith(r.endsWith('/') ? r : r + '/')) ?? null;
        }

- slug: md5-nao-serve
  title: O MD5 do sistema antigo
  difficulty: facil
  kind: quiz
  in: [web-security/MD5]
  study:
    - { label: "MD5 (Wikipédia)", url: "https://pt.wikipedia.org/wiki/MD5" }
    - { label: "RFC 6151: segurança do MD5 (em inglês)", url: "https://www.rfc-editor.org/rfc/rfc6151" }
  statement: |
    O sistema antigo de credenciamento guarda as senhas como `MD5(senha)` e confere arquivos enviados com MD5.

    Qual afirmação está correta?
  options:
    - text: MD5 tem colisões práticas e é rápido demais. Não serve para senhas nem para provar que um arquivo não foi adulterado. Ainda serve para detectar corrupção acidental
      why: Certo. Contra um atacante, use SHA-256 para integridade e bcrypt, scrypt ou Argon2 para senhas.
    - text: MD5 é seguro porque gera 128 bits
      why: Gerar colisões de MD5 leva segundos num computador comum.
    - text: Basta aplicar MD5 duas vezes
      why: Repetir um hash rápido continua rápido para quem testa bilhões de senhas.
    - text: MD5 é criptografia e pode ser revertido com a chave
      why: MD5 é um hash, sem chave. A fraqueza está nas colisões e na velocidade.
  answer: 0
  explanation: |
    Uma função de hash criptográfica deve tornar impraticável achar duas entradas com o mesmo resultado. O MD5 perdeu essa propriedade em 2004. Para senhas, o problema é outro: qualquer hash rápido, até o SHA-256, permite testar bilhões de tentativas por segundo.

- slug: etag-com-sha256
  title: A ETag do catálogo
  difficulty: medio
  kind: js
  in: [web-security/SHA, caching/HTTP Caching]
  study:
    - { label: "SubtleCrypto.digest (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/API/SubtleCrypto/digest" }
    - { label: "ETag (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/ETag" }
  statement: |
    A API do catálogo de merch responde com uma `ETag` calculada do corpo, para os clientes revalidarem o cache.

    Escreva `async function etag(corpo)`, que devolve os 16 primeiros caracteres hexadecimais do SHA-256 do texto em UTF-8, entre aspas duplas. Por exemplo, `etag('abc')` dá `"ba7816bf8f01cfea"`. Use `crypto.subtle.digest`.
  solution: |
    async function etag(corpo) {
      const bytes = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(corpo)));
      const hex = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
      return `"${hex.slice(0, 16)}"`;
    }
  tests:
    - name: '"abc"'
      code: |
        expect(await etag('abc')).toBe('"ba7816bf8f01cfea"');
    - name: texto vazio
      code: |
        expect(await etag('')).toBe('"e3b0c44298fc1c14"');
    - name: acentos em UTF-8
      hidden: true
      code: |
        const bytes = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('Camiseta ação')));
        const hex = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
        expect(await etag('Camiseta ação')).toBe(`"${hex.slice(0, 16)}"`);
    - name: corpos diferentes, ETags diferentes
      hidden: true
      code: |
        expect(await etag('{"estoque":1}')).not.toBe(await etag('{"estoque":2}'));
  hints:
    - "`crypto.subtle.digest('SHA-256', bytes)` devolve um `ArrayBuffer`."
    - Bytes menores que 16 viram um dígito só em hexadecimal. `padStart(2, '0')` completa.
  explanation: |
    SHA-256 é um hash criptográfico sem colisões conhecidas, e serve para identificar conteúdo: ETags, nomes de arquivo com hash, verificação de downloads. Truncar para 16 caracteres basta para uma ETag, mas não para provar integridade contra um atacante.
  traps:
    - reason: Esquece o zero à esquerda
      code: |
        async function etag(corpo) {
          const b = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(corpo)));
          return `"${Array.from(b, (x) => x.toString(16)).join('').slice(0, 16)}"`;
        }
    - reason: Usa SHA-1
      code: |
        async function etag(corpo) {
          const b = new Uint8Array(await crypto.subtle.digest('SHA-1', new TextEncoder().encode(corpo)));
          return `"${Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('').slice(0, 16)}"`;
        }

- slug: assinatura-do-webhook
  title: O webhook do gateway de pagamento
  difficulty: dificil
  kind: js
  in: [web-security/SHA, apis/Token Authentication]
  study:
    - { label: "Validando entregas de webhooks (GitHub)", url: "https://docs.github.com/pt/webhooks/using-webhooks/validating-webhook-deliveries" }
    - { label: "SubtleCrypto.sign (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/API/SubtleCrypto/sign" }
  statement: |
    O gateway avisa a API quando um pagamento é aprovado, num `POST` com o cabeçalho `x-assinatura: sha256=<hex>`. O hex é o HMAC-SHA256 do corpo, com um segredo que só a API e o gateway conhecem.

    Escreva `async function assinaturaValida(segredo, corpo, assinatura)`, que devolve `true` só quando a assinatura confere:

    - o prefixo precisa ser `sha256=`
    - o hex recebido pode vir em maiúsculas
    - compare sem parar no primeiro caractere diferente, para não vazar informação pelo tempo de resposta
  solution: |
    async function assinaturaValida(segredo, corpo, assinatura) {
      if (typeof assinatura !== 'string' || !assinatura.startsWith('sha256=')) return false;
      const texto = new TextEncoder();
      const chave = await crypto.subtle.importKey('raw', texto.encode(segredo), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const bytes = new Uint8Array(await crypto.subtle.sign('HMAC', chave, texto.encode(corpo)));
      const esperado = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
      const recebido = assinatura.slice('sha256='.length).toLowerCase();
      if (recebido.length !== esperado.length) return false;
      let diferenca = 0;
      for (let i = 0; i < esperado.length; i++) diferenca |= esperado.charCodeAt(i) ^ recebido.charCodeAt(i);
      return diferenca === 0;
    }
  tests:
    - name: vetor conhecido
      code: |
        const s = 'sha256=f7bc83f430538424b13298e6aa6fb143ef4d59a14946175997479dbc2d1a3cd8';
        expect(await assinaturaValida('key', 'The quick brown fox jumps over the lazy dog', s)).toBe(true);
    - name: corpo adulterado
      code: |
        const s = 'sha256=f7bc83f430538424b13298e6aa6fb143ef4d59a14946175997479dbc2d1a3cd8';
        expect(await assinaturaValida('key', 'The quick brown fox jumps over the lazy cat', s)).toBe(false);
    - name: hex em maiúsculas
      hidden: true
      code: |
        const s = 'sha256=F7BC83F430538424B13298E6AA6FB143EF4D59A14946175997479DBC2D1A3CD8';
        expect(await assinaturaValida('key', 'The quick brown fox jumps over the lazy dog', s)).toBe(true);
    - name: prefixo e formato
      hidden: true
      code: |
        const hex = 'f7bc83f430538424b13298e6aa6fb143ef4d59a14946175997479dbc2d1a3cd8';
        const corpo = 'The quick brown fox jumps over the lazy dog';
        expect(await assinaturaValida('key', corpo, 'sha1=' + hex)).toBe(false);
        expect(await assinaturaValida('key', corpo, 'sha256=' + hex.slice(0, 10))).toBe(false);
        expect(await assinaturaValida('key', corpo, undefined)).toBe(false);
    - name: segredo errado
      hidden: true
      code: |
        const s = 'sha256=f7bc83f430538424b13298e6aa6fb143ef4d59a14946175997479dbc2d1a3cd8';
        expect(await assinaturaValida('outra', 'The quick brown fox jumps over the lazy dog', s)).toBe(false);
  hints:
    - "`crypto.subtle.importKey('raw', bytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])` cria a chave."
    - Para comparar em tempo constante, junte as diferenças de todos os caracteres com `|=` e só confira no fim.
  explanation: |
    HMAC prova que a mensagem veio de quem tem o segredo e que não foi alterada. Um hash simples de segredo mais corpo é vulnerável a ataques de extensão de tamanho. A comparação em tempo constante impede que um atacante descubra a assinatura certa medindo quanto cada tentativa demora.
  traps:
    - reason: Hash do segredo com o corpo, sem HMAC
      code: |
        async function assinaturaValida(segredo, corpo, assinatura) {
          const b = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(segredo + corpo)));
          return assinatura === 'sha256=' + Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
        }
    - reason: Não aceita maiúsculas
      code: |
        async function assinaturaValida(segredo, corpo, assinatura) {
          const t = new TextEncoder();
          const k = await crypto.subtle.importKey('raw', t.encode(segredo), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
          const b = new Uint8Array(await crypto.subtle.sign('HMAC', k, t.encode(corpo)));
          return assinatura === 'sha256=' + Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
        }

- slug: ler-hash-bcrypt
  title: O que há dentro de um hash bcrypt
  difficulty: medio
  kind: js
  in: [web-security/bcrypt]
  study:
    - { label: "bcrypt (Wikipédia, em inglês)", url: "https://en.wikipedia.org/wiki/Bcrypt" }
    - { label: "Armazenamento de senhas (OWASP, em inglês)", url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html" }
  statement: |
    Um hash bcrypt guarda tudo que é preciso para conferir a senha depois: `$2b$12$` seguido de 22 caracteres de sal e 31 de hash, num alfabeto de `.`, `/`, letras e dígitos.

    O sistema vai subir o custo mínimo, e as senhas antigas precisam ser refeitas no próximo login. Escreva `lerBcrypt(hash)`, que devolve `{ versao, custo, sal, hash }` ou `null` se o formato for inválido. `custo` é um número. As versões válidas são `2a`, `2b`, `2x` e `2y`.
  solution: |
    function lerBcrypt(hash) {
      const partes = /^\$(2[abxy])\$(\d{2})\$([./A-Za-z0-9]{22})([./A-Za-z0-9]{31})$/.exec(String(hash));
      if (!partes) return null;
      return { versao: partes[1], custo: Number(partes[2]), sal: partes[3], hash: partes[4] };
    }
  tests:
    - name: lê as partes
      code: |
        expect(lerBcrypt('$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy')).toEqual({
          versao: '2a', custo: 10, sal: 'N9qo8uLOickgx2ZMRZoMye', hash: 'IjZAgcfl7p92ldGxad68LJZdL17lhWy',
        });
    - name: formato errado
      code: |
        expect(lerBcrypt('5f4dcc3b5aa765d61d8327deb882cf99')).toBe(null);
    - name: custo com zero à esquerda
      hidden: true
      code: |
        expect(lerBcrypt('$2b$04$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy').custo).toBe(4);
    - name: tamanho errado
      hidden: true
      code: |
        expect(lerBcrypt('$2b$12$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhW')).toBe(null);
        expect(lerBcrypt('$2b$12$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWyy')).toBe(null);
    - name: outra família de hash
      hidden: true
      code: |
        expect(lerBcrypt('$1$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy')).toBe(null);
  hints:
    - Uma expressão regular com grupos para versão, custo, sal e hash resolve tudo de uma vez.
    - "`Number('04')` dá 4."
  explanation: |
    O custo do bcrypt é um expoente: cada ponto a mais dobra o tempo de cálculo. Como o custo e o sal ficam dentro do próprio hash, dá para conferir senhas antigas e, no login, refazer o hash com o custo novo quando ele estiver abaixo do mínimo.
  traps:
    - reason: Custo como texto
      code: |
        function lerBcrypt(h) {
          const m = /^\$(2[abxy])\$(\d{2})\$([./A-Za-z0-9]{22})([./A-Za-z0-9]{31})$/.exec(String(h));
          return m ? { versao: m[1], custo: m[2], sal: m[3], hash: m[4] } : null;
        }
    - reason: Não confere o tamanho
      code: |
        function lerBcrypt(h) {
          const [, versao, custo, resto] = String(h).split('$');
          if (!resto || !/^2[abxy]$/.test(versao)) return null;
          return { versao, custo: Number(custo), sal: resto.slice(0, 22), hash: resto.slice(22) };
        }

- slug: hash-lento-de-proposito
  title: Por que o hash de senha é lento
  difficulty: medio
  kind: quiz
  in: [web-security/bcrypt, web-security/scrypt]
  study:
    - { label: "Armazenamento de senhas (OWASP, em inglês)", url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html" }
  statement: |
    Um dev propõe trocar o bcrypt por SHA-256 com sal, porque o login ficaria 200 ms mais rápido.

    Por que não fazer isso?
  options:
    - text: Se o banco vazar, o atacante testa senhas offline. Com SHA-256, uma placa de vídeo testa bilhões por segundo. Com bcrypt ou scrypt, cada tentativa custa caro de propósito
      why: Certo. A lentidão é a defesa. O custo de 200 ms por login é pequeno para a API e enorme para quem testa bilhões de senhas.
    - text: SHA-256 não aceita sal
      why: Aceita, mas o sal sozinho não impede testar senhas rapidamente.
    - text: bcrypt pode ser revertido em caso de emergência
      why: Nenhum hash de senha pode ser revertido, e isso é o que se quer.
    - text: Não há diferença, os dois são hashes
      why: Hashes rápidos servem para integridade. Hashes de senha são feitos para ser caros.
  answer: 0
  explanation: |
    Funções de hash de senha, como bcrypt, scrypt e Argon2, têm um custo ajustável e um sal por senha. O sal impede tabelas pré-calculadas, e o custo limita quantas tentativas por segundo um atacante consegue. A OWASP recomenda Argon2id, com scrypt e bcrypt como alternativas.

- slug: scrypt-e-memoria
  title: O hash que pede memória
  difficulty: dificil
  kind: quiz
  in: [web-security/scrypt]
  study:
    - { label: "RFC 7914: scrypt (em inglês)", url: "https://www.rfc-editor.org/rfc/rfc7914" }
  statement: |
    O scrypt tem, além do custo de tempo, um parâmetro que define quanta memória cada cálculo usa.

    Que vantagem isso traz contra atacantes?
  options:
    - text: Placas de vídeo e chips dedicados rodam milhares de cálculos em paralelo, mas com pouca memória para cada um. Exigir memória limita esse paralelismo
      why: Certo. Funções que usam muita memória, como scrypt e Argon2, encarecem o hardware de ataque.
    - text: A memória guarda a senha original para recuperação
      why: A memória é usada durante o cálculo e descartada. Nada é recuperável.
    - text: Funções com memória são mais rápidas para o servidor
      why: O objetivo é ser caro para todo mundo, inclusive o servidor, dentro de um limite aceitável.
    - text: Elas dispensam o sal
      why: O sal continua necessário, para cada senha ter um hash diferente.
  answer: 0
  explanation: |
    O bcrypt é limitado em tempo, mas usa pouca memória. O scrypt e o Argon2 são memory-hard: o custo de memória torna caro fabricar hardware dedicado. Escolha os parâmetros para o login levar algumas centenas de milissegundos no servidor.

- slug: certificado-coringa
  title: O certificado vale para este domínio?
  difficulty: medio
  kind: js
  in: [web-security/SSL/TLS]
  study:
    - { label: "RFC 6125: nomes com coringa (em inglês)", url: "https://www.rfc-editor.org/rfc/rfc6125#section-6.4.3" }
    - { label: "TLS (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/Security/Transport_Layer_Security" }
  statement: |
    O festival tem um certificado para `*.festival.com`. Escreva `nomeConfere(padrao, host)`, que diz se o nome do certificado vale para o host, como os navegadores fazem:

    - a comparação não diferencia maiúsculas
    - `*` só vale como o primeiro rótulo inteiro, e cobre exatamente um rótulo: `*.festival.com` vale para `loja.festival.com`, mas não para `festival.com` nem para `a.loja.festival.com`
    - sem `*`, o nome precisa ser igual
  solution: |
    function nomeConfere(padrao, host) {
      const p = padrao.toLowerCase().split('.');
      const h = host.toLowerCase().split('.');
      if (p.length !== h.length) return false;
      return p.every((parte, i) => (i === 0 && parte === '*' ? h[0].length > 0 : parte === h[i]));
    }
  tests:
    - name: coringa
      code: |
        expect(nomeConfere('*.festival.com', 'loja.festival.com')).toBe(true);
        expect(nomeConfere('*.festival.com', 'festival.com')).toBe(false);
    - name: nome exato
      code: |
        expect(nomeConfere('festival.com', 'FESTIVAL.com')).toBe(true);
        expect(nomeConfere('festival.com', 'loja.festival.com')).toBe(false);
    - name: coringa cobre um rótulo só
      hidden: true
      code: |
        expect(nomeConfere('*.festival.com', 'a.loja.festival.com')).toBe(false);
    - name: sufixo parecido
      hidden: true
      code: |
        expect(nomeConfere('*.festival.com', 'lojafestival.com')).toBe(false);
        expect(nomeConfere('*.festival.com', 'loja.festival.com.br')).toBe(false);
    - name: coringa fora do começo
      hidden: true
      code: |
        expect(nomeConfere('loja.*.com', 'loja.festival.com')).toBe(false);
  hints:
    - Separe os dois nomes por `.` e compare rótulo por rótulo.
  explanation: |
    Na conexão TLS, o cliente confere se o certificado foi emitido para o nome que ele pediu. Coringas cobrem um nível só, por isso `*.festival.com` não protege `api.loja.festival.com`. Regras frouxas, como transformar `*` em `.*` numa regex, já causaram falhas de segurança reais.
  traps:
    - reason: Coringa vira .* e atravessa pontos
      code: |
        function nomeConfere(p, h) {
          const re = new RegExp('^' + p.toLowerCase().replace(/\./g, '\\.').replace('*', '.*') + '$');
          return re.test(h.toLowerCase());
        }
    - reason: Só confere o final
      code: |
        function nomeConfere(p, h) {
          p = p.toLowerCase(); h = h.toLowerCase();
          return p.startsWith('*.') ? h.endsWith(p.slice(1)) : p === h;
        }

- slug: cadeia-incompleta
  title: Funciona no navegador, falha na API
  difficulty: dificil
  kind: quiz
  in: [web-security/SSL/TLS, web-servers/Nginx]
  study:
    - { label: "Cadeia de certificados (Let's Encrypt)", url: "https://letsencrypt.org/pt-br/certificates/" }
  statement: |
    Depois de instalar um certificado novo, o site abre normalmente no Chrome, mas o parceiro que chama a API com um cliente HTTP em Python recebe `certificate verify failed: unable to get local issuer certificate`.

    Qual a causa mais provável?
  options:
    - text: O servidor manda só o certificado do domínio, sem o intermediário. Navegadores às vezes completam a cadeia sozinhos, clientes de linha de comando não. Configure o arquivo com a cadeia completa
      why: Certo. No Nginx, ssl_certificate deve apontar para o fullchain.
    - text: O Python não suporta HTTPS
      why: Suporta. O erro diz que ele não conseguiu montar a cadeia até uma autoridade confiável.
    - text: O certificado expirou
      why: Um certificado expirado falharia também no navegador, com outra mensagem.
    - text: O parceiro precisa desligar a verificação de certificado
      why: Isso aceita qualquer certificado, inclusive de um atacante no meio do caminho.
  answer: 0
  explanation: |
    Um certificado é confiável quando forma uma cadeia até uma autoridade raiz que o cliente conhece. O servidor precisa enviar os intermediários. Ferramentas como `openssl s_client -showcerts` mostram o que o servidor realmente manda.

- slug: conserte-404-com-200
  title: O show que não existe responde 200
  difficulty: facil
  kind: js
  visual: requisicao
  in: [conserte/APIs, apis/REST]
  study:
    - { label: "Códigos de status HTTP (MDN)", url: "https://developer.mozilla.org/pt-BR/docs/Web/HTTP/Status" }
  starter: |
    async function buscarShow(req, db) {
      const id = Number(req.params.id);
      const show = await db.buscarShow(id);
      if (!show) return { status: 200, headers: {}, body: { erro: 'show não encontrado' } };
      return { status: 200, headers: {}, body: show };
    }
  statement: |
    A rota `GET /shows/:id` responde `200` até quando o show não existe, e o app mostra uma tela vazia em vez da mensagem de erro. Além disso, `/shows/abc` chega ao banco.

    Conserte `buscarShow(req, db)`:

    - `id` que não seja um inteiro positivo, só com dígitos, responde `400` sem consultar o banco
    - show inexistente responde `404`
    - show encontrado responde `200` com o show no `body`
  solution: |
    async function buscarShow(req, db) {
      const texto = String(req.params.id);
      if (!/^\d+$/.test(texto) || Number(texto) === 0) {
        return { status: 400, headers: {}, body: { erro: 'id inválido' } };
      }
      const show = await db.buscarShow(Number(texto));
      if (!show) return { status: 404, headers: {}, body: { erro: 'show não encontrado' } };
      return { status: 200, headers: {}, body: show };
    }
  tests:
    - name: encontrado
      code: |
        const db = { buscarShow: async (id) => (id === 3 ? { id: 3, banda: 'Ferro Velho' } : null) };
        const r = await buscarShow({ params: { id: '3' } }, db);
        expect(r.status).toBe(200);
        expect(r.body).toEqual({ id: 3, banda: 'Ferro Velho' });
    - name: inexistente
      code: |
        const db = { buscarShow: async () => null };
        expect((await buscarShow({ params: { id: '99' } }, db)).status).toBe(404);
    - name: id inválido não chega ao banco
      hidden: true
      code: |
        const db = { buscarShow: fn(async () => null) };
        for (const id of ['abc', '1.5', '-3', '0', '', '2e3']) {
          expect((await buscarShow({ params: { id } }, db)).status).toBe(400);
        }
        expect(db.buscarShow).toHaveBeenCalledTimes(0);
  hints:
    - "`Number('')` dá 0 e `Number('2e3')` dá 2000. Confira o texto com uma regex antes de converter."
  explanation: |
    O status é a primeira coisa que clientes, caches e monitores leem. Um erro com `200` passa por sucesso em todos eles. Validar o formato antes de consultar o banco poupa trabalho e evita mensagens de erro do banco vazando para a resposta.
  traps:
    - reason: Number aceita frações e notação científica
      code: |
        async function buscarShow(req, db) {
          const id = Number(req.params.id);
          if (Number.isNaN(id) || id <= 0) return { status: 400, headers: {}, body: {} };
          const show = await db.buscarShow(id);
          return show ? { status: 200, headers: {}, body: show } : { status: 404, headers: {}, body: {} };
        }

- slug: conserte-criacao-201
  title: O show criado sem endereço
  difficulty: medio
  kind: js
  visual: requisicao
  in: [conserte/APIs, apis/REST, apis/JSON APIs]
  study:
    - { label: "201 Created (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/201" }
    - { label: "422 Unprocessable Content (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/422" }
  starter: |
    async function criarShow(req, db) {
      const show = await db.inserirShow(req.body);
      return { status: 200, headers: {}, body: show };
    }
  statement: |
    `POST /shows` grava qualquer coisa que chega e responde `200`. Conserte `criarShow(req, db)`:

    - `band_id` precisa ser inteiro positivo e `show_date` precisa estar no formato `AAAA-MM-DD`. Se algum falhar, responda `422` com `body: { campos: [...] }`, listando os campos inválidos nessa ordem, sem gravar nada
    - quando grava, responda `201`, com o show criado no `body` e o cabeçalho `location` apontando para `/shows/<id>`
  solution: |
    async function criarShow(req, db) {
      const corpo = req.body ?? {};
      const campos = [];
      if (!Number.isInteger(corpo.band_id) || corpo.band_id <= 0) campos.push('band_id');
      if (typeof corpo.show_date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(corpo.show_date)) campos.push('show_date');
      if (campos.length) return { status: 422, headers: {}, body: { campos } };
      const show = await db.inserirShow({ band_id: corpo.band_id, show_date: corpo.show_date });
      return { status: 201, headers: { location: `/shows/${show.id}` }, body: show };
    }
  tests:
    - name: cria com 201 e location
      code: |
        const db = { inserirShow: async (s) => ({ id: 41, ...s }) };
        const r = await criarShow({ body: { band_id: 2, show_date: '2026-09-12' } }, db);
        expect(r.status).toBe(201);
        expect(r.headers.location).toBe('/shows/41');
        expect(r.body.id).toBe(41);
    - name: campos inválidos
      code: |
        const db = { inserirShow: fn(async (s) => ({ id: 1, ...s })) };
        const r = await criarShow({ body: { band_id: 'dois', show_date: '12/09/2026' } }, db);
        expect(r.status).toBe(422);
        expect(r.body.campos).toEqual(['band_id', 'show_date']);
        expect(db.inserirShow).toHaveBeenCalledTimes(0);
    - name: um campo só
      hidden: true
      code: |
        const db = { inserirShow: fn(async (s) => ({ id: 1, ...s })) };
        expect((await criarShow({ body: { band_id: 0, show_date: '2026-09-12' } }, db)).body.campos).toEqual(['band_id']);
        expect((await criarShow({ body: { band_id: 3 } }, db)).body.campos).toEqual(['show_date']);
        expect((await criarShow({}, db)).body.campos).toEqual(['band_id', 'show_date']);
        expect(db.inserirShow).toHaveBeenCalledTimes(0);
  hints:
    - Junte todos os campos inválidos antes de responder, para o app mostrar todos os erros de uma vez.
  explanation: |
    `201 Created` com `Location` diz ao cliente que algo novo existe e onde encontrá-lo. `422` indica que o JSON veio bem formado, mas os dados não passam nas regras. Listar todos os campos inválidos poupa idas e voltas ao formulário.
  traps:
    - reason: Sem o cabeçalho location
      code: |
        async function criarShow(req, db) {
          const c = req.body ?? {};
          const campos = [];
          if (!Number.isInteger(c.band_id) || c.band_id <= 0) campos.push('band_id');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(c.show_date ?? '')) campos.push('show_date');
          if (campos.length) return { status: 422, headers: {}, body: { campos } };
          return { status: 201, headers: {}, body: await db.inserirShow(c) };
        }
    - reason: Para no primeiro campo inválido
      code: |
        async function criarShow(req, db) {
          const c = req.body ?? {};
          if (!Number.isInteger(c.band_id) || c.band_id <= 0) return { status: 422, headers: {}, body: { campos: ['band_id'] } };
          if (!/^\d{4}-\d{2}-\d{2}$/.test(c.show_date ?? '')) return { status: 422, headers: {}, body: { campos: ['show_date'] } };
          const s = await db.inserirShow(c);
          return { status: 201, headers: { location: `/shows/${s.id}` }, body: s };
        }

- slug: conserte-chave-de-idempotencia
  title: Dois cliques, duas cobranças
  difficulty: dificil
  kind: js
  visual: corrida
  in: [conserte/APIs, apis/REST, more-databases/Failure Modes]
  study:
    - { label: "Requisições idempotentes (Stripe, em inglês)", url: "https://docs.stripe.com/api/idempotent_requests" }
  starter: |
    function criarIdempotente(criar) {
      const respostas = new Map();
      return async function handler(req) {
        const chave = req.headers['idempotency-key'];
        if (chave && respostas.has(chave)) return respostas.get(chave);
        const resposta = await criar(req);
        if (chave) respostas.set(chave, resposta);
        return resposta;
      };
    }
  statement: |
    O app manda o cabeçalho `idempotency-key` em cada compra, para um clique repetido não cobrar duas vezes. Mesmo assim, quando a pessoa clica duas vezes rápido, `criar` roda duas vezes.

    Conserte `criarIdempotente(criar)`, que devolve o `handler` da rota:

    - pedidos com a mesma chave, inclusive simultâneos, chamam `criar` uma vez só e recebem a mesma resposta
    - pedidos sem chave chamam `criar` sempre
    - se `criar` falhar, a chave não fica guardada, e uma nova tentativa com ela chama `criar` de novo
  solution: |
    function criarIdempotente(criar) {
      const respostas = new Map();
      return function handler(req) {
        const chave = req.headers['idempotency-key'];
        if (!chave) return Promise.resolve().then(() => criar(req));
        if (!respostas.has(chave)) {
          const promessa = Promise.resolve().then(() => criar(req));
          respostas.set(chave, promessa);
          promessa.catch(() => respostas.delete(chave));
        }
        return respostas.get(chave);
      };
    }
  tests:
    - name: repetição em sequência
      code: |
        const criar = fn(async () => ({ status: 201, body: { pedido: 1 } }));
        const handler = criarIdempotente(criar);
        const req = { headers: { 'idempotency-key': 'k1' } };
        await handler(req);
        expect(await handler(req)).toEqual({ status: 201, body: { pedido: 1 } });
        expect(criar).toHaveBeenCalledTimes(1);
    - name: cliques simultâneos
      code: |
        const criar = fn(() => new Promise((r) => setTimeout(() => r({ status: 201 }), 20)));
        const handler = criarIdempotente(criar);
        const req = { headers: { 'idempotency-key': 'k2' } };
        await Promise.all([handler(req), handler(req), handler(req)]);
        expect(criar).toHaveBeenCalledTimes(1);
    - name: sem chave
      hidden: true
      code: |
        const criar = fn(async () => ({ status: 201 }));
        const handler = criarIdempotente(criar);
        await handler({ headers: {} });
        await handler({ headers: {} });
        expect(criar).toHaveBeenCalledTimes(2);
    - name: falha não fica guardada
      hidden: true
      code: |
        let vez = 0;
        const criar = fn(async () => { if (++vez === 1) throw new Error('gateway fora'); return { status: 201 }; });
        const handler = criarIdempotente(criar);
        const req = { headers: { 'idempotency-key': 'k3' } };
        await expect(handler(req)).rejects.toMatch('gateway fora');
        expect(await handler(req)).toEqual({ status: 201 });
        expect(criar).toHaveBeenCalledTimes(2);
    - name: chaves diferentes
      hidden: true
      code: |
        const criar = fn(async () => ({ status: 201 }));
        const handler = criarIdempotente(criar);
        await handler({ headers: { 'idempotency-key': 'a' } });
        await handler({ headers: { 'idempotency-key': 'b' } });
        expect(criar).toHaveBeenCalledTimes(2);
  hints:
    - O código atual só guarda a resposta depois do `await`. Enquanto isso, o segundo clique não vê nada guardado.
    - Guarde a promessa assim que o primeiro pedido chega, antes de ela terminar.
  explanation: |
    A janela de corrida está entre a checagem e a gravação. Guardar a promessa em andamento faz os pedidos simultâneos esperarem o mesmo resultado. Em produção, com vários servidores, essa reserva fica num lugar compartilhado, como uma linha única no banco ou uma chave no Redis gravada com `SET NX`.
  traps:
    - reason: Guarda a falha para sempre
      code: |
        function criarIdempotente(criar) {
          const m = new Map();
          return function handler(req) {
            const k = req.headers['idempotency-key'];
            if (!k) return Promise.resolve().then(() => criar(req));
            if (!m.has(k)) m.set(k, Promise.resolve().then(() => criar(req)));
            return m.get(k);
          };
        }
