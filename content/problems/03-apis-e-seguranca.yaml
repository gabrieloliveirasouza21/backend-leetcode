- slug: ler-basic-auth
  title: O cabeçalho do painel da produção
  difficulty: medio
  kind: js
  in: [apis/Basic Authentication, apis/Authentication]
  study:
    - { label: "Autenticação HTTP (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Authentication" }
    - { label: "RFC 7617: o esquema Basic", url: "https://www.rfc-editor.org/rfc/rfc7617" }
    - { label: "TextDecoder (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/API/TextDecoder" }
  statement: |
    O painel interno da produção usa Basic Authentication. O navegador manda `Authorization: Basic <base64 de usuario:senha>`.

    Escreva `lerBasic(cabecalho)`, que devolve `{ usuario, senha }` ou `null` quando o cabeçalho não for um Basic válido:

    - o nome do esquema não diferencia maiúsculas: `basic` também vale
    - a senha pode conter `:`. Só o primeiro `:` separa usuário e senha
    - o texto decodificado é UTF-8, então `joão` precisa voltar como `joão`
    - base64 inválido, ausência de `:` ou cabeçalho ausente dão `null`
  solution: |
    function lerBasic(cabecalho) {
      if (typeof cabecalho !== 'string') return null;
      const partes = /^basic\s+(\S+)$/i.exec(cabecalho.trim());
      if (!partes) return null;
      let bytes;
      try {
        bytes = Uint8Array.from(atob(partes[1]), (c) => c.charCodeAt(0));
      } catch {
        return null;
      }
      const texto = new TextDecoder().decode(bytes);
      const i = texto.indexOf(':');
      if (i < 0) return null;
      return { usuario: texto.slice(0, i), senha: texto.slice(i + 1) };
    }
  tests:
    - name: lê usuário e senha
      code: |
        expect(lerBasic('Basic ' + btoa('produtor:metal123'))).toEqual({ usuario: 'produtor', senha: 'metal123' });
    - name: outro esquema não vale
      code: |
        expect(lerBasic('Bearer abc.def')).toBe(null);
        expect(lerBasic(undefined)).toBe(null);
    - name: senha com dois-pontos
      hidden: true
      code: |
        expect(lerBasic('Basic ' + btoa('ana:a:b:c'))).toEqual({ usuario: 'ana', senha: 'a:b:c' });
    - name: esquema em minúsculas
      hidden: true
      code: |
        expect(lerBasic('basic ' + btoa('x:y'))).toEqual({ usuario: 'x', senha: 'y' });
    - name: texto em UTF-8
      hidden: true
      code: |
        const b64 = btoa(String.fromCharCode(...new TextEncoder().encode('joão:sênha')));
        expect(lerBasic('Basic ' + b64)).toEqual({ usuario: 'joão', senha: 'sênha' });
    - name: entradas inválidas
      hidden: true
      code: |
        expect(lerBasic('Basic %%%')).toBe(null);
        expect(lerBasic('Basic ' + btoa('semdoispontos'))).toBe(null);
  hints:
    - "`atob` decodifica base64 para uma string em que cada caractere é um byte."
    - Para ler UTF-8, transforme esses caracteres em bytes e use `new TextDecoder().decode(bytes)`.
    - "`indexOf(':')` acha só o primeiro separador."
  explanation: |
    Basic Authentication manda usuário e senha em base64 a cada pedido. Base64 é só uma codificação, qualquer pessoa decodifica, então esse esquema só é aceitável sobre HTTPS. A RFC 7617 define que o usuário não pode ter `:`, mas a senha pode, por isso só o primeiro separa os dois.
  traps:
    - reason: split corta a senha que tem dois-pontos
      code: |
        function lerBasic(c) {
          const m = /^basic\s+(\S+)$/i.exec(String(c ?? ''));
          if (!m) return null;
          try {
            const [usuario, senha] = new TextDecoder().decode(Uint8Array.from(atob(m[1]), (x) => x.charCodeAt(0))).split(':');
            return senha === undefined ? null : { usuario, senha };
          } catch { return null; }
        }
    - reason: Ignora o UTF-8
      code: |
        function lerBasic(c) {
          const m = /^basic\s+(\S+)$/i.exec(String(c ?? ''));
          if (!m) return null;
          try {
            const t = atob(m[1]);
            const i = t.indexOf(':');
            return i < 0 ? null : { usuario: t.slice(0, i), senha: t.slice(i + 1) };
          } catch { return null; }
        }

- slug: basic-sem-https
  title: Base64 não é criptografia
  difficulty: facil
  kind: quiz
  in: [apis/Basic Authentication, web-security/HTTPS]
  study:
    - { label: "Autenticação HTTP (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Authentication" }
  statement: |
    Um colega diz que o painel com Basic Authentication está seguro mesmo em HTTP, porque a senha vai "codificada em base64".

    O que responder?
  options:
    - text: Base64 é reversível por qualquer pessoa. Sem HTTPS, quem enxerga o tráfego lê a senha. Basic só é aceitável sobre TLS
      why: Certo. Base64 transforma bytes em texto, sem chave e sem segredo.
    - text: Está seguro, porque base64 é um tipo de hash
      why: Hash não volta ao original. Base64 volta, com um comando.
    - text: Está seguro se a senha for longa
      why: O tamanho não importa quando a senha trafega legível.
    - text: Basta trocar base64 por base32
      why: Qualquer codificação sem chave é igualmente legível.
  answer: 0
  explanation: |
    Codificar não é cifrar. Base64 existe para transportar bytes como texto. A proteção da senha no caminho vem do TLS, e no servidor vem de guardar só o hash da senha, com um algoritmo lento como bcrypt.

- slug: quatrocentos-e-um-ou-tres
  title: Sem login ou sem permissão
  difficulty: facil
  kind: js
  visual: requisicao
  in: [apis/Basic Authentication, apis/Authentication]
  study:
    - { label: "401 Unauthorized (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401" }
    - { label: "403 Forbidden (MDN, em inglês)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/403" }
  statement: |
    A rota `GET /camarim` só é liberada para quem tem o papel `producao`. Um middleware anterior já leu as credenciais e preencheu `req.usuario`, com `null` quando ninguém fez login.

    Escreva `autorizar(req)`, que devolve `{ status, headers, body }`:

    - sem usuário: `401`, com o cabeçalho `www-authenticate` valendo `Basic realm="producao"`
    - com usuário, mas sem o papel `producao`: `403`
    - com o papel certo: `200` e `body` igual a `{ camarim: 'liberado' }`
  solution: |
    function autorizar(req) {
      if (!req.usuario) {
        return { status: 401, headers: { 'www-authenticate': 'Basic realm="producao"' }, body: { erro: 'faça login' } };
      }
      if (req.usuario.papel !== 'producao') return { status: 403, headers: {}, body: { erro: 'sem permissão' } };
      return { status: 200, headers: {}, body: { camarim: 'liberado' } };
    }
  tests:
    - name: sem login
      code: |
        const r = autorizar({ usuario: null });
        expect(r.status).toBe(401);
        expect(r.headers['www-authenticate']).toBe('Basic realm="producao"');
    - name: com o papel certo
      code: |
        const r = autorizar({ usuario: { nome: 'Rita', papel: 'producao' } });
        expect(r.status).toBe(200);
        expect(r.body).toEqual({ camarim: 'liberado' });
    - name: sem permissão
      hidden: true
      code: |
        expect(autorizar({ usuario: { nome: 'Leo', papel: 'imprensa' } }).status).toBe(403);
    - name: usuário ausente
      hidden: true
      code: |
        expect(autorizar({}).status).toBe(401);
  hints:
    - 401 quer dizer "não sei quem você é". 403 quer dizer "sei quem você é, e a resposta é não".
  explanation: |
    O nome oficial do 401 é "Unauthorized", mas ele trata de autenticação: faltam credenciais válidas, e o cabeçalho `WWW-Authenticate` diz como se autenticar. O 403 trata de autorização: a pessoa é conhecida, mas não pode. Trocar os dois confunde clientes, que tentam logar de novo em vez de mostrar "sem acesso".
  traps:
    - reason: 403 para quem não fez login
      code: |
        function autorizar(req) {
          if (!req.usuario || req.usuario.papel !== 'producao') return { status: 403, headers: {}, body: {} };
          return { status: 200, headers: {}, body: { camarim: 'liberado' } };
        }
    - reason: 401 para quem não tem o papel
      code: |
        function autorizar(req) {
          if (!req.usuario || req.usuario.papel !== 'producao') return { status: 401, headers: { 'www-authenticate': 'Basic realm="producao"' }, body: {} };
          return { status: 200, headers: {}, body: { camarim: 'liberado' } };
        }

- slug: envelope-soap
  title: O gateway de pagamento de 2008
  difficulty: facil
  kind: quiz
  in: [apis/SOAP]
  study:
    - { label: "SOAP (Wikipédia)", url: "https://pt.wikipedia.org/wiki/SOAP" }
    - { label: "SOAP 1.2, parte 1 (W3C, em inglês)", url: "https://www.w3.org/TR/soap12-part1/" }
  statement: |
    O festival precisa integrar com o gateway de pagamento de um banco. A documentação fala em `Envelope`, `Body`, `Fault` e manda tudo por `POST` em XML.

    O que é esse serviço?
  options:
    - text: Uma API SOAP, um protocolo em XML em que cada chamada é uma mensagem num envelope, e os erros vêm num elemento Fault
      why: Certo. SOAP ainda é comum em bancos, governos e sistemas corporativos antigos.
    - text: Uma API REST com JSON
      why: REST usa os métodos e status do HTTP sobre recursos, e normalmente JSON. Envelope e Fault são termos do SOAP.
    - text: Uma API GraphQL
      why: GraphQL usa uma linguagem de consulta própria, e responde em JSON.
    - text: Um WebSocket
      why: WebSocket é um canal bidirecional, sem envelope XML.
  answer: 0
  explanation: |
    SOAP define mensagens XML com um `Envelope`, um `Header` opcional e um `Body`. O transporte costuma ser HTTP `POST` para um único endereço, e a operação vai dentro da mensagem. Bibliotecas geram o cliente a partir do contrato WSDL, então quase ninguém escreve o XML à mão.

- slug: contrato-wsdl
  title: O arquivo que descreve o serviço
  difficulty: medio
  kind: quiz
  in: [apis/SOAP, apis/Open API Specs]
  study:
    - { label: "WSDL (Wikipédia)", url: "https://pt.wikipedia.org/wiki/Web_Services_Description_Language" }
  statement: |
    O banco mandou um arquivo `pagamentos.wsdl`. A pessoa que cuida da integração pergunta para que ele serve.

    Qual resposta está certa?
  options:
    - text: É o contrato do serviço SOAP, com as operações, os tipos das mensagens e o endereço. Ferramentas geram o cliente a partir dele, como o OpenAPI faz para REST
      why: Certo. WSDL descreve o serviço em XML, e o cliente gerado já sabe montar os envelopes.
    - text: É a chave de criptografia do banco
      why: Chaves e certificados são outros arquivos. O WSDL só descreve a interface.
    - text: É um log das chamadas já feitas
      why: Ele descreve o que dá para chamar, não o que foi chamado.
    - text: É o banco de dados do gateway
      why: Ele não contém dados, só a definição das operações.
  answer: 0
  explanation: |
    Contratos legíveis por máquina, como WSDL no SOAP, OpenAPI no REST e arquivos `.proto` no gRPC, permitem gerar clientes, validar mensagens e documentar a API a partir de uma fonte só.

- slug: varint-do-protobuf
  title: Como o gRPC escreve um número
  difficulty: medio
  kind: js
  in: [apis/gRPC]
  study:
    - { label: "Codificação do Protocol Buffers (em inglês)", url: "https://protobuf.dev/programming-guides/encoding/" }
  statement: |
    O gRPC manda as mensagens em Protocol Buffers, um formato binário. Inteiros viram varints: o número é cortado em grupos de 7 bits, do menos significativo para o mais significativo. Cada grupo vira um byte, e o bit mais alto do byte, `128`, vale 1 quando ainda há bytes depois.

    Escreva `varint(n)`, que recebe um inteiro não negativo e devolve o array de bytes. Por exemplo, `300` vira `[172, 2]`. O número pode passar de 2³², então não use operadores de bits, que trabalham com 32 bits.
  solution: |
    function varint(n) {
      const bytes = [];
      do {
        let byte = n % 128;
        n = Math.floor(n / 128);
        if (n > 0) byte += 128;
        bytes.push(byte);
      } while (n > 0);
      return bytes;
    }
  tests:
    - name: números pequenos cabem num byte
      code: |
        expect(varint(1)).toEqual([1]);
        expect(varint(127)).toEqual([127]);
    - name: "300"
      code: |
        expect(varint(300)).toEqual([172, 2]);
    - name: zero
      hidden: true
      code: |
        expect(varint(0)).toEqual([0]);
    - name: "128"
      hidden: true
      code: |
        expect(varint(128)).toEqual([128, 1]);
    - name: acima de 32 bits
      hidden: true
      code: |
        expect(varint(2 ** 32)).toEqual([128, 128, 128, 128, 16]);
  hints:
    - "`n % 128` dá os 7 bits de baixo, e `Math.floor(n / 128)` tira esses bits."
    - O zero ainda ocupa um byte. Um `do ... while` garante isso.
  explanation: |
    Varints gastam poucos bytes com números pequenos, que são os mais comuns, e é um dos motivos de o Protocol Buffers ser menor que JSON. Operadores de bits em JavaScript convertem para 32 bits, então números grandes precisam de aritmética comum ou de `BigInt`.
  traps:
    - reason: Operadores de bits quebram acima de 32 bits
      code: |
        function varint(n) {
          const bytes = [];
          do { let b = n & 127; n >>>= 7; if (n) b |= 128; bytes.push(b); } while (n);
          return bytes;
        }
    - reason: Bytes na ordem inversa
      code: |
        function varint(n) {
          const grupos = [];
          do { grupos.unshift(n % 128); n = Math.floor(n / 128); } while (n > 0);
          return grupos.map((g, i) => (i < grupos.length - 1 ? g + 128 : g));
        }
    - reason: Zero vira um array vazio
      code: |
        function varint(n) {
          const bytes = [];
          while (n > 0) { let b = n % 128; n = Math.floor(n / 128); if (n > 0) b += 128; bytes.push(b); }
          return bytes;
        }

- slug: prazo-no-grpc
  title: A chamada que esperou para sempre
  difficulty: medio
  kind: quiz
  visual: disjuntor
  in: [apis/gRPC, building-for-scale/Graceful Degradation]
  study:
    - { label: "Deadlines no gRPC (em inglês)", url: "https://grpc.io/docs/guides/deadlines/" }
    - { label: "Códigos de status do gRPC (em inglês)", url: "https://grpc.io/docs/guides/status-codes/" }
  statement: |
    O serviço de ingressos chama o de pagamentos por gRPC, que chama o antifraude. O antifraude travou, e as chamadas do serviço de ingressos ficaram penduradas até esgotar as conexões.

    O que o gRPC oferece para isso?
  options:
    - text: Um deadline em cada chamada, que se propaga para as chamadas seguintes. Quando o prazo acaba, todas falham com DEADLINE_EXCEEDED e liberam os recursos
      why: Certo. Sem deadline, uma chamada gRPC pode esperar indefinidamente.
    - text: Nada. É preciso reiniciar os servidores
      why: Reiniciar trata o sintoma. O deadline evita que a espera se acumule.
    - text: Trocar para REST resolve, porque HTTP tem tempo limite automático
      why: Clientes HTTP também podem esperar indefinidamente sem um tempo limite configurado.
    - text: Aumentar o número de conexões
      why: Mais conexões penduradas só adiam o problema.
  answer: 0
  explanation: |
    Em gRPC, o cliente define um prazo absoluto, e as bibliotecas repassam o tempo restante para as chamadas que o servidor faz em seguida. Assim, uma cadeia de serviços desiste junto, em vez de cada um esperar o próprio tempo limite.

- slug: grpc-ou-rest
  title: Onde o gRPC faz sentido
  difficulty: medio
  kind: quiz
  in: [apis/gRPC, apis/REST]
  study:
    - { label: "Introdução ao gRPC (em inglês)", url: "https://grpc.io/docs/what-is-grpc/introduction/" }
  statement: |
    O festival tem uma API pública, usada pelo app e por parceiros, e uma dezena de serviços internos que conversam entre si milhares de vezes por segundo.

    Onde o gRPC combina melhor?
  options:
    - text: Entre os serviços internos, com contrato em .proto, mensagens binárias e HTTP/2. Na API pública, REST com JSON é mais fácil para parceiros e navegadores
      why: Certo. Navegadores não falam gRPC diretamente, e precisam de gRPC-Web e de um proxy.
    - text: Só na API pública, porque navegadores falam gRPC nativamente
      why: Navegadores não expõem o controle de HTTP/2 que o gRPC precisa.
    - text: Em nenhum lugar, porque gRPC é só para jogos
      why: gRPC é muito usado entre microsserviços.
    - text: Nos dois, porque JSON está obsoleto
      why: JSON continua sendo o formato mais compatível para APIs públicas.
  answer: 0
  explanation: |
    gRPC traz contratos fortes, código gerado em várias linguagens, streaming e mensagens compactas. Em troca, é menos legível e precisa de ferramentas para depurar. APIs públicas costumam ficar em REST ou GraphQL.

- slug: validar-com-esquema
  title: O corpo do pedido contra o contrato
  difficulty: dificil
  kind: js
  in: [apis/Open API Specs, apis/JSON APIs]
  study:
    - { label: "Tipos de dados no OpenAPI (Swagger, em inglês)", url: "https://swagger.io/docs/specification/v3_0/data-models/data-types/" }
    - { label: "JSON Schema: type (em inglês)", url: "https://json-schema.org/understanding-json-schema/reference/type" }
  statement: |
    O contrato OpenAPI da rota `POST /pedidos` descreve o corpo com um esquema. Escreva `validar(esquema, valor)`, que devolve a lista de caminhos inválidos, como `['$.quantidade']`, ou `[]` quando está tudo certo. A raiz é `$`.

    Suporte estas palavras do esquema:

    - `type`: `object`, `array`, `string`, `integer`, `number` ou `boolean`. Arrays e `null` não são `object`
    - `required`: propriedades obrigatórias de um objeto. Cada uma que falta gera o caminho dela, como `$.show_id`
    - `properties`: o esquema de cada propriedade, validado quando ela existe
    - `items`: o esquema de cada item de um array, com caminhos como `$.assentos[1]`
    - `minimum` e `enum`

    Quando um valor tem tipo, `enum` ou `minimum` errado, só o caminho dele entra na lista, sem olhar o que há dentro. A ordem da lista não importa.
  solution: |
    function validar(esquema, valor, caminho = '$') {
      const tipos = {
        object: (v) => typeof v === 'object' && v !== null && !Array.isArray(v),
        array: Array.isArray,
        string: (v) => typeof v === 'string',
        integer: Number.isInteger,
        number: (v) => typeof v === 'number' && Number.isFinite(v),
        boolean: (v) => typeof v === 'boolean',
      };
      if (esquema.type && !tipos[esquema.type](valor)) return [caminho];
      if (esquema.enum && !esquema.enum.includes(valor)) return [caminho];
      if (esquema.minimum !== undefined && valor < esquema.minimum) return [caminho];
      const erros = [];
      if (esquema.type === 'object') {
        for (const nome of esquema.required ?? []) if (!Object.hasOwn(valor, nome)) erros.push(`${caminho}.${nome}`);
        for (const [nome, sub] of Object.entries(esquema.properties ?? {})) {
          if (Object.hasOwn(valor, nome)) erros.push(...validar(sub, valor[nome], `${caminho}.${nome}`));
        }
      }
      if (esquema.type === 'array' && esquema.items) {
        valor.forEach((item, i) => erros.push(...validar(esquema.items, item, `${caminho}[${i}]`)));
      }
      return erros;
    }
  tests:
    - name: pedido válido
      code: |
        const esquema = {
          type: 'object', required: ['show_id', 'quantidade'],
          properties: { show_id: { type: 'integer' }, quantidade: { type: 'integer', minimum: 1 } },
        };
        expect(validar(esquema, { show_id: 3, quantidade: 2 })).toEqual([]);
    - name: campo obrigatório e mínimo
      code: |
        const esquema = {
          type: 'object', required: ['show_id', 'quantidade'],
          properties: { show_id: { type: 'integer' }, quantidade: { type: 'integer', minimum: 1 } },
        };
        expect(validar(esquema, { quantidade: 0 }).sort()).toEqual(['$.quantidade', '$.show_id']);
    - name: integer não aceita fração
      hidden: true
      code: |
        expect(validar({ type: 'integer' }, 2.5)).toEqual(['$']);
        expect(validar({ type: 'number' }, 2.5)).toEqual([]);
    - name: "null e arrays não são object"
      hidden: true
      code: |
        expect(validar({ type: 'object' }, null)).toEqual(['$']);
        expect(validar({ type: 'object' }, [])).toEqual(['$']);
    - name: itens de array e enum
      hidden: true
      code: |
        const esquema = {
          type: 'object',
          properties: {
            setor: { type: 'string', enum: ['pista', 'camarote'] },
            assentos: { type: 'array', items: { type: 'integer', minimum: 1 } },
          },
        };
        expect(validar(esquema, { setor: 'vip', assentos: [4, 0, 'x'] }).sort()).toEqual(['$.assentos[1]', '$.assentos[2]', '$.setor']);
    - name: tipo errado não olha dentro
      hidden: true
      code: |
        const esquema = { type: 'object', required: ['a'], properties: { a: { type: 'object', required: ['b'] } } };
        expect(validar(esquema, { a: 'texto' })).toEqual(['$.a']);
  hints:
    - Escreva uma função para cada tipo. A de `object` precisa recusar `null` e arrays.
    - A função chama a si mesma para cada propriedade e cada item, com o caminho acrescido.
  explanation: |
    OpenAPI descreve os corpos com JSON Schema. Validar a entrada contra o contrato, na borda da API, garante mensagens de erro consistentes e evita que dados malformados cheguem à regra de negócio. Bibliotecas como Ajv fazem isso de verdade, com muitas outras palavras do esquema.
  traps:
    - reason: typeof aceita null e arrays como object
      code: |
        function validar(e, v, c = '$') {
          const ok = { object: (x) => typeof x === 'object', array: Array.isArray, string: (x) => typeof x === 'string', integer: Number.isInteger, number: (x) => typeof x === 'number', boolean: (x) => typeof x === 'boolean' };
          if (e.type && !ok[e.type](v)) return [c];
          if (e.enum && !e.enum.includes(v)) return [c];
          if (e.minimum !== undefined && v < e.minimum) return [c];
          const r = [];
          if (e.type === 'object' && v) {
            for (const n of e.required ?? []) if (!(n in v)) r.push(`${c}.${n}`);
            for (const [n, s] of Object.entries(e.properties ?? {})) if (n in v) r.push(...validar(s, v[n], `${c}.${n}`));
          }
          if (e.type === 'array' && e.items) v.forEach((x, i) => r.push(...validar(e.items, x, `${c}[${i}]`)));
          return r;
        }
    - reason: integer aceita fração
      code: |
        function validar(e, v, c = '$') {
          const ok = { object: (x) => typeof x === 'object' && x !== null && !Array.isArray(x), array: Array.isArray, string: (x) => typeof x === 'string', integer: (x) => typeof x === 'number', number: (x) => typeof x === 'number', boolean: (x) => typeof x === 'boolean' };
          if (e.type && !ok[e.type](v)) return [c];
          if (e.enum && !e.enum.includes(v)) return [c];
          if (e.minimum !== undefined && v < e.minimum) return [c];
          const r = [];
          if (e.type === 'object') {
            for (const n of e.required ?? []) if (!(n in v)) r.push(`${c}.${n}`);
            for (const [n, s] of Object.entries(e.properties ?? {})) if (n in v) r.push(...validar(s, v[n], `${c}.${n}`));
          }
          if (e.type === 'array' && e.items) v.forEach((x, i) => r.push(...validar(e.items, x, `${c}[${i}]`)));
          return r;
        }

