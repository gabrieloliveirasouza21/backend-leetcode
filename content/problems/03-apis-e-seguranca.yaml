  statement: |
    Um patrocinador quer que os funcionários entrem no portal de credenciamento com a conta da empresa. O time de TI deles mandou um arquivo de metadados SAML e falou em IdP e SP.

    Como esse login funciona?
  options:
    - text: O portal é o SP, o provedor de serviço. Ele redireciona a pessoa ao IdP da empresa, que autentica e devolve uma asserção XML assinada dizendo quem ela é
      why: Certo. O portal confia no IdP por meio do certificado trocado nos metadados.
    - text: O portal recebe a senha da conta da empresa e confere no próprio banco
      why: No SAML, a senha só é digitada no IdP. O portal nunca a vê.
    - text: SAML é um formato de log de acesso
      why: SAML é um padrão de autenticação e troca de identidade entre organizações.
    - text: O IdP é o portal, e o SP é a empresa
      why: É o contrário. Quem fornece a identidade é a empresa, e quem fornece o serviço é o portal.
  answer: 0
  explanation: |
    SAML 2.0 é o padrão de login único mais comum em empresas. A troca acontece pelo navegador, com redirecionamentos e formulários, e a confiança vem das assinaturas XML. Em sistemas novos, OpenID Connect faz o mesmo papel com JSON.

- slug: aceitar-assercao-saml
  title: A asserção que chegou duas vezes
  difficulty: dificil
  kind: quiz
  in: [apis/SAML, web-security/OWASP Risks]
  study:
    - { label: "SAML Security Cheat Sheet (OWASP, em inglês)", url: "https://cheatsheetseries.owasp.org/cheatsheets/SAML_Security_Cheat_Sheet.html" }
  statement: |
    O portal recebe uma asserção SAML com a assinatura válida do IdP. Antes de criar a sessão, o que mais ele precisa conferir?
  options:
    - text: Que a audiência é o próprio portal, que a validade NotOnOrAfter não passou, e que o ID da asserção ainda não foi usado, para impedir reenvio
      why: Certo. Uma assinatura válida só prova a origem. O resto prova que ela é para este portal, agora, e uma vez só.
    - text: Nada, a assinatura válida basta
      why: Uma asserção legítima de outro serviço, ou capturada e reenviada, também tem assinatura válida.
    - text: Que o XML está bem indentado
      why: Formatação não tem efeito na segurança.
    - text: Que a pessoa já tem conta no portal com a mesma senha
      why: No SAML, o portal nunca recebe a senha.
  answer: 0
  explanation: |
    Bibliotecas SAML conferem assinatura, audiência, validade e destino. Falhas clássicas incluem aceitar asserções sem assinatura, assinar só parte do XML e não guardar os IDs já usados. Use uma biblioteca mantida, nunca um parser XML caseiro.

- slug: htaccess-do-apache
  title: O arquivo em cada pasta
  difficulty: facil
  kind: quiz
  in: [web-servers/Apache]
  study:
    - { label: "Tutorial de .htaccess (Apache, em inglês)", url: "https://httpd.apache.org/docs/current/howto/htaccess.html" }
  statement: |
    O site antigo do festival roda num Apache de hospedagem compartilhada. Para redirecionar uma página, a hospedagem orienta criar um arquivo `.htaccess` na pasta.

    O que é esse arquivo, e qual o custo dele?
  options:
    - text: Uma configuração do Apache por pasta, lida a cada pedido. É útil quando não há acesso à configuração principal, mas é mais lenta que pôr as regras lá
      why: Certo. A documentação do Apache recomenda a configuração principal sempre que houver acesso a ela.
    - text: Um arquivo de senha do banco de dados
      why: Ele guarda diretivas do Apache, como redirecionamentos e regras de acesso.
    - text: Um arquivo que o Nginx também lê
      why: O Nginx não tem configuração por pasta e ignora o .htaccess.
    - text: Um arquivo lido uma vez, ao iniciar o servidor
      why: Ele é procurado e lido a cada pedido, o que custa desempenho.
  answer: 0
  explanation: |
    O Apache é modular e permite configuração distribuída por pasta, o que o tornou o padrão das hospedagens compartilhadas. O Nginx usa um modelo orientado a eventos e configuração central, e por isso costuma lidar melhor com muitas conexões simultâneas.

