- slug: conferir-id-token
  title: O login com a conta do festival
  difficulty: dificil
  kind: js
  in: [apis/OpenID, apis/OAuth]
  study:
    - { label: "Validação do ID Token (OpenID Connect Core, em inglês)", url: "https://openid.net/specs/openid-connect-core-1_0.html#IDTokenValidation" }
    - { label: "Como o OpenID Connect funciona (em inglês)", url: "https://openid.net/developers/how-connect-works/" }
  statement: |
    O app de parceiros faz login com OpenID Connect. A assinatura do ID Token já foi conferida por uma biblioteca, e você recebe as `claims` decodificadas.

    Escreva `conferirIdToken(claims, { emissor, clienteId, nonce, agora })`, que devolve `null` quando o token vale ou o primeiro problema, nesta ordem:

    1. `'emissor'`: `iss` diferente de `emissor`
    2. `'audiencia'`: `aud` não contém `clienteId`. `aud` pode ser texto ou array
    3. `'expirado'`: `exp`, em segundos, é menor ou igual a `agora`
    4. `'nonce'`: `nonce` diferente do que o app gerou
  solution: |
    function conferirIdToken(claims, { emissor, clienteId, nonce, agora }) {
      if (claims.iss !== emissor) return 'emissor';
      const audiencia = Array.isArray(claims.aud) ? claims.aud : [claims.aud];
      if (!audiencia.includes(clienteId)) return 'audiencia';
      if (typeof claims.exp !== 'number' || claims.exp <= agora) return 'expirado';
      if (claims.nonce !== nonce) return 'nonce';
      return null;
    }
  tests:
    - name: token válido
      code: |
        const ctx = { emissor: 'https://login.festival.com', clienteId: 'app-parceiros', nonce: 'n1', agora: 1000 };
        expect(conferirIdToken({ iss: 'https://login.festival.com', aud: 'app-parceiros', exp: 1600, nonce: 'n1' }, ctx)).toBe(null);
    - name: emissor errado
      code: |
        const ctx = { emissor: 'https://login.festival.com', clienteId: 'app-parceiros', nonce: 'n1', agora: 1000 };
        expect(conferirIdToken({ iss: 'https://evil.com', aud: 'app-parceiros', exp: 1600, nonce: 'n1' }, ctx)).toBe('emissor');
    - name: audiência em array
      hidden: true
      code: |
        const ctx = { emissor: 'e', clienteId: 'app', nonce: 'n', agora: 10 };
        expect(conferirIdToken({ iss: 'e', aud: ['outro', 'app'], exp: 20, nonce: 'n' }, ctx)).toBe(null);
        expect(conferirIdToken({ iss: 'e', aud: ['outro'], exp: 20, nonce: 'n' }, ctx)).toBe('audiencia');
    - name: expira no segundo exato
      hidden: true
      code: |
        const ctx = { emissor: 'e', clienteId: 'app', nonce: 'n', agora: 10 };
        expect(conferirIdToken({ iss: 'e', aud: 'app', exp: 10, nonce: 'n' }, ctx)).toBe('expirado');
        expect(conferirIdToken({ iss: 'e', aud: 'app', nonce: 'n' }, ctx)).toBe('expirado');
    - name: nonce de outro login
      hidden: true
      code: |
        const ctx = { emissor: 'e', clienteId: 'app', nonce: 'n', agora: 10 };
        expect(conferirIdToken({ iss: 'e', aud: 'app', exp: 20, nonce: 'velho' }, ctx)).toBe('nonce');
  hints:
    - Transforme `aud` num array sempre, e use `includes`.
  explanation: |
    OpenID Connect acrescenta identidade ao OAuth 2.0: o ID Token diz quem fez login, para qual aplicativo e até quando. Conferir emissor e audiência impede aceitar um token emitido para outro app. O `nonce` liga o token ao pedido de login que o próprio app iniciou e impede reaproveitar um token antigo.
  traps:
    - reason: aud só como texto
      code: |
        function conferirIdToken(c, { emissor, clienteId, nonce, agora }) {
          if (c.iss !== emissor) return 'emissor';
          if (c.aud !== clienteId) return 'audiencia';
          if (!(c.exp > agora)) return 'expirado';
          if (c.nonce !== nonce) return 'nonce';
          return null;
        }
    - reason: Aceita o segundo exato da expiração
      code: |
        function conferirIdToken(c, { emissor, clienteId, nonce, agora }) {
          if (c.iss !== emissor) return 'emissor';
          if (![].concat(c.aud).includes(clienteId)) return 'audiencia';
          if (c.exp < agora) return 'expirado';
          if (c.nonce !== nonce) return 'nonce';
          return null;
        }

- slug: id-token-ou-access-token
  title: Dois tokens no mesmo login
  difficulty: medio
  kind: quiz
  in: [apis/OpenID, apis/OAuth, apis/JWT]
  study:
    - { label: "Como o OpenID Connect funciona (em inglês)", url: "https://openid.net/developers/how-connect-works/" }
  statement: |
    Depois do login com OpenID Connect, o app recebeu um `id_token` e um `access_token`. Um dev começou a mandar o `id_token` para a API de pedidos, no cabeçalho `Authorization`.

    O que está errado?
  options:
    - text: O ID Token diz ao app quem fez login. Para chamar APIs, o certo é o access token, emitido para aquela API, com os escopos permitidos
      why: Certo. A audiência do ID Token é o próprio app, não a API.
    - text: Nada, os dois tokens são iguais
      why: Eles têm propósitos e audiências diferentes.
    - text: O certo é mandar a senha da pessoa para a API
      why: O objetivo do OAuth é justamente nunca repassar a senha.
    - text: O access token serve para mostrar o nome da pessoa na tela
      why: Quem traz os dados de identidade para o app é o ID Token, ou o endpoint userinfo.
  answer: 0
  explanation: |
    OAuth 2.0 trata de autorização: um access token permite chamar uma API em nome de alguém. OpenID Connect acrescenta autenticação, com o ID Token, um JWT sobre a pessoa que fez login. Misturar os dois faz a API aceitar tokens que não foram emitidos para ela.

- slug: login-corporativo-saml
